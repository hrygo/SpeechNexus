# BUILD-ONLY example override: pass the Web build's network arguments so a host that
# cannot reach Docker Hub or `registry.npmjs.org` at a usable rate can still build the
# image. It is not part of the shipped topology, and it changes arguments only — never
# the Dockerfile, the image name, the runtime environment or the bundle.
#
# `deploy/compose.yaml` neither includes nor references this file, and Compose only
# auto-loads a file literally named `compose.override.yaml`, so its presence changes
# nothing on its own. `tests/ci/test_web_build_arguments.py` holds that.
#
# When to reach for it: `deploy/README.md`, section "Build window and registry route",
# gives the criteria. In short, a cold `docker pull` of the base image that cannot hold
# roughly 1 MiB/s per layer means an uncached product build will not finish inside a
# 900 s window, and these arguments are the way through.
#
# Usage — the repository file stays first, this file is added, nothing is replaced:
#
#   export SPEECHNEXUS_NODE_BASE_IMAGE=docker.m.daocloud.io/library/node:26.12.1-bookworm-slim
#   export SPEECHNEXUS_NGINX_BASE_IMAGE=docker.m.daocloud.io/nginxinc/nginx-unprivileged:1.31-alpine
#   export SPEECHNEXUS_NPM_REGISTRY=https://registry.npmmirror.com
#   docker compose -f deploy/compose.yaml \
#     -f deploy/compose.build-mirror.override.yaml \
#     --profile web build workbench
#
# Leaving the `SPEECHNEXUS_*` variables unset makes every argument resolve to the
# value `deploy/images/web.Dockerfile` already defaults to, so this file is also a
# no-op then.
#
# Two things do not belong here: credentials — a mirror that needs authentication is
# configured on the Docker daemon, never in a Compose file that ships in the
# repository — and TLS relaxation. A private or session CA is supplied as the
# `proxy_ca` BuildKit secret, the same way the product build consumes it.
services:
  admin:
    build:
      args:
        NODE_BASE_IMAGE: ${SPEECHNEXUS_NODE_BASE_IMAGE:-node:26.12.1-bookworm-slim}
        NGINX_BASE_IMAGE: ${SPEECHNEXUS_NGINX_BASE_IMAGE:-nginxinc/nginx-unprivileged:1.31-alpine}
        NPM_REGISTRY: ${SPEECHNEXUS_NPM_REGISTRY:-}

  workbench:
    build:
      args:
        NODE_BASE_IMAGE: ${SPEECHNEXUS_NODE_BASE_IMAGE:-node:26.12.1-bookworm-slim}
        NGINX_BASE_IMAGE: ${SPEECHNEXUS_NGINX_BASE_IMAGE:-nginxinc/nginx-unprivileged:1.31-alpine}
        NPM_REGISTRY: ${SPEECHNEXUS_NPM_REGISTRY:-}
