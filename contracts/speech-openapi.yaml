  /v1/nexus/realtime/sessions:
    post:
      tags: [realtime]
      operationId: createRealtimeSession
      summary: Create and validate a realtime session
      description: |
        Validates entry policy, parameters, versions, and capacity policy and
        records a session in `created` state. The session expires if no
        WebSocket connects within 30 seconds; no inference slot is held before
        admission. Resource reservation happens atomically when the socket
        connects.
      parameters:
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RealtimeSessionCreateRequest"
      responses:
        "201":
          description: Session created.
          headers:
            Location:
              description: Relative or absolute session URL.
              schema:
                type: string
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealtimeSession"
