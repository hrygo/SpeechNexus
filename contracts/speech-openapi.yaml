      properties:
        profile:
          oneOf:
            - $ref: "#/components/schemas/ResourceReference"
            - type: "null"
        models:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            asr:
              $ref: "#/components/schemas/ResourceReference"
            tts:
              $ref: "#/components/schemas/ResourceReference"
            voice:
              $ref: "#/components/schemas/ResourceReference"
        voice:
          oneOf:
            - $ref: "#/components/schemas/ResourceReference"
            - type: "null"
        pronunciation:
          oneOf:
            - $ref: "#/components/schemas/ResourceReference"
            - type: "null"
        parameters:
          type: object
          additionalProperties: false
