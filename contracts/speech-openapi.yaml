          minLength: 1
          maxLength: 128
    AdmissionReadiness:
      type: object
      additionalProperties: false
      required: [status, cause, workspace_id, checked_at, detail, instances, capacity]
      properties:
        status:
          type: string
          enum: [admitting, degraded]
          description: |
            `admitting` if and only if `cause` is null, and if and only if a create
            for every admissible published binding would be admitted at this instant;
            `degraded` otherwise. This is the
            one field a poller has to assert on. The two conditions are not a second
            verdict beside `cause`: the schema below constrains them together, so a
            body cannot claim a cause while admitting or be degraded without naming
            one.
        cause:
          oneOf:
            - type: "null"
            - type: string
              enum:
                - engine_receipt_expired
                - engine_state_mismatch
                - engine_resource_disabled
                - capacity_exhausted
                - workspace_not_found
                - workspace_disabled
                - workspace_not_configured
                - storage_unavailable
          description: |
            One value, never a set: the refusal class a create would answer at this
            instant for the first admissible published binding in ascending
            `binding_revision_id` order, or null when every admissible published
            binding would admit a create. The create path answers one code and the
            report repeats that one code. `storage_unavailable` is the only member
            reported for an unreadable store, because no other fact could have been
            read.
        workspace_id:
          $ref: "#/components/schemas/Identifier"
        checked_at:
          type: string
          format: date-time
          description: The coordination store's clock reading the verdict used.
        detail:
          type: [string, "null"]
          maxLength: 1024
          description: |
            One sentence naming the cause, the public create code it answers and the
            recovery, or null exactly when `status` is `admitting`. Machine consumers
            read `cause`; this is the sentence an operator reads.
        instances:
          type: array
          description: |
            One row per admissible published binding that has a pin target: the one
            instance a create for that binding would select, under the same rule a
            create applies, in ascending `(binding_revision_id, instance_id,
            instance_generation)` order. A binding with no `ready` instance
            contributes the `capacity_exhausted` cause but no row, because there is no
            instance whose receipt to report. Empty when the store could not be read,
            and empty when no binding is admissible -- that body still carries the
            `capacity_exhausted` cause rather than `admitting`. An instance reachable
            only through a second generation of the same binding, through a binding
            that is not published, or through a superseded revision of a published
            binding is not listed: a create cannot name it.
          items:
            $ref: "#/components/schemas/AdmissionReadinessInstance"
        capacity:
          oneOf:
            - $ref: "#/components/schemas/AdmissionReadinessCapacity"
            - type: "null"
          description: |
            The reported workspace's quota counters, or null when it has no quota row
            (`workspace_not_configured`) or the store could not be read.
      allOf:
        # `status` and `cause` are one value split in two, so the contract forbids the
        # two combinations that made the multi-valued report unreadable: admitting
        # with a refusal to explain, and degraded without the code a create answers.
        # `detail` follows the same rule, so the prose cannot describe a refusal the
        # machine never named.
        - if:
            properties:
              status:
                const: admitting
            required: [status]
          then:
            properties:
              cause:
                type: "null"
              detail:
                type: "null"
        - if:
            properties:
              status:
                const: degraded
            required: [status]
          then:
            properties:
              cause:
                type: string
              detail:
                type: string
    AdmissionReadinessInstance:
      type: object
      additionalProperties: false
      required:
        - instance_id
        - instance_generation
        - readiness_state
        - readiness_expires_at
        - remaining_seconds
        - max_slots
        - held_slots
        - quarantined_slots
      properties:
        instance_id:
          $ref: "#/components/schemas/Identifier"
        instance_generation:
          type: integer
          minimum: 1
        readiness_state:
          type: string
          enum: [valid, expiring, expired, missing, invalid]
          description: |
            The readiness *window*, the same vocabulary the read-only
            `speechnexus-engine-readiness` report prints. `expiring` is inside the
            warning interval but still admits work; `missing` and `invalid` are
            receipts admission cannot read at all.
        readiness_expires_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        remaining_seconds:
          type: [integer, "null"]
          description: Whole seconds left before `readiness_expires_at`; negative once elapsed.
        max_slots:
          type: integer
          minimum: 0
        held_slots:
          type: integer
          minimum: 0
        quarantined_slots:
          type: integer
          minimum: 0
    AdmissionReadinessCapacity:
      type: object
      additionalProperties: false
      required: [max_attempts, held_attempts, quarantined_attempts]
      properties:
        max_attempts:
          type: integer
          minimum: 0
        held_attempts:
          type: integer
          minimum: 0
        quarantined_attempts:
          type: integer
          minimum: 0
    VoiceRetirementRequest:
      $ref: "shared/lifecycle.schema.json#/$defs/RetirementRequest"
