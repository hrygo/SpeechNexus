        "409":
          $ref: "#/components/responses/Conflict"
  /v1/realtime:
    get:
      tags: [realtime]
      operationId: connectRealtime
      summary: Upgrade to the realtime WebSocket
      description: |
        WebSocket upgrade endpoint. Supply exactly one of `session_id` or
        `model`.

        * `session_id` connects to a pre-created nexus session and enables the
          declared standard ASR subset plus nexus.* TTS, metadata, and operation
          events.
        * `model` opens an OpenAI-compatible transcription-only session using
          deployment defaults. This mode is for standard Realtime SDKs and does
          not enable TTS, response.*, tool calls, or conversation history.

        The server validates Origin/Host for browser connections. A shared
        service key, when enabled, is supplied through the Authorization header
        and never in the URL. session_id is a routing identifier, not a
        credential.
      parameters:
        - name: session_id
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Identifier"
        - name: model
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: OpenAI-Beta
          in: header
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "101":
          description: |
            WebSocket protocol switch. JSON events conform to
            realtime-events.schema.json. Binary audio is not used on the public
            WebSocket in P0; ASR audio is base64 inside
            input_audio_buffer.append and TTS audio is base64 inside
            nexus.tts.audio.delta.
          x-websocket-event-schema:
            $ref: "./realtime-events.schema.json"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
