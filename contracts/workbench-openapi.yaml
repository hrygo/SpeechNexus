    ExportEvent:
      oneOf:
        - $ref: "#/components/schemas/ExportQueuedEvent"
        - $ref: "#/components/schemas/ExportProgressEvent"
        - $ref: "#/components/schemas/ExportSucceededEvent"
        - $ref: "#/components/schemas/ExportFailedEvent"
        - $ref: "#/components/schemas/ExportCancelledEvent"
        - $ref: "#/components/schemas/ExportArtifactPublishedEvent"
      discriminator:
        propertyName: type
        mapping:
          export.queued: "#/components/schemas/ExportQueuedEvent"
          export.progress: "#/components/schemas/ExportProgressEvent"
          export.succeeded: "#/components/schemas/ExportSucceededEvent"
          export.failed: "#/components/schemas/ExportFailedEvent"
          export.cancelled: "#/components/schemas/ExportCancelledEvent"
          export.artifact_published: "#/components/schemas/ExportArtifactPublishedEvent"
      examples:
        - id: "1"
          type: export.queued
          export_id: export_demo
          occurred_at: "2026-10-23T00:00:00Z"
          data:
            status: queued
        - id: "2"
          type: export.progress
          export_id: export_demo
          occurred_at: "2026-10-23T00:00:01Z"
          data:
            status: running
            progress_completed: 2
            progress_total: 5
        - id: "3"
          type: export.succeeded
          export_id: export_demo
          occurred_at: "2026-10-23T00:00:02Z"
          data:
            status: succeeded
            artifact:
              id: export_artifact_demo
              object: nexus.export_artifact
              export_id: export_demo
              manifest_revision: "3"
              media_type: application/zip
              bytes: 2048
              sha256: "sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
              created_at: "2026-10-23T00:00:02Z"
        - id: "4"
          type: export.failed
          export_id: export_demo
          occurred_at: "2026-10-23T00:00:03Z"
          data:
            status: failed
            error:
              code: export_failure
              message: synthetic export failure
              retryable: false
        - id: "5"
          type: export.cancelled
          export_id: export_demo
          occurred_at: "2026-10-23T00:00:04Z"
          data:
            status: cancelled
        - id: "6"
          type: export.artifact_published
          export_id: export_demo
          occurred_at: "2026-10-23T00:00:05Z"
          data:
            artifact:
              id: export_artifact_demo
              object: nexus.export_artifact
              export_id: export_demo
              manifest_revision: "3"
              media_type: application/zip
              bytes: 2048
              sha256: "sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
              created_at: "2026-10-23T00:00:02Z"
