      type: string
      enum: [asr_input, voice_reference, text_input]
    AssetStatus:
      type: string
      enum: [staging, ready, rejected, expired, deleted]
    AssetUploadRequest:
      type: object
      additionalProperties: false
      required: [file, purpose]
      properties:
        file:
          type: string
          format: binary
        workspace_id:
          $ref: "#/components/schemas/Identifier"
          default: workspace-default
        purpose:
          $ref: "#/components/schemas/AssetPurpose"
        ttl_seconds:
          type: integer
          minimum: 60
          maximum: 31536000
        sha256:
          $ref: "#/components/schemas/Sha256Digest"
    Asset:
      type: object
      additionalProperties: false
      required: [id, object, workspace_id, purpose, status, media_type, bytes, sha256, created_at]
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        object:
          const: nexus.asset
        workspace_id:
          $ref: "#/components/schemas/Identifier"
        purpose:
          $ref: "#/components/schemas/AssetPurpose"
        status:
          $ref: "#/components/schemas/AssetStatus"
        media_type:
          type: string
          minLength: 1
          maxLength: 128
        bytes:
          type: integer
          minimum: 0
        sha256:
          $ref: "#/components/schemas/Sha256Digest"
        duration_ms:
          type: [integer, "null"]
          minimum: 0
        sample_rate_hz:
          type: [integer, "null"]
          minimum: 8000
          maximum: 192000
        channels:
          type: [integer, "null"]
          minimum: 1
          maximum: 8
        created_at:
          type: string
          format: date-time
        expires_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
      allOf:
        - if:
            properties:
              status:
                const: ready
            required: [status]
          then:
            properties:
              bytes:
                minimum: 1
        - if:
            allOf:
              - properties:
                  status:
                    const: ready
                required: [status]
              - properties:
                  purpose:
                    enum: [asr_input, voice_reference]
                required: [purpose]
          then:
            required: [duration_ms, sample_rate_hz, channels]
            properties:
              duration_ms:
                type: integer
                minimum: 1
              sample_rate_hz:
                type: integer
              channels:
                type: integer
        - if:
            allOf:
              - properties:
                  status:
                    const: ready
                required: [status]
              - properties:
                  purpose:
                    const: text_input
                required: [purpose]
          then:
            properties:
              duration_ms:
                type: "null"
              sample_rate_hz:
                type: "null"
              channels:
                type: "null"
