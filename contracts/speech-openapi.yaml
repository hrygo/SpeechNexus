        voice_draft_id:
          $ref: "#/components/schemas/Identifier"
        draft_revision:
          $ref: "#/components/schemas/Revision"
        validation_set_revision:
          $ref: "#/components/schemas/Revision"
    Job:
      type: object
      additionalProperties: false
      required:
        - id
        - object
        - kind
        - status
        - cleanup_state
        - request_id
        - workspace_id
        - execution_revision
        - progress
        - artifacts
        - operations
        - effective_configuration
        - created_at
        - updated_at
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        object:
          const: nexus.job
        kind:
          $ref: "#/components/schemas/JobKind"
        status:
          $ref: "#/components/schemas/JobStatus"
        cleanup_state:
          $ref: "#/components/schemas/CleanupState"
        request_id:
          type: string
          minLength: 1
          maxLength: 128
        workspace_id:
          $ref: "#/components/schemas/Identifier"
        client_reference:
          type: [string, "null"]
          maxLength: 256
        profile:
          oneOf:
            - $ref: "#/components/schemas/ResourceReference"
            - type: "null"
        execution_revision:
          $ref: "#/components/schemas/Revision"
        progress:
          $ref: "#/components/schemas/JobProgress"
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/JobArtifact"
        operations:
          type: array
          items:
            $ref: "#/components/schemas/OperationReference"
        effective_configuration:
          $ref: "#/components/schemas/EffectiveConfiguration"
        error:
          oneOf:
            - $ref: "#/components/schemas/JobError"
            - type: "null"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      allOf:
        - if:
            properties:
              status:
                const: failed
            required: [status]
          then:
            required: [error]
            properties:
              error:
                not:
                  type: "null"
        - if:
            properties:
              status:
                enum: [succeeded, cancelled]
            required: [status]
          then:
            properties:
              error:
                type: "null"
        - if:
            properties:
              status:
                const: cancelled
            required: [status]
          then:
            properties:
              cleanup_state:
                enum: [not_required, complete]
    JobProgress:
      type: object
      additionalProperties: false
      required: [unit, completed]
      properties:
        unit:
          type: string
          enum: [audio_ms, text_codepoints, items]
        completed:
          type: integer
          minimum: 0
        total:
          type: [integer, "null"]
          minimum: 0
    JobArtifact:
      type: object
      additionalProperties: false
      required: [artifact_id, kind, media_type, bytes, sha256]
      properties:
        artifact_id:
          $ref: "#/components/schemas/Identifier"
