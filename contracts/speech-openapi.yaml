          type: array
          items:
            $ref: "#/components/schemas/Job"
        has_more:
          type: boolean
        next_cursor:
          type: [string, "null"]
    JobEvent:
      oneOf:
        - $ref: "#/components/schemas/JobQueuedEvent"
        - $ref: "#/components/schemas/JobStartedEvent"
        - $ref: "#/components/schemas/JobProgressEvent"
        - $ref: "#/components/schemas/JobRetryScheduledEvent"
        - $ref: "#/components/schemas/JobCancellingEvent"
        - $ref: "#/components/schemas/JobSucceededEvent"
        - $ref: "#/components/schemas/JobFailedEvent"
        - $ref: "#/components/schemas/JobCancelledEvent"
        - $ref: "#/components/schemas/JobExpiredEvent"
        - $ref: "#/components/schemas/JobCleanupUpdatedEvent"
        - $ref: "#/components/schemas/ArtifactPublishedEvent"
      discriminator:
        propertyName: type
        mapping:
          job.queued: "#/components/schemas/JobQueuedEvent"
          job.started: "#/components/schemas/JobStartedEvent"
          job.progress: "#/components/schemas/JobProgressEvent"
          job.retry_scheduled: "#/components/schemas/JobRetryScheduledEvent"
          job.cancelling: "#/components/schemas/JobCancellingEvent"
          job.succeeded: "#/components/schemas/JobSucceededEvent"
          job.failed: "#/components/schemas/JobFailedEvent"
          job.cancelled: "#/components/schemas/JobCancelledEvent"
          job.expired: "#/components/schemas/JobExpiredEvent"
          job.cleanup_updated: "#/components/schemas/JobCleanupUpdatedEvent"
          artifact.published: "#/components/schemas/ArtifactPublishedEvent"
      examples:
        - id: "1"
          type: job.queued
          job_id: job_demo
          occurred_at: "2026-10-23T00:00:00Z"
          data:
            status: queued
        - id: "2"
          type: job.started
          job_id: job_demo
          occurred_at: "2026-10-23T00:00:01Z"
          data:
            status: running
            execution_revision: "1"
        - id: "3"
          type: job.progress
          job_id: job_demo
          occurred_at: "2026-10-23T00:00:02Z"
          data:
            status: running
            progress:
              unit: text_codepoints
              completed: 4
              total: 10
        - id: "4"
          type: job.retry_scheduled
          job_id: job_demo
          occurred_at: "2026-10-23T00:00:03Z"
          data:
            status: retry_wait
            attempt: 1
            max_attempts: 3
            retry_at: "2026-10-23T00:00:08Z"
            error:
              code: engine_unavailable
              message: synthetic transient engine failure
              retryable: true
        - id: "5"
          type: job.cancelling
          job_id: job_demo
          occurred_at: "2026-10-23T00:00:04Z"
          data:
            status: cancelling
        - id: "6"
          type: job.succeeded
          job_id: job_demo
          occurred_at: "2026-10-23T00:00:05Z"
          data:
            status: succeeded
            cleanup_state: complete
            artifacts:
              - artifact_id: artifact_demo
                kind: audio
                media_type: audio/wav
                bytes: 1024
                sha256: "sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
        - id: "7"
          type: job.failed
          job_id: job_demo
          occurred_at: "2026-10-23T00:00:06Z"
          data:
            status: failed
            cleanup_state: quarantined
            error:
              code: engine_failure
              message: synthetic terminal engine failure
              retryable: false
        - id: "8"
          type: job.cancelled
          job_id: job_demo
          occurred_at: "2026-10-23T00:00:07Z"
          data:
            status: cancelled
            cleanup_state: complete
        - id: "9"
          type: job.expired
          job_id: job_demo
          occurred_at: "2026-10-23T00:00:08Z"
          data:
            status: expired
            cleanup_state: not_required
        - id: "10"
          type: job.cleanup_updated
          job_id: job_demo
          occurred_at: "2026-10-23T00:00:09Z"
          data:
            cleanup_state: pending
            operations:
              - operation_id: op_demo
                kind: tts
                status: running
                cleanup_state: pending
        - id: "11"
          type: artifact.published
          job_id: job_demo
          occurred_at: "2026-10-23T00:00:10Z"
          data:
            artifact:
              artifact_id: artifact_demo
              kind: audio
              media_type: audio/wav
              bytes: 1024
              sha256: "sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
    JobEventEnvelope:
      type: object
