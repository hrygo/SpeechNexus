name: speechnexus

# Minimal synchronous ASR/TTS deployment surface.
#
# Base `docker compose config --services` is intentionally limited to:
#   postgres, minio, minio-init, api, gateway
#
# The following production units are deliberately NOT part of this file yet:
#   - node-controller: engine lifecycle is operator/external in this bootstrap;
#   - runtime-delivery-worker: runtime delivery remains a separate G5 gap;
#   - asset-maintain: retention maintenance is not on the synchronous request path;
#   - voice-evidence-worker: automatic evidence recording needs a recorder DSN and
#     report object storage, which this bootstrap surface does not assemble.
# Adding any of them here would incorrectly claim those capabilities are assembled.
# `migrate`, `engine-register`, `binding-disable-worker`, `job-dispatch-worker`,
# `admin`, `workbench` and `asset-inspector` are opt-in profiles and therefore do
# not appear in the base service list. The `job-dispatch` profile assembles the
# public Job dispatcher
# process, but it still requires a real engine behind the execution gateway; it does
# not by itself make asynchronous Jobs an accepted end-to-end capability. The
# `asset-inspection` profile assembles the private HTTP audio inspector; audio
# inspection additionally needs `SPEECHNEXUS_ASSET_INSPECTOR=audio` plus the
# inspection URL/token in compose.env.

x-python-build: &python-build
  context: ..
  dockerfile: deploy/images/python.Dockerfile

services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-speechnexus}
      POSTGRES_USER: ${POSTGRES_USER:-speechnexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in compose.env}
    ports:
      - "127.0.0.1:${SPEECHNEXUS_POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: speechnexus-minio:RELEASE.2025-09-07T16-13-09Z
    build:
      context: ..
      dockerfile: deploy/images/minio.Dockerfile
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-speechnexus}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in compose.env}
    ports:
      - "127.0.0.1:${SPEECHNEXUS_MINIO_S3_HOST_PORT:-59000}:9000"
      - "127.0.0.1:${SPEECHNEXUS_MINIO_CONSOLE_HOST_PORT:-59001}:9001"
    volumes:
      - minio-data:/data
    networks:
      default:
        ipv4_address: 172.28.0.10
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          'import urllib.request; urllib.request.build_opener(urllib.request.ProxyHandler({})).open("http://127.0.0.1:9000/minio/health/live",timeout=2).close()',
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # One-shot bootstrap: create and version the private input, Artifact and
  # gateway staging buckets. The dispatcher reads staging results from the same
  # bucket name it passes here, so a non-default value is versioned before the
  # worker starts. It uses the local MinIO identity only; production uses
  # separately scoped credentials and versioned buckets prepared outside this
  # bootstrap.
  minio-init:
    build: *python-build
    command: ["python", "/opt/speechnexus/init-object-storage.py"]
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-speechnexus}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in compose.env}
      SPEECHNEXUS_OBJECT_STORAGE_BUCKET: ${SPEECHNEXUS_OBJECT_STORAGE_BUCKET:-speechnexus-results}
      SPEECHNEXUS_TRANSCRIPTION_INPUT_BUCKET: ${SPEECHNEXUS_TRANSCRIPTION_INPUT_BUCKET:-speechnexus-inputs}
      SPEECHNEXUS_EXECUTION_RESULT_BUCKET: ${SPEECHNEXUS_EXECUTION_RESULT_BUCKET:-speechnexus-results}
    volumes:
      - ./init-object-storage.py:/opt/speechnexus/init-object-storage.py:ro
    depends_on:
      minio:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  api:
    build: *python-build
    command: ["speechnexus-api"]
    user: "${SPEECHNEXUS_RUNTIME_UID:?set SPEECHNEXUS_RUNTIME_UID from id -u}:${SPEECHNEXUS_RUNTIME_GID:?set SPEECHNEXUS_RUNTIME_GID from id -g}"
    environment:
      SPEECHNEXUS_ENVIRONMENT: development
      SPEECHNEXUS_PROCESS_ROLE: api
      SPEECHNEXUS_NODE_ID: ${SPEECHNEXUS_NODE_ID:-node-local-1}
      SPEECHNEXUS_INSTANCE_ID: api-1
      SPEECHNEXUS_HOST: 0.0.0.0
      SPEECHNEXUS_PORT: "8000"
      SPEECHNEXUS_DATABASE_URL: ${SPEECHNEXUS_API_DATABASE_URL:?set SPEECHNEXUS_API_DATABASE_URL in compose.env}
      SPEECHNEXUS_OBJECT_STORAGE_ENDPOINT: http://minio:9000
      SPEECHNEXUS_OBJECT_STORAGE_HEALTHCHECK_URL: http://minio:9000/minio/health/live
      SPEECHNEXUS_OBJECT_STORAGE_BUCKET: ${SPEECHNEXUS_OBJECT_STORAGE_BUCKET:-speechnexus-results}
      SPEECHNEXUS_OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-speechnexus}
      SPEECHNEXUS_OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in compose.env}
      SPEECHNEXUS_TRANSCRIPTION_RECIPE_FILE: /run/speechnexus-private/transcription-recipe.json
      SPEECHNEXUS_TRANSCRIPTION_INPUT_BUCKET: ${SPEECHNEXUS_TRANSCRIPTION_INPUT_BUCKET:-speechnexus-inputs}
      SPEECHNEXUS_TRANSCRIPTION_POLL_SECONDS: ${SPEECHNEXUS_TRANSCRIPTION_POLL_SECONDS:-0.25}
      SPEECHNEXUS_TRANSCRIPTION_MAX_AUDIO_MS: ${SPEECHNEXUS_TRANSCRIPTION_MAX_AUDIO_MS:-120000}
      SPEECHNEXUS_TRANSCRIPTION_MAX_UPLOAD_BYTES: ${SPEECHNEXUS_TRANSCRIPTION_MAX_UPLOAD_BYTES:-26214400}
      SPEECHNEXUS_TRANSCRIPTION_TIMEOUT_SECONDS: ${SPEECHNEXUS_TRANSCRIPTION_TIMEOUT_SECONDS:-120}
      SPEECHNEXUS_TRANSCRIPTION_MAX_COMMAND_BYTES: ${SPEECHNEXUS_TRANSCRIPTION_MAX_COMMAND_BYTES:-65536}
      SPEECHNEXUS_TRANSCRIPTION_STORAGE_TIMEOUT_SECONDS: ${SPEECHNEXUS_TRANSCRIPTION_STORAGE_TIMEOUT_SECONDS:-3}
      SPEECHNEXUS_EXECUTION_GATEWAY_BASE_URL: http://gateway:8010
      SPEECHNEXUS_EXECUTION_GATEWAY_COMPONENT_CREDENTIAL: ${SPEECHNEXUS_EXECUTION_GATEWAY_COMPONENT_CREDENTIAL:?set SPEECHNEXUS_EXECUTION_GATEWAY_COMPONENT_CREDENTIAL in compose.env}
      SPEECHNEXUS_EXECUTION_GATEWAY_TIMEOUT_SECONDS: ${SPEECHNEXUS_EXECUTION_GATEWAY_TIMEOUT_SECONDS:-10}
      SPEECHNEXUS_ASSET_DEFAULT_TTL_SECONDS: ${SPEECHNEXUS_ASSET_DEFAULT_TTL_SECONDS:-604800}
      # text (default) keeps asr_input/voice_reference at 503
      # asset_inspection_unavailable and needs no extra container. audio calls the
      # private inspection container over the `asset-inspection` network and needs
      # both keys below; they are forwarded empty so the default text path starts
      # without that container, and a non-empty value with text stops API startup
      # by design. Selecting audio without them also stops startup, naming the
      # missing key instead of degrading to text.
      SPEECHNEXUS_ASSET_INSPECTOR: ${SPEECHNEXUS_ASSET_INSPECTOR:-text}
      SPEECHNEXUS_ASSET_INSPECTION_URL: ${SPEECHNEXUS_ASSET_INSPECTION_URL:-}
      SPEECHNEXUS_ASSET_INSPECTION_TOKEN: ${SPEECHNEXUS_ASSET_INSPECTION_TOKEN:-}
      SPEECHNEXUS_AUDIO_INSPECTION_RUNTIME_ROOT: ${SPEECHNEXUS_AUDIO_INSPECTION_RUNTIME_ROOT:-}
      SPEECHNEXUS_AUDIO_INSPECTION_COMMAND: ${SPEECHNEXUS_AUDIO_INSPECTION_COMMAND:-}
      SPEECHNEXUS_AUDIO_INSPECTION_LAUNCHER_PYTHON: ${SPEECHNEXUS_AUDIO_INSPECTION_LAUNCHER_PYTHON:-}
      SPEECHNEXUS_AUDIO_INSPECTION_BUBBLEWRAP: ${SPEECHNEXUS_AUDIO_INSPECTION_BUBBLEWRAP:-}
      SPEECHNEXUS_AUDIO_INSPECTION_PRLIMIT: ${SPEECHNEXUS_AUDIO_INSPECTION_PRLIMIT:-}
      SPEECHNEXUS_AUDIO_INSPECTION_MAX_DURATION_MS: ${SPEECHNEXUS_AUDIO_INSPECTION_MAX_DURATION_MS:-120000}
      SPEECHNEXUS_AUDIO_INSPECTION_MAX_INPUT_BYTES: ${SPEECHNEXUS_AUDIO_INSPECTION_MAX_INPUT_BYTES:-26214400}
      # Migrated decode budgets: a non-default value stops API startup and names
      # the inspector-side SPEECHNEXUS_INSPECTION_* key, so these stay at the
      # defaults; the inspector container owns them.
      SPEECHNEXUS_AUDIO_INSPECTION_MEMORY_BYTES: ${SPEECHNEXUS_AUDIO_INSPECTION_MEMORY_BYTES:-268435456}
      SPEECHNEXUS_AUDIO_INSPECTION_CPU_SECONDS: ${SPEECHNEXUS_AUDIO_INSPECTION_CPU_SECONDS:-5}
      SPEECHNEXUS_AUDIO_INSPECTION_WALL_SECONDS: ${SPEECHNEXUS_AUDIO_INSPECTION_WALL_SECONDS:-10}
      SPEECHNEXUS_AUDIO_INSPECTION_OUTPUT_BYTES: ${SPEECHNEXUS_AUDIO_INSPECTION_OUTPUT_BYTES:-4096}
      SPEECHNEXUS_AUDIO_INSPECTION_MAX_RECEIPT_BYTES: ${SPEECHNEXUS_AUDIO_INSPECTION_MAX_RECEIPT_BYTES:-4096}
      SPEECHNEXUS_PROFILE_WRITER_DATABASE_URL: ${SPEECHNEXUS_PROFILE_WRITER_DATABASE_URL:-}
      SPEECHNEXUS_BINDING_WRITER_DATABASE_URL: ${SPEECHNEXUS_BINDING_WRITER_DATABASE_URL:-}
      SPEECHNEXUS_BINDING_DEFAULTS_WRITER_DATABASE_URL: ${SPEECHNEXUS_BINDING_DEFAULTS_WRITER_DATABASE_URL:-}
      SPEECHNEXUS_BINDING_ADMIN_READER_DATABASE_URL: ${SPEECHNEXUS_BINDING_ADMIN_READER_DATABASE_URL:-}
      SPEECHNEXUS_BINDING_LIST_READER_DATABASE_URL: ${SPEECHNEXUS_BINDING_LIST_READER_DATABASE_URL:-}
      SPEECHNEXUS_RESOURCE_POOL_READER_DATABASE_URL: ${SPEECHNEXUS_RESOURCE_POOL_READER_DATABASE_URL:-}
      SPEECHNEXUS_BINDING_LIFECYCLE_DATABASE_URL: ${SPEECHNEXUS_BINDING_LIFECYCLE_DATABASE_URL:-}
      SPEECHNEXUS_JOB_WRITER_DATABASE_URL: ${SPEECHNEXUS_JOB_WRITER_DATABASE_URL:-}
      SPEECHNEXUS_JOB_ADMISSION_DATABASE_URL: ${SPEECHNEXUS_JOB_ADMISSION_DATABASE_URL:-}
      SPEECHNEXUS_VOICE_PUBLISHER_DATABASE_URL: ${SPEECHNEXUS_VOICE_PUBLISHER_DATABASE_URL:-}
      SPEECHNEXUS_WORKSPACE_WRITER_DATABASE_URL: ${SPEECHNEXUS_WORKSPACE_WRITER_DATABASE_URL:-}
      SPEECHNEXUS_PRONUNCIATION_READER_DATABASE_URL: ${SPEECHNEXUS_PRONUNCIATION_READER_DATABASE_URL:-}
      SPEECHNEXUS_PRONUNCIATION_WRITER_DATABASE_URL: ${SPEECHNEXUS_PRONUNCIATION_WRITER_DATABASE_URL:-}
      SPEECHNEXUS_PRONUNCIATION_PUBLISHER_DATABASE_URL: ${SPEECHNEXUS_PRONUNCIATION_PUBLISHER_DATABASE_URL:-}
    ports:
      - "127.0.0.1:${SPEECHNEXUS_API_HOST_PORT:-8000}:8000"
    volumes:
      - ${SPEECHNEXUS_PRIVATE_CONFIG_DIR:?set SPEECHNEXUS_PRIVATE_CONFIG_DIR in compose.env}:/run/speechnexus-private:ro
    # The dedicated inspection network exists only to reach
    # http://asset-inspector:8080. Object storage, PostgreSQL and the gateway stay
    # on `default`, so `internal: true` costs the API no egress. There is
    # deliberately no `depends_on` on asset-inspector: a stopped or crashed
    # inspector must not block API startup. With `audio` selected the API still
    # starts (startup validates the URL, token and limits, not reachability) and
    # answers 503 asset_inspection_unavailable per request, which is the A2/A6
    # contract; a hard `service_healthy` gate would turn an inspection outage into
    # a total API outage, including text-only, health and retention routes.
    networks:
      default:
      asset-inspection:
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      gateway:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # Opt-in audio inspection container. The API reaches it at
  # http://asset-inspector:8080 over the dedicated `internal: true` network, and
  # nothing is published to the host or to any network with a default gateway.
  # `docker compose up` without the `asset-inspection` profile therefore keeps the
  # text inspector and the exact same host surface. Hardening and resource limits
  # follow docs/components/asset-inspection-container.md §4.1: read-only root, only
  # private tmpfs writable, no capabilities, no new privileges, no volume, no
  # bind mount and no Docker socket.
  asset-inspector:
    profiles: ["asset-inspection"]
    build:
      context: ..
      dockerfile: asset-inspector/Dockerfile
    environment:
      # The same shared bearer token the API sends; it authorizes one inspection
      # per request and is the only credential this container holds. Enabling the
      # profile also requires SPEECHNEXUS_ASSET_INSPECTOR=audio and the matching
      # API URL above.
      #
      # Blank default, no literal value, and no `:?` guard, for two measured
      # reasons. Compose interpolates every service on `config`, including
      # services excluded by an inactive profile, so a required-variable guard on
      # this key would fail `docker compose config`/`up` for deployments that never
      # enable the profile. Giving `compose.env.example` a non-blank placeholder
      # instead would make the default text-mode API refuse to start, because a
      # configured token with SPEECHNEXUS_ASSET_INSPECTOR=text is a deliberate
      # fail-fast contradiction. The key therefore stays optional at the Compose
      # layer and is enforced at startup: an empty token makes this container exit
      # naming SPEECHNEXUS_INSPECTION_TOKEN, and enabling audio in the API without
      # it stops API startup naming SPEECHNEXUS_ASSET_INSPECTION_TOKEN. This is the
      # same fail-closed shape as a blank SPEECHNEXUS_JOB_DISPATCH_DATABASE_URL.
      SPEECHNEXUS_INSPECTION_TOKEN: ${SPEECHNEXUS_ASSET_INSPECTION_TOKEN:-}
    networks:
      - asset-inspection
    # No `ports`: the container is reachable only by service name from containers
    # attached to the same internal network.
    # No `volumes`: every writable path is a private tmpfs recycled on exit, and
    # the API sends bytes in the request instead of a shared directory.
    tmpfs:
      # Owned by the image's fixed runtime uid/gid (USER 10001:10001); 0700 keeps
      # both paths private to that single user. Both filesystems are RAM charged
      # to the container's memory limit.
      - /run/inspection:size=64m,mode=0700,uid=10001,gid=10001
      - /tmp:size=16m,mode=0700,uid=10001,gid=10001
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 768m
    cpus: 2.0
    # tini as PID 1 reaps decoder/prlimit leftovers; the service itself exits
    # non-zero when a child cannot be reaped, so the container restarts whole.
    init: true
    # Must exceed the inspection wall budget (20 s default) plus 2 s.
    stop_grace_period: 30s
    healthcheck:
      # /healthz is unauthenticated and touches no writable path, so this probe
      # works on the read-only root. /readyz stays 503 until the startup self-check
      # decodes its synthetic WAV. `python` is the image venv interpreter; no
      # extra tool is installed and nothing is written to disk.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  gateway:
    build: *python-build
    command: ["speechnexus-gateway"]
    user: "${SPEECHNEXUS_RUNTIME_UID:?set SPEECHNEXUS_RUNTIME_UID from id -u}:${SPEECHNEXUS_RUNTIME_GID:?set SPEECHNEXUS_RUNTIME_GID from id -g}"
    environment:
      SPEECHNEXUS_GATEWAY_ENVIRONMENT: development
      SPEECHNEXUS_GATEWAY_NODE_ID: ${SPEECHNEXUS_NODE_ID:-node-local-1}
      SPEECHNEXUS_GATEWAY_GATEWAY_ID: ${SPEECHNEXUS_GATEWAY_ID:-gateway-1}
      SPEECHNEXUS_GATEWAY_HOST: 0.0.0.0
      SPEECHNEXUS_GATEWAY_PORT: "8010"
      SPEECHNEXUS_GATEWAY_CONTROL_DATABASE_URL: ${SPEECHNEXUS_GATEWAY_CONTROL_DATABASE_URL:?set SPEECHNEXUS_GATEWAY_CONTROL_DATABASE_URL in compose.env}
      SPEECHNEXUS_GATEWAY_CONTROL_QUERY_DATABASE_URL: ${SPEECHNEXUS_GATEWAY_CONTROL_QUERY_DATABASE_URL:?set SPEECHNEXUS_GATEWAY_CONTROL_QUERY_DATABASE_URL in compose.env}
      SPEECHNEXUS_GATEWAY_COMPONENT_TOKEN: ${SPEECHNEXUS_EXECUTION_GATEWAY_COMPONENT_CREDENTIAL:?set SPEECHNEXUS_EXECUTION_GATEWAY_COMPONENT_CREDENTIAL in compose.env}
      SPEECHNEXUS_GATEWAY_INGRESS_LOCK_DIRECTORY: /run/speechnexus-gateway-locks
      SPEECHNEXUS_GATEWAY_FILE_ASR_CONFIG_FILE: /run/speechnexus-private/gateway-file-asr.json
      SPEECHNEXUS_GATEWAY_FILE_ASR_OBJECT_ACCESS_KEY: ${MINIO_ROOT_USER:-speechnexus}
      SPEECHNEXUS_GATEWAY_FILE_ASR_OBJECT_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in compose.env}
      SPEECHNEXUS_GATEWAY_FILE_TTS_CONFIG_FILE: /run/speechnexus-private/gateway-file-tts.json
      SPEECHNEXUS_GATEWAY_FILE_TTS_OBJECT_ACCESS_KEY: ${MINIO_ROOT_USER:-speechnexus}
      SPEECHNEXUS_GATEWAY_FILE_TTS_OBJECT_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in compose.env}
    ports:
      - "127.0.0.1:${SPEECHNEXUS_GATEWAY_HOST_PORT:-8010}:8010"
    volumes:
      - ${SPEECHNEXUS_PRIVATE_CONFIG_DIR:?set SPEECHNEXUS_PRIVATE_CONFIG_DIR in compose.env}:/run/speechnexus-private:ro
      - ${SPEECHNEXUS_GATEWAY_LOCK_DIR:?set SPEECHNEXUS_GATEWAY_LOCK_DIR in compose.env}:/run/speechnexus-gateway-locks
      - ${SPEECHNEXUS_GATEWAY_SPOOL_DIR:?set SPEECHNEXUS_GATEWAY_SPOOL_DIR in compose.env}:/var/lib/speechnexus/spool
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/readyz', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # Must be explicitly enabled to process durable binding-disable intents.
  # This shares the gateway network namespace, not its filesystem or credentials.
  binding-disable-worker:
    profiles: ["binding-disable"]
    build: *python-build
    command: ["python", "-m", "speechnexus_backend.binding_disable_worker"]
    user: "${SPEECHNEXUS_RUNTIME_UID:?set SPEECHNEXUS_RUNTIME_UID from id -u}:${SPEECHNEXUS_RUNTIME_GID:?set SPEECHNEXUS_RUNTIME_GID from id -g}"
    network_mode: "service:gateway"
    environment:
      SPEECHNEXUS_PROCESS_ROLE: binding-disable-worker
      SPEECHNEXUS_DATABASE_SCHEMA: speech
      SPEECHNEXUS_DISABLE_DATABASE_URL: ${SPEECHNEXUS_DISABLE_DATABASE_URL:-}
      SPEECHNEXUS_DISABLE_SETTLEMENT_DATABASE_URL: ${SPEECHNEXUS_DISABLE_SETTLEMENT_DATABASE_URL:-}
      SPEECHNEXUS_DISABLE_GATEWAY_ID: ${SPEECHNEXUS_GATEWAY_ID:-gateway-1}
      SPEECHNEXUS_DISABLE_NODE_ID: ${SPEECHNEXUS_NODE_ID:-node-local-1}
      SPEECHNEXUS_EXECUTION_GATEWAY_BASE_URL: http://127.0.0.1:8010
      SPEECHNEXUS_EXECUTION_GATEWAY_COMPONENT_CREDENTIAL: ${SPEECHNEXUS_EXECUTION_GATEWAY_COMPONENT_CREDENTIAL:?set SPEECHNEXUS_EXECUTION_GATEWAY_COMPONENT_CREDENTIAL in compose.env}
      SPEECHNEXUS_DISABLE_GATEWAY_TIMEOUT_SECONDS: ${SPEECHNEXUS_DISABLE_GATEWAY_TIMEOUT_SECONDS:-10}
      SPEECHNEXUS_DISABLE_STORAGE_TIMEOUT_SECONDS: ${SPEECHNEXUS_DISABLE_STORAGE_TIMEOUT_SECONDS:-3}
      SPEECHNEXUS_DISABLE_POLL_SECONDS: ${SPEECHNEXUS_DISABLE_POLL_SECONDS:-1}
      SPEECHNEXUS_DISABLE_BATCH_SIZE: ${SPEECHNEXUS_DISABLE_BATCH_SIZE:-64}
      SPEECHNEXUS_DISABLE_WAIT_TIMEOUT_MS: ${SPEECHNEXUS_DISABLE_WAIT_TIMEOUT_MS:-1000}
    depends_on:
      postgres:
        condition: service_healthy
      gateway:
        condition: service_healthy
        restart: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # Opt-in public Job dispatcher. It shares the gateway network namespace so its
  # gateway origin can stay on loopback: the worker rejects plain HTTP outside
  # loopback. Every operating bound has no in-process default, so the values here
  # are this bootstrap's explicit reference values, not capacity or model
  # qualification. A blank dispatch DSN or a missing grant fails closed before any
  # lease is claimed. There is no healthcheck, so that failure surfaces as a
  # restart loop instead of a ready service; provision the DSN and grants first.
  job-dispatch-worker:
    profiles: ["job-dispatch"]
    build: *python-build
    command: ["speechnexus-job-dispatch-worker"]
    user: "${SPEECHNEXUS_RUNTIME_UID:?set SPEECHNEXUS_RUNTIME_UID from id -u}:${SPEECHNEXUS_RUNTIME_GID:?set SPEECHNEXUS_RUNTIME_GID from id -g}"
    network_mode: "service:gateway"
    environment:
      SPEECHNEXUS_PROCESS_ROLE: job-worker
      SPEECHNEXUS_NODE_ID: ${SPEECHNEXUS_NODE_ID:-node-local-1}
      SPEECHNEXUS_INSTANCE_ID: ${SPEECHNEXUS_JOB_DISPATCH_INSTANCE_ID:-dispatch-1}
      SPEECHNEXUS_DATABASE_URL: ${SPEECHNEXUS_JOB_DISPATCH_DATABASE_URL:-}
      SPEECHNEXUS_DATABASE_SCHEMA: speech
      SPEECHNEXUS_EXECUTION_GATEWAY_BASE_URL: http://127.0.0.1:8010
      SPEECHNEXUS_EXECUTION_GATEWAY_COMPONENT_CREDENTIAL: ${SPEECHNEXUS_EXECUTION_GATEWAY_COMPONENT_CREDENTIAL:?set SPEECHNEXUS_EXECUTION_GATEWAY_COMPONENT_CREDENTIAL in compose.env}
      SPEECHNEXUS_EXECUTION_GATEWAY_TIMEOUT_SECONDS: ${SPEECHNEXUS_EXECUTION_GATEWAY_TIMEOUT_SECONDS:-10}
      SPEECHNEXUS_JOB_DISPATCH_BATCH_SIZE: ${SPEECHNEXUS_JOB_DISPATCH_BATCH_SIZE:-8}
      SPEECHNEXUS_JOB_DISPATCH_LEASE_MS: ${SPEECHNEXUS_JOB_DISPATCH_LEASE_MS:-30000}
      SPEECHNEXUS_JOB_DISPATCH_POLL_SECONDS: ${SPEECHNEXUS_JOB_DISPATCH_POLL_SECONDS:-1}
      SPEECHNEXUS_JOB_DISPATCH_JOB_TIMEOUT_SECONDS: ${SPEECHNEXUS_JOB_DISPATCH_JOB_TIMEOUT_SECONDS:-600}
      SPEECHNEXUS_JOB_DISPATCH_MAX_ATTEMPTS: ${SPEECHNEXUS_JOB_DISPATCH_MAX_ATTEMPTS:-5}
      SPEECHNEXUS_JOB_DISPATCH_INTERVAL_SECONDS: ${SPEECHNEXUS_JOB_DISPATCH_INTERVAL_SECONDS:-5}
      SPEECHNEXUS_JOB_DISPATCH_STORAGE_TIMEOUT_SECONDS: ${SPEECHNEXUS_JOB_DISPATCH_STORAGE_TIMEOUT_SECONDS:-3}
      SPEECHNEXUS_JOB_DISPATCH_KINDS: ${SPEECHNEXUS_JOB_DISPATCH_KINDS:-asr,tts}
      SPEECHNEXUS_OBJECT_STORAGE_ENDPOINT: http://minio:9000
      SPEECHNEXUS_OBJECT_STORAGE_BUCKET: ${SPEECHNEXUS_OBJECT_STORAGE_BUCKET:-speechnexus-results}
      SPEECHNEXUS_EXECUTION_RESULT_BUCKET: ${SPEECHNEXUS_EXECUTION_RESULT_BUCKET:-speechnexus-results}
      # Local bootstrap only: the root MinIO identity is broader than object-layer
      # least privilege. read_only/cap_drop constrain the process, not S3 rights.
      SPEECHNEXUS_OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-speechnexus}
      SPEECHNEXUS_OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in compose.env}
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      gateway:
        condition: service_healthy
        restart: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # Opt-in migration. It never starts as part of the base `up`; the migration
  # identity is distinct from both runtime roles.
  migrate:
    profiles: ["migration"]
    build: *python-build
    command: ["speechnexus-job-migrate", "--schema", "speech"]
    environment:
      SPEECHNEXUS_MIGRATION_DATABASE_URL: ${SPEECHNEXUS_MIGRATION_DATABASE_URL:?set SPEECHNEXUS_MIGRATION_DATABASE_URL in compose.env}
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  # Opt-in one-shot registration. It never starts as part of the base `up`.
  # The recipe and endpoint files must already be approved deployment inputs.
  engine-register:
    profiles: ["engine-registration"]
    build: *python-build
    command:
      - speechnexus-register-engine
      - --generation
      - ${SPEECHNEXUS_ENGINE_GENERATION:-1}
      - --node
      - ${SPEECHNEXUS_NODE_ID:-node-local-1}
      - --gateway
      - ${SPEECHNEXUS_GATEWAY_ID:-gateway-1}
      - --instance
      - ${SPEECHNEXUS_ENGINE_INSTANCE_ID:-instance-asr-1}
      - --workspace
      - ${SPEECHNEXUS_ADMISSION_WORKSPACE:-workspace-default}
      - --max-attempts
      - ${SPEECHNEXUS_ADMISSION_MAX_ATTEMPTS:-8}
    user: "${SPEECHNEXUS_RUNTIME_UID:?set SPEECHNEXUS_RUNTIME_UID from id -u}:${SPEECHNEXUS_RUNTIME_GID:?set SPEECHNEXUS_RUNTIME_GID from id -g}"
    environment:
      SPEECHNEXUS_DATABASE_URL: ${SPEECHNEXUS_REGISTRATION_DATABASE_URL:?set SPEECHNEXUS_REGISTRATION_DATABASE_URL in compose.env}
      SPEECHNEXUS_DATABASE_SCHEMA: speech
      SPEECHNEXUS_TRANSCRIPTION_RECIPE_FILE: /run/speechnexus-private/transcription-recipe.json
      SPEECHNEXUS_ENGINE_HEALTH_URL: ${SPEECHNEXUS_ENGINE_HEALTH_URL:?set SPEECHNEXUS_ENGINE_HEALTH_URL in compose.env}
    volumes:
      - ${SPEECHNEXUS_PRIVATE_CONFIG_DIR:?set SPEECHNEXUS_PRIVATE_CONFIG_DIR in compose.env}:/run/speechnexus-private:ro
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - host.docker.internal:host-gateway
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  # Optional UI/profile services; intentionally absent from the minimal surface.
  admin:
    profiles: ["web"]
    build:
      context: ..
      dockerfile: deploy/images/web.Dockerfile
      args:
        APP_NAME: admin
    environment:
      WEB_SPEECH_UPSTREAM: ${WEB_SPEECH_UPSTREAM:-}
      WEB_WORKBENCH_UPSTREAM: ${WEB_WORKBENCH_UPSTREAM:-}
      WEB_DNS_RESOLVER: ${WEB_DNS_RESOLVER:-}
      NGINX_ENVSUBST_FILTER: ^WEB_(SPEECH_UPSTREAM|WORKBENCH_UPSTREAM|SPEECH_HOST|WORKBENCH_HOST|DNS_RESOLVER)$
    ports:
      - "127.0.0.1:${SPEECHNEXUS_ADMIN_HOST_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  workbench:
    profiles: ["web"]
    build:
      context: ..
      dockerfile: deploy/images/web.Dockerfile
      args:
        APP_NAME: workbench
    environment:
      WEB_SPEECH_UPSTREAM: ${WEB_SPEECH_UPSTREAM:-}
      WEB_WORKBENCH_UPSTREAM: ${WEB_WORKBENCH_UPSTREAM:-}
      WEB_DNS_RESOLVER: ${WEB_DNS_RESOLVER:-}
      NGINX_ENVSUBST_FILTER: ^WEB_(SPEECH_UPSTREAM|WORKBENCH_UPSTREAM|SPEECH_HOST|WORKBENCH_HOST|DNS_RESOLVER)$
    ports:
      - "127.0.0.1:${SPEECHNEXUS_WORKBENCH_HOST_PORT:-8081}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24
  # No default gateway and no host port: the inspection container can neither
  # reach the internet nor be reached from the host. Only `api` (client) and
  # `asset-inspector` join it, so a decoder compromise cannot reach PostgreSQL,
  # MinIO or the gateway. Do not attach services that need outbound access, and do
  # not move the object store or the gateway onto this network.
  asset-inspection:
    internal: true
