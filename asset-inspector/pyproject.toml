[project]
name = "speechnexus-asset-inspector"
version = "0.1.0.dev0"
description = "Isolated, network-free audio asset inspection service"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "speechnexus-media[audio]",
  "starlette>=1.9,<2",
  "uvicorn>=0.54,<0.55",
]

[project.scripts]
speechnexus-asset-inspector = "speechnexus_asset_inspector.main:main"

[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speechnexus_asset_inspector"]

[tool.uv.sources]
speechnexus-media = { workspace = true }
