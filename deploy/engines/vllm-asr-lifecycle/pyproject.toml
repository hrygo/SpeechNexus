[project]
name = "speechnexus-vllm-asr-lifecycle"
version = "0.1.0.dev0"
description = "Request cleanup overlay for the pinned SpeechNexus vLLM ASR image"
requires-python = ">=3.12"
dependencies = []

[project.entry-points."vllm.endpoint_plugins"]
speechnexus_asr_scope = "speechnexus_vllm_asr.plugin:AsrScopePlugin"

[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speechnexus_vllm_asr"]
