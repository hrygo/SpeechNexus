          type: integer
          minimum: 0
          maximum: 60000
        allow_degradation:
          type: boolean
          default: false
    RealtimeSessionCreateRequest:
      type: object
      additionalProperties: false
      required: [profile, modalities, models]
      allOf:
        - if:
            properties:
              modalities:
                contains: {const: asr}
            required: [modalities]
          then:
            properties:
              models:
                required: [asr]
        - if:
            properties:
              modalities:
                contains: { const: tts }
            required: [modalities]
          then:
            properties:
              models:
                required: [tts]
        - if:
            properties:
              modalities:
                not:
                  contains: {const: asr}
            required: [modalities]
          then:
            properties:
              models:
                not:
                  required: [asr]
        - if:
            properties:
              modalities:
                not:
                  contains: { const: tts }
            required: [modalities]
          then:
            properties:
              models:
                not:
                  required: [tts]
      properties:
        workspace_id:
          $ref: "#/components/schemas/Identifier"
        client_reference:
          type: string
          maxLength: 256
        profile:
          $ref: "#/components/schemas/ResourceReference"
        modalities:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [asr, tts]
        models:
          $ref: "#/components/schemas/RealtimeModelSelection"
        voice:
          $ref: "#/components/schemas/ResourceReference"
        audio:
          $ref: "#/components/schemas/RealtimeAudioSelection"
        overrides:
          $ref: "#/components/schemas/RealtimeOverrides"
        constraints:
          $ref: "#/components/schemas/RealtimeConstraints"
        expires_in_s:
          type: integer
          minimum: 5
          maximum: 300
          default: 30
    RealtimeSessionStatus:
      type: string
      enum: [created, admitting, active, draining, closed, failed, expired]
    RealtimeSessionLimits:
      $ref: "shared/public-audio.schema.json#/$defs/RealtimeLimits"
    RealtimeTerminalOperation:
      type: object
      additionalProperties: false
      required: [operation_id, kind, status, cleanup_state]
      properties:
        operation_id:
          $ref: "#/components/schemas/Identifier"
        kind:
          $ref: "#/components/schemas/OperationKind"
        status:
          $ref: "shared/operation-states.schema.json#/$defs/TerminalOperationStatus"
        cleanup_state:
          $ref: "#/components/schemas/CleanupState"
        receipt_id:
          oneOf:
            - $ref: "#/components/schemas/Identifier"
            - type: "null"
      allOf:
        - if:
            properties:
              status:
                const: succeeded
            required: [status]
          then:
            required: [receipt_id]
            properties:
              receipt_id:
                not:
                  type: "null"
              cleanup_state:
                enum: [not_required, complete]
        - if:
            properties:
              status:
                const: cancelled
            required: [status]
          then:
            properties:
              cleanup_state:
                enum: [not_required, complete]
    RealtimeSession:
      type: object
      additionalProperties: false
      required:
        - id
        - object
        - status
        - expires_at
        - connection_url
        - effective_configuration
        - limits
        - cleanup_state
        - terminal_operations
        - closed_at
        - error
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        object:
          const: nexus.realtime_session
        status:
          $ref: "#/components/schemas/RealtimeSessionStatus"
        expires_at:
          type: string
          format: date-time
        connection_url:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 2048
            - type: "null"
          description: |
            Relative or absolute WebSocket URL containing session_id while the
            session can still be connected. The URL is not a credential.
            Terminal sessions return null.
        effective_configuration:
          $ref: "#/components/schemas/EffectiveConfiguration"
        limits:
          $ref: "#/components/schemas/RealtimeSessionLimits"
        input_ack_sample:
          type: integer
          minimum: 0
        terminal_operations:
          type: array
          description: |
            Terminal Operations owned by this session. Producer validation
            requires unique operation_id values and resolves each referenced
            Operation to one whose session_id equals this session id and whose
            kind, status, cleanup_state, and succeeded receipt id agree.
          items:
            $ref: "#/components/schemas/RealtimeTerminalOperation"
        cleanup_state:
          $ref: "#/components/schemas/CleanupState"
        closed_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        error:
          oneOf:
            - $ref: "#/components/schemas/JobError"
            - type: "null"
      allOf:
        - if:
            properties:
              status:
                const: failed
            required: [status]
          then:
            required: [error, closed_at]
            properties:
              error:
                not:
                  type: "null"
              closed_at:
                type: string
                format: date-time
        - if:
            properties:
              status:
                not:
                  const: failed
            required: [status]
          then:
            properties:
              error:
                type: "null"
        - if:
            properties:
              status:
                enum: [closed, failed, expired]
            required: [status]
          then:
            required: [closed_at]
            properties:
              connection_url:
                type: "null"
              closed_at:
                type: string
                format: date-time
        - if:
            properties:
              status:
                const: expired
            required: [status]
          then:
            properties:
              cleanup_state:
                const: not_required
              terminal_operations:
                maxItems: 0
        - if:
            properties:
              status:
                enum: [created, admitting]
            required: [status]
          then:
            properties:
              connection_url:
                type: string
              cleanup_state:
                const: not_required
              terminal_operations:
                maxItems: 0
              closed_at:
                type: "null"
        - if:
            properties:
              status:
                enum: [active, draining]
            required: [status]
          then:
            properties:
              connection_url:
                type: string
              cleanup_state:
                const: pending
              closed_at:
                type: "null"
    RealtimeSessionCancelRequest:
      type: object
