          required: [type, data]
    ArtifactPublishedEventData:
      type: object
      additionalProperties: false
      required: [artifact]
      properties:
        artifact:
          $ref: "#/components/schemas/JobArtifact"
    JobCancellation:
      type: object
      additionalProperties: false
      required: [job_id, accepted, status, cleanup_state, cancellation_requested_at, operations]
      properties:
        job_id:
          $ref: "#/components/schemas/Identifier"
        accepted:
          type: boolean
          description: |
            True when this Job has a durably accepted cancellation intent. False
            when the request found the Job already terminal: a durable terminal
            receipt is still recorded for this idempotency key, but no cancellation
            is accepted and no state is written. A previously accepted value never
            becomes false on replay.
        status:
          $ref: "#/components/schemas/JobStatus"
        cleanup_state:
          $ref: "#/components/schemas/CleanupState"
        cancellation_requested_at:
          type: string
          format: date-time
          description: |
            First durable acceptance time for this Job. Every replay preserves it;
            it is not stop time, engine time or resource release time.
        operations:
          type: array
          items:
            $ref: "#/components/schemas/OperationReference"
      allOf:
        - if:
            properties:
              status:
                const: cancelled
            required: [status]
          then:
            properties:
              cleanup_state:
                enum: [not_required, complete]
    OperationKind:
      $ref: "shared/capability-domains.schema.json#/$defs/OperationKind"
    OperationStatus:
      $ref: "shared/operation-states.schema.json#/$defs/OperationStatus"
    Operation:
      type: object
      additionalProperties: false
      required:
        - id
        - object
        - kind
        - status
        - cleanup_state
        - execution_revision
        - created_at
        - updated_at
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        object:
          const: nexus.operation
        kind:
          $ref: "#/components/schemas/OperationKind"
        status:
          $ref: "#/components/schemas/OperationStatus"
        cleanup_state:
          $ref: "#/components/schemas/CleanupState"
        job_id:
          oneOf:
            - $ref: "#/components/schemas/Identifier"
            - type: "null"
        session_id:
          oneOf:
            - $ref: "#/components/schemas/Identifier"
            - type: "null"
        execution_revision:
          $ref: "#/components/schemas/Revision"
        receipt:
          oneOf:
            - $ref: "#/components/schemas/ExecutionReceipt"
            - type: "null"
        error:
          oneOf:
            - $ref: "#/components/schemas/JobError"
            - type: "null"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      allOf:
        - not:
            properties:
              job_id:
                type: string
              session_id:
                type: string
            required: [job_id, session_id]
        - if:
            properties:
              status:
                const: failed
            required: [status]
          then:
            required: [error]
            properties:
              error:
                not:
                  type: "null"
        - if:
            properties:
              status:
                const: succeeded
            required: [status]
          then:
            required: [receipt]
            properties:
              receipt:
                not:
                  type: "null"
              cleanup_state:
                enum: [not_required, complete]
        - if:
            properties:
              status:
                enum: [succeeded, cancelled]
            required: [status]
          then:
            properties:
              error:
                type: "null"
        - if:
            properties:
              status:
                const: cancelled
            required: [status]
          then:
            properties:
              cleanup_state:
                enum: [not_required, complete]
    ExecutionReceipt:
      $ref: "shared/receipts.schema.json#/$defs/ExecutionReceipt"
    OperationCancellation:
      type: object
      additionalProperties: false
      required: [operation_id, accepted, status, cleanup_state, cancellation_requested_at]
      properties:
        operation_id:
          $ref: "#/components/schemas/Identifier"
        accepted:
          type: boolean
        status:
          $ref: "#/components/schemas/OperationStatus"
        cleanup_state:
          $ref: "#/components/schemas/CleanupState"
        cancellation_requested_at:
          type: string
          format: date-time
      allOf:
        - if:
            properties:
              status:
                const: cancelled
            required: [status]
          then:
            properties:
              cleanup_state:
                enum: [not_required, complete]
