openapi: 3.1.0
info:
  title: SpeechNexus administration API
  version: 0.1.0.dev4
  description: |
    Deployment-scoped administration and observation API. These routes do not
    establish a user identity, role, or tenant boundary. A deployment may expose
    them on a separate listener or route allowlist, but the API itself must not
    pretend that hiding a navigation entry is authorization.

    Model binding revisions, runtime instances, capacity manifests, and
    qualification reports are separate resources. No response exposes private
    artifact paths, engine endpoints, credentials, or arbitrary container
    control.
servers:
  - url: /
security:
  - SharedServiceKey: []
  - {}
tags:
  - name: workspaces
  - name: profiles
  - name: model-bindings
  - name: model-instances
  - name: resource-pools
  - name: quarantine
  - name: policies
  - name: diagnostics
  - name: audit
paths:
  /v1/nexus/workspaces:
    get:
      tags: [workspaces]
      operationId: listWorkspaces
      summary: List content and budget groups
      description: |
        A workspace groups content and budget. It is not a user, tenant, ACL, or
        privacy boundary.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Workspaces.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      tags: [workspaces]
      operationId: createWorkspace
      summary: Create a content and budget group
      description: |
        A workspace is not a user, tenant, ACL, or privacy boundary. Creation is
        an administrative grouping action; it does not grant personal ownership.
      parameters:
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceCreateRequest"
      responses:
        "201":
          description: Workspace created.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /v1/nexus/workspaces/{workspace_id}:
    get:
      tags: [workspaces]
      operationId: getWorkspace
      summary: Get one workspace
      parameters:
        - $ref: "#/components/parameters/WorkspaceIdPath"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Workspace.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    patch:
      tags: [workspaces]
      operationId: updateWorkspace
      summary: Update workspace display metadata or status
      parameters:
        - $ref: "#/components/parameters/WorkspaceIdPath"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspacePatch"
      responses:
        "200":
          description: Updated workspace.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /v1/nexus/admin/profiles:
    get:
      tags: [profiles]
      operationId: listProfileFamilies
      summary: List scenario-profile families and their immutable revisions
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [draft, published, retired, disabled]
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Profile families. Filtering by status applies to latest_revision.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileFamilyList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      tags: [profiles]
      operationId: createProfileRevision
      summary: Create an immutable draft scenario-profile revision
      description: |
        Creates the next immutable revision in a profile family. The request
        carries `expected_latest_revision` for revision allocation; null is
        valid only for a new family. An existing mismatch returns 409
        `configuration_changed`. The new revision starts in publication
        `draft` state and is not returned by the public profile list until it
        is published. Replaying the same Idempotency-Key and canonical intent
        returns the original revision; the same key with a different intent
        returns 409 `idempotency_conflict`.

        A recorded `configuration_changed` result remains the result of that
        key even if the allocation head later changes. Original-key lookup
        precedes revision allocation. Malformed JSON, unknown fields, invalid
        path/header values and schema-invalid input return 400. A structurally
        valid definition that violates cross-field profile rules returns 422.

        An unreadable original result or uncertain commit returns 503
        `profile_result_unknown`, with `retryable: false`. It does not establish
        that no revision was created. There is no automatic retry, new key,
        Operation or HTTP query-by-key recovery resource. A caller retaining
        the original Idempotency-Key may explicitly replay this same POST with
        the exact original intent and key to resolve its original result.
        Without an original key, automatic recovery is not promised; a GET of
        a candidate revision does not prove ownership of the original command.

        The bounded public ingress may refuse Host/Origin (403), unsupported
        method (405 with Allow), receive timeout (408), request size (413),
        non-JSON media (415), or local receive capacity (429). These refusals
        concern this HTTP attempt and do not settle any earlier original-key
        outcome. They do not authorize a new key or automatic create retry.
        Limits are deployment configuration, not implicit profile parameters.
      parameters:
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileRevisionCreateRequest"
      responses:
        "201":
          description: Draft profile revision created, without validation or qualification evidence.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileDraftRevision"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/ProfileCreateMethodNotAllowed"
        "408":
          $ref: "#/components/responses/ProfileReceiveTimeout"
        "409":
          $ref: "#/components/responses/ProfileDraftConflict"
        "413":
          $ref: "#/components/responses/ProfileRequestTooLarge"
        "415":
          $ref: "#/components/responses/ProfileMediaUnsupported"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/ProfileReceiveFull"
        "503":
          $ref: "#/components/responses/ProfileCreationUnknown"
  /v1/nexus/admin/profiles/{profile_id}/revisions/{revision}:
    get:
      tags: [profiles]
      operationId: getProfileRevisionForAdministration
      summary: Get a draft or historical profile revision
      description: |
        Read only the explicitly named immutable revision; never allocate,
        publish or activate one. Invalid path/header/query values return 400.
        Return 404 only when an authoritative read confirms that this revision
        is absent. Unreadable metadata returns 503 `profile_unavailable`, with
        `retryable: true` for this same fixed GET; it cannot be reported as 404
        or used to infer that an earlier create did not commit. No Operation
        recovery or default/current revision selection is implied.
        Host/Origin refusal uses 403; unsupported methods use 405 with Allow.
        Reads accept no body and invalid read framing is a 400 input error.
      parameters:
        - $ref: "#/components/parameters/ProfileIdPath"
        - $ref: "#/components/parameters/RevisionPath"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Profile revision, including unpublished drafts.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "./scenario-profile.schema.json"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/ProfileReadMethodNotAllowed"
        "503":
          $ref: "#/components/responses/ProfileReadUnavailable"
  /v1/nexus/admin/profiles/{profile_id}/revisions/{revision}/publications:
    post:
      tags: [profiles]
      operationId: publishProfileRevision
      summary: Validate and publish a draft profile revision
      description: |
        The target revision must be a draft and the supplied validation evidence
        must describe it. The server rechecks parameter domains, capability
        composition, override allowlists, and production-tier evidence before
        atomically changing the revision to `published` and activating the
        family's current pointer. `expected_current_revision` is a
        compare-and-swap guard; null is valid only when no revision is current.
        A changed pointer returns 409 `configuration_changed`. An identical
        Idempotency-Key replay returns the original publication; a changed
        intent under the same key returns 409 `idempotency_conflict`.

        The submitted validation identifies evidence to verify, not authority
        to publish. The server must resolve trusted evidence for this fixed
        profile revision and recheck its current applicability; a schema-valid
        report or caller-supplied digest alone cannot establish qualification.

        An unreadable original result or uncertain commit returns 503
        `profile_result_unknown`, with `retryable: false`. This does not prove
        that publication or pointer activation failed. Only a caller retaining
        the original Idempotency-Key may explicitly replay this same POST with
        the complete original path, body and key to recover its original result,
        before re-evaluating a new mutation or current-pointer CAS. There is no
        automatic retry, new key, Operation or HTTP query-by-key resource.
        Keyless unknown results have no promised automatic recovery. A fixed
        revision GET describes that resource, not the outcome of this command;
        unreadable metadata cannot be reported as confirmed absence.

        Malformed path/header/body input returns 400. Bounded ingress may refuse
        Host/Origin (403), method (405 with Allow: POST), receive timeout (408),
        size (413), non-JSON media (415), or local receive capacity (429).
        These refusals describe this HTTP attempt and do not settle an earlier
        original-key result or authorize a different key or automatic mutation.
      parameters:
        - $ref: "#/components/parameters/ProfileIdPath"
        - $ref: "#/components/parameters/RevisionPath"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfilePublicationRequest"
      responses:
        "200":
          description: Profile revision published and activated, or the original publication replayed.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfilePublishedRevision"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/ProfileCreateMethodNotAllowed"
        "408":
          $ref: "#/components/responses/ProfileReceiveTimeout"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/ProfileRequestTooLarge"
        "415":
          $ref: "#/components/responses/ProfileMediaUnsupported"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/ProfileReceiveFull"
        "503":
          $ref: "#/components/responses/ProfileLifecycleUnknown"
  /v1/nexus/admin/profiles/{profile_id}/revisions/{revision}/activations:
    post:
      tags: [profiles]
      operationId: activatePublishedProfileRevision
      summary: Roll the current profile pointer back or forward to a published revision
      description: |
        Activates an existing `published` revision without modifying it. This is
        the explicit rollback path. `expected_current_revision` is the current
        pointer observed by the operator; a mismatch returns 409
        `configuration_changed`. Retired, disabled, and draft revisions cannot be
        activated. An identical Idempotency-Key replay returns the original
        activation; a changed intent under the same key returns 409
        `idempotency_conflict`.

        An unreadable original result or uncertain commit returns 503
        `profile_result_unknown`, with `retryable: false`; it is not evidence
        that the pointer stayed unchanged. Only a caller retaining the original
        Idempotency-Key may explicitly replay this same POST with its complete
        original path, body and key to recover its original result, before
        evaluating a new mutation or the current-pointer CAS. No automatic
        retry, new key, Operation or HTTP query-by-key resource is provided.
        Keyless unknown results have no promised automatic recovery. A fixed
        revision GET does not prove the outcome or identity of this command;
        unreadable metadata cannot be reported as confirmed absence.

        Malformed path/header/body input returns 400. Bounded ingress may refuse
        Host/Origin (403), method (405 with Allow: POST), receive timeout (408),
        size (413), non-JSON media (415), or local receive capacity (429).
        These refusals do not settle an earlier original-key result or permit
        a different key or an automatic mutation. Lifecycle/CAS conflicts retain
        the existing 409 response; activation never changes revision contents
        or treats a draft/retired/disabled revision as published.
      parameters:
        - $ref: "#/components/parameters/ProfileIdPath"
        - $ref: "#/components/parameters/RevisionPath"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileActivationRequest"
      responses:
        "200":
          description: Published profile revision activated, or the original activation replayed.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfilePublishedRevision"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/ProfileCreateMethodNotAllowed"
        "408":
          $ref: "#/components/responses/ProfileReceiveTimeout"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/ProfileRequestTooLarge"
        "415":
          $ref: "#/components/responses/ProfileMediaUnsupported"
        "429":
          $ref: "#/components/responses/ProfileReceiveFull"
        "503":
          $ref: "#/components/responses/ProfileLifecycleUnknown"
  /v1/nexus/admin/profiles/{profile_id}/revisions/{revision}/retirements:
    post:
      tags: [profiles]
      operationId: retireProfileRevision
      summary: Retire or disable a scenario-profile revision
      description: |
        `retire` stops new references while already fixed jobs and sessions keep
        their pinned revision. `disable` additionally blocks new submissions
        that would select this revision. If the revision is current, retirement
        clears the family's current pointer; it does not silently roll back to
        another revision. Use the activations endpoint to select a known-good
        published revision explicitly. An identical Idempotency-Key replay
        returns the original retirement; a changed intent under the same key
        returns 409 `idempotency_conflict`.
      parameters:
        - $ref: "#/components/parameters/ProfileIdPath"
        - $ref: "#/components/parameters/RevisionPath"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileRevisionRetirementRequest"
      responses:
        "200":
          description: Profile revision retired or disabled.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "./scenario-profile.schema.json"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /v1/nexus/admin/model-bindings:
    get:
      tags: [model-bindings]
      operationId: listModelBindings
      summary: List model binding families and their current revisions
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [draft, published, retired, disabled]
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Model binding families.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelBindingList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      tags:
        - model-bindings
      operationId: createModelBindingDraft
      summary: Create an immutable draft binding revision
      description: |
        Creates a new immutable revision in draft state. The registry allocates
        the family revision and a globally unique revision_id; the caller cannot
        supply either identity. Independent successful commands append distinct
        revisions, preserving earlier history. supersedes_revision records a
        supersession relationship; it is not an expected-head CAS guard.
        Publishing requires separate capacity and qualification evidence.

        Replaying the same Idempotency-Key and canonical complete intent returns
        the original revision before any allocation. The same key with a different
        intent returns 409 idempotency_conflict without allocating a new revision.
        Malformed JSON, unknown fields and invalid header/schema values return 400;
        structurally valid but inconsistent binding composition returns 422.

        An unreadable original result or uncertain commit returns 503
        binding_result_unknown with retryable: false. It does not establish that
        no revision was created. There is no automatic retry, new key, Operation
        or query-by-key recovery resource. A caller retaining the original key
        may explicitly replay this same POST with the exact original intent and
        key to resolve that result. Without an original key automatic recovery
        is not promised; a candidate revision GET does not prove original-command
        ownership. Receive refusals do not settle an earlier original-key outcome.

        The bounded public ingress may refuse Host/Origin (403), unsupported
        method (405 with Allow), receive timeout (408), request size (413),
        non-JSON media (415), or local receive capacity (429). Limits are deployment
        configuration, not implicit binding parameters or qualification evidence.
      parameters:
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelBindingCreateRequest"
      responses:
        "201":
          description: Draft binding revision created.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelBindingDraftRevision"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/BindingDraftConflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/BindingCreateMethodNotAllowed"
        "408":
          $ref: "#/components/responses/BindingReceiveTimeout"
        "413":
          $ref: "#/components/responses/BindingRequestTooLarge"
        "415":
          $ref: "#/components/responses/BindingMediaUnsupported"
        "429":
          $ref: "#/components/responses/BindingReceiveFull"
        "503":
          $ref: "#/components/responses/BindingCreationUnknown"
  /v1/nexus/admin/model-bindings/{binding_id}/revisions/{revision}:
    get:
      tags:
        - model-bindings
      operationId: getModelBindingRevision
      summary: Get one immutable binding revision
      parameters:
        - $ref: "#/components/parameters/BindingIdPath"
        - $ref: "#/components/parameters/RevisionPath"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Binding revision.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: ./model-binding.schema.json
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/BindingReadMethodNotAllowed"
        "503":
          $ref: "#/components/responses/BindingReadUnavailable"
      description: |
        Reads only the explicitly named immutable revision; never allocates,
        publishes, activates or selects a current/default revision. Invalid
        path/header/query values or read body/framing return 400. Return 404
        only when an authoritative read confirms this revision is absent.
        Unreadable metadata returns 503 binding_unavailable with retryable: true
        for this same fixed GET. It is not absence or evidence that a prior
        create did not commit. Host/Origin refusal uses 403; unsupported methods
        use 405 with Allow. No Operation or keyless recovery is implied.
  /v1/nexus/admin/model-bindings/{binding_id}/publications:
    post:
      tags: [model-bindings]
      operationId: publishModelBindingRevision
      summary: Publish a draft binding revision with capacity and qualification evidence
      description: |
        The referenced capacity manifest and qualification report must describe
        the same binding revision and compatible topology. Production release
        tier additionally requires every required qualification scenario to pass.
        `expected_revision` is the exact draft revision to publish and activate
        for new sessions and jobs; it is not the family head. The publication
        atomically makes that revision current. `expected_current_revision` is
        the active revision observed before the request and is a compare-and-swap
        guard; null is valid only when no revision is active. A changed pointer
        returns 409 `configuration_changed`. Replaying the same Idempotency-Key
        and canonical intent returns 200 with the original result; the same key
        with a different intent returns 409 `idempotency_conflict`. A target
        revision that is not draft returns 409 `binding_not_draft`.
      parameters:
        - $ref: "#/components/parameters/BindingIdPath"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelBindingPublicationRequest"
      responses:
        "201":
          description: Binding published.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "./model-binding.schema.json"
        "200":
          description: Idempotent replay of the same publication.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "./model-binding.schema.json"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /v1/nexus/admin/model-bindings/{binding_id}/revisions/{revision}/retirements:
    post:
      tags: [model-bindings]
      operationId: retireModelBindingRevision
      summary: Retire or disable a model binding revision
      description: |
        Retiring a binding stops new references but preserves immutable history.
        Emergency disable also cancels confirmed in-flight use; unknown cleanup
        stays quarantined and no budget is released without stop evidence.
      parameters:
        - $ref: "#/components/parameters/BindingIdPath"
        - $ref: "#/components/parameters/RevisionPath"
