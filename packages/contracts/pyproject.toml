[project]
name = "speechnexus-contracts"
version = "0.1.0.dev0"
description = "Generated SpeechNexus boundary types and offline wire validation"
requires-python = ">=3.14,<3.15"
dependencies = ["jsonschema[format]>=4.23,<5"]

[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speechnexus_contracts"]
