# Minimal RBAC for the node controller's Kubernetes runtime driver.
#
# The plan (docs/plans/2026-11-25-engine-runtime-k8s.md §3.6) puts the controller
# in the cluster it schedules engine Pods into, so it authenticates with a
# ServiceAccount instead of a host-mounted kubeconfig. Nothing outside its own
# namespace is granted: the driver creates, reads, lists, watches and deletes
# Pods there and nowhere else.
#
# This is a reviewed manifest, not an applied one: selecting the driver does not
# ship it. Apply it deliberately with `kubectl apply -f` when the compute plane
# moves onto the cluster, then set
# `SPEECHNEXUS_CONTROLLER_K8S_NAMESPACE` and
# `SPEECHNEXUS_CONTROLLER_K8S_SERVICE_ACCOUNT_NAME` to the two names below. The
# driver refuses to start when the mounted credential belongs to another
# ServiceAccount, so a mismatch fails at boot instead of on the first Pod.
#
# The approved templates mount host directories read-only (`read_only_binds`),
# so this namespace must not enforce the `restricted` Pod Security Standard.
#
# `delete` is what the stop path uses: the request carries the Pod UID as an
# API-level precondition, so a Pod rebuilt under the same name is refused by the
# API server rather than deleted by the previous generation's stop.
#
# `events` is read-only and is what the inspect path uses: when a Pod stays
# Pending or never becomes Ready, the recorded event reason is the only thing
# that says why (an unpullable image, an unsatisfiable schedule, a rejected
# container configuration). No event is ever written or deleted.
apiVersion: v1
kind: Namespace
metadata:
  name: speechnexus
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: speechnexus-node-controller
  namespace: speechnexus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: speechnexus-node-controller
  namespace: speechnexus
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: speechnexus-node-controller
  namespace: speechnexus
subjects:
  - kind: ServiceAccount
    name: speechnexus-node-controller
    namespace: speechnexus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: speechnexus-node-controller
