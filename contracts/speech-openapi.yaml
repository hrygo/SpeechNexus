    RealtimeConstraints:
      type: object
      additionalProperties: false
      properties:
        max_admission_wait_ms:
          type: integer
          minimum: 0
          maximum: 60000
        allow_degradation:
          type: boolean
          default: false
    RealtimeSessionCreateRequest:
      type: object
      additionalProperties: false
      required: [profile, modalities, models]
      allOf:
        - if:
            properties:
              modalities:
                contains: {const: asr}
            required: [modalities]
          then:
            properties:
              models:
                required: [asr]
        - if:
            properties:
              modalities:
                contains: {const: tts}
            required: [modalities]
          then:
            properties:
              models:
                required: [tts]
        - if:
            properties:
              modalities:
                not:
                  contains: {const: asr}
            required: [modalities]
          then:
            properties:
              models:
                not:
                  required: [asr]
        - if:
            properties:
              modalities:
                not:
                  contains: {const: tts}
            required: [modalities]
          then:
            properties:
              models:
                not:
                  required: [tts]
      properties:
        workspace_id:
          $ref: "#/components/schemas/Identifier"
        client_reference:
          type: string
          maxLength: 256
        profile:
          $ref: "#/components/schemas/ResourceReference"
        modalities:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [asr, tts]
        models:
          $ref: "#/components/schemas/RealtimeModelSelection"
        voice:
          $ref: "#/components/schemas/ResourceReference"
        audio:
          $ref: "#/components/schemas/RealtimeAudioSelection"
        overrides:
          $ref: "#/components/schemas/RealtimeOverrides"
        constraints:
          $ref: "#/components/schemas/RealtimeConstraints"
        expires_in_s:
          type: integer
          minimum: 5
          maximum: 300
          default: 30
    RealtimeSessionStatus:
      type: string
      enum: [created, admitting, active, draining, closed, failed, expired]
    RealtimeSessionLimits:
      $ref: "shared/public-audio.schema.json#/$defs/RealtimeLimits"
    RealtimeTerminalOperation:
      type: object
      additionalProperties: false
      required: [operation_id, kind, status, cleanup_state]
      properties:
        operation_id:
          $ref: "#/components/schemas/Identifier"
        kind:
          $ref: "#/components/schemas/OperationKind"
        status:
          $ref: "shared/operation-states.schema.json#/$defs/TerminalOperationStatus"
        cleanup_state:
          $ref: "#/components/schemas/CleanupState"
        receipt_id:
          oneOf:
            - $ref: "#/components/schemas/Identifier"
            - type: "null"
      allOf:
        - if:
            properties:
              status:
                const: cancelled
            required: [status]
          then:
            properties:
              cleanup_state:
                enum: [not_required, complete]
    RealtimeSession:
      type: object
      additionalProperties: false
      required:
        - id
        - object
        - status
        - expires_at
        - connection_url
        - effective_configuration
        - limits
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        object:
          const: nexus.realtime_session
        status:
          $ref: "#/components/schemas/RealtimeSessionStatus"
        expires_at:
          type: string
          format: date-time
        connection_url:
          type: string
          minLength: 1
          maxLength: 2048
          description: Relative or absolute WebSocket URL containing session_id. The URL is not a credential.
        effective_configuration:
          $ref: "#/components/schemas/EffectiveConfiguration"
        limits:
          $ref: "#/components/schemas/RealtimeSessionLimits"
        input_ack_sample:
          type: integer
          minimum: 0
        terminal_operations:
          type: array
          items:
            $ref: "#/components/schemas/RealtimeTerminalOperation"
        cleanup_state:
          $ref: "#/components/schemas/CleanupState"
    RealtimeSessionCancelRequest:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          type: string
          enum: [drain, abort]
    VoiceDesignCreateRequest:
      type: object
      additionalProperties: false
      required: [model, input]
      properties:
        workspace_id:
          $ref: "#/components/schemas/Identifier"
        client_reference:
          type: string
          maxLength: 256
        model:
          type: string
          minLength: 1
          maxLength: 128
        input:
          $ref: "#/components/schemas/VoiceDesignInput"
        constraints:
          $ref: "#/components/schemas/JobConstraints"
    VoiceCloneCreateRequest:
      type: object
      additionalProperties: false
      required: [model, input]
      properties:
        workspace_id:
          $ref: "#/components/schemas/Identifier"
        client_reference:
          type: string
          maxLength: 256
        model:
          type: string
          minLength: 1
          maxLength: 128
        input:
          $ref: "#/components/schemas/VoiceCloneInput"
        constraints:
          $ref: "#/components/schemas/JobConstraints"
    VoiceDesignInput:
      type: object
      additionalProperties: false
      required: [description, preview_text]
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 2000
        preview_text:
          type: string
          minLength: 1
          maxLength: 2000
        language:
          type: string
          maxLength: 35
        display_name:
          type: string
          minLength: 1
          maxLength: 128
    VoiceCloneInput:
      type: object
      additionalProperties: false
      required: [reference_audio_asset_id, source_use_confirmed]
      properties:
        reference_audio_asset_id:
          $ref: "#/components/schemas/Identifier"
        reference_text:
          type: [string, "null"]
          maxLength: 10000
        preview_text:
          type: [string, "null"]
          maxLength: 2000
        language:
          type: string
          maxLength: 35
        display_name:
          type: string
          minLength: 1
          maxLength: 128
        source_use_confirmed:
          type: boolean
          const: true
    VoiceCreationAccepted:
      type: object
      additionalProperties: false
      required: [object, draft, job]
      properties:
        object:
          const: nexus.voice_creation
        draft:
          $ref: "./voice-resource.schema.json#/$defs/VoiceDraft"
        job:
          $ref: "#/components/schemas/Job"
    VoiceDraftView:
      type: object
      additionalProperties: false
      required: [object, draft, revision]
      properties:
        object:
          const: nexus.voice_draft_view
        draft:
          $ref: "./voice-resource.schema.json#/$defs/VoiceDraft"
        revision:
          oneOf:
            - $ref: "./voice-resource.schema.json#/$defs/VoiceDraftRevision"
            - type: "null"
    VoiceDraftPatch:
      type: object
      additionalProperties: false
      required: [expected_metadata_revision, display_name]
      properties:
        expected_metadata_revision:
          type: integer
          minimum: 1
        display_name:
          type: string
          minLength: 1
          maxLength: 128
    VoiceGenerationRequest:
      type: object
      additionalProperties: false
      required: [expected_draft_revision, model, input]
      properties:
        expected_draft_revision:
          $ref: "#/components/schemas/Revision"
        model:
          type: string
          minLength: 1
          maxLength: 128
        input:
          oneOf:
            - $ref: "#/components/schemas/VoiceDesignInput"
            - $ref: "#/components/schemas/VoiceCloneInput"
        constraints:
          $ref: "#/components/schemas/JobConstraints"
    VoiceGenerationAccepted:
      type: object
      additionalProperties: false
      required: [object, draft, revision, job]
      properties:
        object:
          const: nexus.voice_generation
        draft:
          $ref: "./voice-resource.schema.json#/$defs/VoiceDraft"
        revision:
          $ref: "./voice-resource.schema.json#/$defs/VoiceDraftRevision"
        job:
          $ref: "#/components/schemas/Job"
    VoicePreviewRequest:
      type: object
      additionalProperties: false
      required: [expected_draft_revision, text]
      properties:
        expected_draft_revision:
          $ref: "#/components/schemas/Revision"
        text:
          type: string
          minLength: 1
          maxLength: 2000
        model:
          type: string
          maxLength: 128
    VoiceValidationRequest:
      type: object
      additionalProperties: false
      required: [expected_draft_revision, validation_set_revision]
      properties:
        expected_draft_revision:
          $ref: "#/components/schemas/Revision"
        validation_set_revision:
          $ref: "#/components/schemas/Revision"
        model:
          type: string
          maxLength: 128
    VoicePublicationRequest:
      type: object
      additionalProperties: false
      required: [expected_draft_revision, validation_job_id, manual_confirmation]
      properties:
        expected_draft_revision:
          $ref: "#/components/schemas/Revision"
        validation_job_id:
          $ref: "#/components/schemas/Identifier"
        manual_confirmation:
          type: boolean
          const: true
        display_name:
          type: string
          minLength: 1
          maxLength: 128
    VoiceRetirementRequest:
      $ref: "shared/lifecycle.schema.json#/$defs/RetirementRequest"
