components:
  securitySchemes:
    SharedServiceKey:
      type: http
      scheme: bearer
      description: |
        Optional deployment-wide shared credential. It grants access to the
        shared deployment, not a user identity. When disabled, any Authorization
        header value is accepted for SDK compatibility and is not interpreted as
        a user.
  parameters:
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: Return 304 without a body when the artifact validator matches.
      schema:
        type: string
    XRequestId:
      name: X-Request-ID
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 8
        maxLength: 128
      description: |
        Optional idempotency key. The scope is (deployment_id, workspace_id,
        operation_family, key). Standard OpenAI clients may omit it.
    WorkspaceIdQuery:
      name: workspace_id
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/Identifier"
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    ProfileIdPath:
      name: profile_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    RevisionPath:
      name: revision
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Revision"
    VoiceIdPath:
      name: voice_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    JobIdPath:
      name: job_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    OperationIdPath:
      name: operation_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    AssetIdPath:
      name: asset_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    ArtifactIdPath:
      name: artifact_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    SessionIdPath:
      name: session_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    DraftIdPath:
      name: draft_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    Range:
      name: Range
      in: header
      required: false
      schema:
        type: string
        pattern: "^bytes=[0-9]*-[0-9]*$"
  headers:
    AssetLocation:
      description: Relative URL of the original Asset; its existence or readiness may be unknown.
      schema:
        type: string
    NoOrdinaryRetry:
      description: |
        Suppress automatic SDK transport replay; reconcile the original identity
        instead. This does not contradict `error.retryable`: a retryable error
        authorizes a new logical request, not a replay of the same transport
        attempt.
      schema:
        type: string
        const: "false"
    XRequestId:
      description: Validated client request ID or a server-generated correlation ID.
      schema:
        type: string
    XOperationId:
      description: Operation identity for receipt and cancellation coordination.
      schema:
        $ref: "#/components/schemas/Identifier"
    XAudioFormat:
      description: Actual audio encoding of the response body.
      schema:
        $ref: "#/components/schemas/AudioFormat"
    XSampleRateHz:
      description: Actual output sample rate.
      schema:
        type: integer
        minimum: 8000
        maximum: 96000
    XChannels:
      description: Actual output channel count.
      schema:
        type: integer
        minimum: 1
        maximum: 2
    ETag:
      description: Opaque validator for the selected public representation.
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before retrying a capacity or cancellation coordination request.
      schema:
        type: integer
        minimum: 0
    AcceptRanges:
      schema:
        type: string
        const: bytes
    ContentLength:
      schema:
        type: integer
        minimum: 0
    ContentRange:
      schema:
        type: string
        pattern: "^bytes [0-9]+-[0-9]+/[0-9]+$"
  responses:
    ArtifactNotModified:
      description: The supplied ETag matches the artifact; the response has no body.
      headers:
        ETag:
          $ref: "#/components/headers/ETag"
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content: {}
    MethodNotAllowed:
      description: |
        The registered path does not accept this HTTP method. `Allow` lists every
        method registered on that path template, including placeholder methods.
        The Job paths keep their own `job_method_not_allowed` code.
      headers:
        Allow:
          required: true
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    VoiceCatalogueBadRequest:
      description: |
        Malformed path values, unknown query fields, invalid query values or
        duplicate query parameters. Correct the request; unchanged retries
        cannot resolve this error. No catalogue read or execution is performed.
      headers:
        Cache-Control:
          required: true
          schema:
            type: string
            const: no-store
        X-Should-Retry:
          required: true
          schema:
            type: string
            const: "false"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorResponse"
              - properties:
                  error:
                    properties:
                      code:
                        const: voice_invalid_request
                      type:
                        const: invalid_request_error
                      retryable:
                        const: false
                      nexus: false
    AssetReceiveTimeout:
      description: The bounded upload receive deadline expired before reservation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AssetUploadConflict:
      description: |
        Idempotency fingerprint conflict or an original upload remains in progress.
        asset_upload_in_progress does not represent an Operation. Query the original
        Asset via Location; do not create a new upload to recover an uncertain one.
      headers:
        Location:
          $ref: "#/components/headers/AssetLocation"
        X-Should-Retry:
          $ref: "#/components/headers/NoOrdinaryRetry"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AssetUploadUnavailable:
      description: |
        Storage, retention configuration, or inspection is unavailable, or an
        original commit/PUT is unknown. Two inspection outcomes share this status
        and are not interchangeable.

        `asset_inspection_unavailable` means the deployment has no usable audio
        inspector for this request: a missing URL/token, an incompatible
        contract, a configuration-level refusal such as a bad bearer token or
        byte cap, an endpoint that cannot be reached (connection refused or
        reset, connect or read timeout), or a purpose the assembled inspector
        does not serve. The last case is reported with `param: purpose`, so a
        capability gap is distinguishable from a deployment that cannot inspect
        at all. Retrying the same request cannot succeed until deployment
        configuration changes, so `retryable` is `false`.

        `asset_inspection_busy` means a usable inspector answered that it is
        temporarily unable to serve this request: all slots are occupied,
        decoding exceeded its wall-clock deadline, or it reports itself
        unavailable. Inspection has no side effects, so a new request with the
        same body may succeed later; `retryable` is `true`. This is the only
        Asset 503 for which "retrying the same request may succeed" holds. An
        unreachable endpoint is not this case: it is indistinguishable from a
        missing deployment and is reported above.

        `X-Should-Retry` remains `false` for every Asset 503. It suppresses
        automatic SDK transport replay of an upload whose body may no longer be
        available; it does not say whether a new logical request can succeed.
        Only `error.retryable` carries that statement. For
        `asset_inspection_busy`, issue a new upload instead of replaying the
        original transport request.

        Unknown commit/PUT results are not ordinary retry permission. Location is
        present when an original Asset identity is known. Without an
        Idempotency-Key a new request is a new logical upload, not guaranteed
        recovery.
      headers:
        Location:
          $ref: "#/components/headers/AssetLocation"
        X-Should-Retry:
          $ref: "#/components/headers/NoOrdinaryRetry"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            asset_inspection_unavailable:
              value:
                error:
                  code: asset_inspection_unavailable
                  type: service_unavailable_error
                  message: Asset inspection is unavailable.
                  param: null
                  request_id: req_demo
                  retryable: false
            asset_inspection_busy:
              value:
                error:
                  code: asset_inspection_busy
                  type: service_unavailable_error
                  message: Asset inspection is temporarily busy.
                  param: null
                  request_id: req_demo
                  retryable: true
      x-nexus-error-codes:
        asset_inspection_unavailable:
          type: service_unavailable_error
          retryable: false
          description: |
            No usable audio inspector serves this request: missing or unusable
            configuration, an incompatible protocol, an endpoint that cannot be
            reached, or (with `param: purpose`) a purpose this inspector does not
            serve. Retrying the same request cannot succeed; the deployment must
            supply a compatible endpoint/token or select `text`.
        asset_inspection_busy:
          type: service_unavailable_error
          retryable: true
          description: |
            A configured inspector answered that it is busy, unavailable, or over
            its wall-clock deadline. A new request later may succeed because
            inspection writes no state. This code alone makes the "same request
            may succeed" statement true; a transport failure is not it.
    AssetContentUnprocessable:
      description: |
        The bytes were fully received but are not acceptable audio. Two stable
        codes share this status.

        `invalid_asset_audio`: not a qualified audio encoding (truncated,
        inconsistent RIFF, malformed chunk structure, non-PCM, or a media type
        the deployment does not accept such as an MP3 body).
        `asset_audio_too_long`: the media itself exceeds the configured duration
        or decode budget.

        Both are permanent content rejections. No `speech_assets` row, object,
        event, or Job is written; retrying the same bytes cannot succeed.
        `X-Should-Retry` is `false`. This 422 is not a transient inspector
        outage: a busy or unavailable inspector is the 503 family above.
      headers:
        X-Should-Retry:
          $ref: "#/components/headers/NoOrdinaryRetry"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            invalid_asset_audio:
              value:
                error:
                  code: invalid_asset_audio
                  type: invalid_request_error
                  message: The asset is not valid audio.
                  param: null
                  request_id: req_demo
                  retryable: false
            asset_audio_too_long:
              value:
                error:
                  code: asset_audio_too_long
                  type: invalid_request_error
                  message: The audio exceeds the duration limit.
                  param: null
                  request_id: req_demo
                  retryable: false
      x-nexus-error-codes:
        invalid_asset_audio:
          type: invalid_request_error
          retryable: false
          description: |
            The uploaded bytes are not qualified audio: truncated, inconsistent
            RIFF, malformed chunk structure, non-PCM, or a media type the
            deployment does not accept. No Asset row is written.
        asset_audio_too_long:
          type: invalid_request_error
          retryable: false
          description: |
            The media exceeds the configured duration or decode budget. No Asset
            row is written.
    AssetRangeNotSatisfiable:
      description: A malformed, multiple or unsatisfiable single byte range.
      headers:
        Content-Range:
          schema:
            type: string
            pattern: '^bytes \*/[0-9]+$'
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: Malformed request, invalid JSON, invalid audio, or unknown field.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Shared service credential required or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Origin/Host policy rejected the request or the feature is disabled.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    SpeechMethodNotAllowed:
      description: The speech path accepts POST only.
      headers:
        Allow:
          required: true
          schema:
            type: string
            const: POST
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found or not visible to the requested workspace.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    JobCancellationConflict:
      description: |
        `execution_cleanup_pending`: the Job's original execution has not confirmed
        stop, so capacity is still held and the request is refused. Nothing finishes
        that cleanup on its own, so `retryable` is false and no `Retry-After` is
        returned; the Job body reports the same `retryable: false`, and the
        operator path to an exit is documented in `docs/components/production-jobs.md`.
        `idempotency_conflict`: the same key identifies another Job cancellation
        intent.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: |
        Configuration changed, idempotency conflict, operation in progress, or cleanup pending.
        operation_in_progress requires error.nexus.operation_id for querying the original
        execution. response_not_replayable additionally requires error.nexus.receipt and
        never starts another execution. Query GET /v1/nexus/operations/{operation_id}.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Gone:
      description: Content or event history has expired and is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: |
        Upload or request body exceeds the declared or deployment-configured
        bound. The reply is non-retryable unchanged: the caller must shorten the
        body, and only the deployment operator can raise the limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    VoiceDraftSubmitUnprocessableEntity:
      description: |
        The request's own facts cannot produce this draft: the published model
        binding, the input asset, the parameters, or the request's admission
        deadline. Deterministic, so `retryable` is false and `X-Should-Retry` is
        false; a new request is the recovery. The enumerated codes are the only
        ones this operation answers with 422 -- a declaration without the enum is
        invisible to a consumer generating types (see also
        `voice_draft_engine_unavailable`, which is a 503 and not this class).
      headers:
        Cache-Control:
          required: true
          schema:
            type: string
            const: "no-store"
        X-Should-Retry:
          required: true
          description: Always the string "false"; every code in this response is deterministic.
          schema:
            type: string
            const: "false"
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [error]
            properties:
              error:
                $ref: "./shared/errors.schema.json#/$defs/ErrorBody"
            allOf:
              - $ref: "#/components/schemas/ErrorResponse"
              - properties:
                  error:
                    properties:
                      code:
                        enum:
                              - voice_draft_input_unavailable
                              - voice_draft_request_expired
                      type:
                        const: invalid_request_error
                      retryable:
                        enum: [true, false]
                      nexus: false
    VoiceDraftCandidateUnprocessableEntity:
      description: |
        Same class as `VoiceDraftSubmitUnprocessableEntity`, plus
        `voice_draft_not_candidate`: this operation only accepts a candidate
        revision, which is a fact about the request's own target.
      headers:
        Cache-Control:
          required: true
          schema:
            type: string
            const: "no-store"
        X-Should-Retry:
          required: true
          description: Always the string "false"; every code in this response is deterministic.
          schema:
            type: string
            const: "false"
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [error]
            properties:
              error:
                $ref: "./shared/errors.schema.json#/$defs/ErrorBody"
            allOf:
              - $ref: "#/components/schemas/ErrorResponse"
              - properties:
                  error:
                    properties:
                      code:
                        enum:
                              - voice_draft_input_unavailable
                              - voice_draft_not_candidate
                              - voice_draft_request_expired
                      type:
                        const: invalid_request_error
                      retryable:
                        enum: [true, false]
                      nexus: false
    UnprocessableEntity:
      description: Unsupported parameter, incompatible profile, or async_required.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: Quota or queue limit exceeded; follow Retry-After.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Backend or capacity unavailable; retry only when `retryable` is true.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    OperationNotImplemented:
      description: |
        The contract declares this operation and this deployment does not
        implement it. `operation_not_implemented` is the only code a placeholder
        returns: it is not `backend_unavailable` (a real outage, retryable), not
        a `*_not_found` code (a confirmed missing resource) and not
        `invalid_request_error`. Repeating the same request cannot succeed until
        the operation ships.

        The five operations that already declared `ServiceUnavailable` before this
        component existed keep that declaration: it accepts the same body, and
        replacing it would drop the compatible `Retry-After` header from the
        versioned surface. Everything else that answers this error points here.
      headers:
        Cache-Control:
          required: true
          schema:
            type: string
            const: no-store
        X-Should-Retry:
          required: true
          schema:
            type: string
            const: "false"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorResponse"
              - properties:
                  error:
                    properties:
                      code:
                        const: operation_not_implemented
                      type:
                        const: service_unavailable_error
                      retryable:
                        const: false
                      nexus: false
    VoiceDraftCreationConflict:
      description: |
        `voice_draft_conflict`: the Idempotency-Key identifies another intent,
        or the metadata revision conflicts.

        `voice_draft_outcome_unknown`: the creation request did not carry an
        Idempotency-Key and an earlier submission may already have committed.
        A resubmission is a new intent and can create a second draft and
        generation Job, so this reply is not retryable: reconcile the original
        request before deciding to submit again.
      headers:
        Cache-Control:
          required: true
          schema:
            type: string
            const: "no-store"
        X-Should-Retry:
          required: true
          schema:
            type: string
            const: "false"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorResponse"
              - properties:
                  error:
                    properties:
                      code:
                        enum:
                          - voice_draft_conflict
                          - voice_draft_outcome_unknown
                      type:
                        const: invalid_request_error
                      retryable:
                        const: false
                      nexus: false
    VoiceDraftContractViolation:
      description: |
        The deployment produced a voice draft response that violates this
        contract, or the storage rejected a voice draft write deterministically
        (a CHECK or constraint refusal). The operation is implemented and the
        storage is reachable, so both are implementation defects rather than an
        outage: they are not retryable and repeating the request cannot succeed
        until they are fixed. A response-shape violation is not an outage, and
        a deterministic storage refusal is neither a client conflict nor a
        transient storage failure. The reply still uses the public error
        envelope.
      headers:
        Cache-Control:
          required: true
          schema:
            type: string
            const: "no-store"
        X-Should-Retry:
          required: true
          schema:
            type: string
            const: "false"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorResponse"
              - properties:
                  error:
                    properties:
                      code:
                        const: voice_draft_contract_violation
                      type:
                        const: api_error
                      retryable:
                        const: false
                      nexus: false
    PronunciationReadForbidden:
      description: The configured Host/Origin policy rejected this fixed read.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ProfileReadMethodNotAllowed:
      description: The public profile path accepts GET only.
      headers:
        Allow:
          required: true
          schema:
            type: string
            const: GET
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PronunciationReadMethodNotAllowed:
      description: This fixed pronunciation-revision path accepts GET only.
      headers:
        Allow:
          required: true
          schema:
            type: string
            const: GET
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PronunciationReadNotFound:
      description: The fixed revision is confirmed missing; unavailable metadata is not absence.
      headers:
        Cache-Control:
          required: true
          schema:
            type: string
            const: no-store
        X-Should-Retry:
          required: true
          schema:
            type: string
            const: "false"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorResponse"
              - properties:
                  error:
                    properties:
                      code:
                        const: pronunciation_not_found
                      type:
                        const: not_found_error
                      retryable:
                        const: false
                      nexus: false
    PronunciationReadUnavailable:
      description: |
        Fixed metadata cannot currently be established. Repeat only the same
        fixed GET; this is neither a missing resource nor an execution result.
      headers:
        Cache-Control:
          required: true
          schema:
            type: string
            const: no-store
        X-Should-Retry:
          required: true
          schema:
            type: string
            const: "true"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorResponse"
              - properties:
                  error:
                    properties:
                      code:
                        const: pronunciation_unavailable
                      type:
                        const: service_unavailable_error
                      retryable:
                        const: true
                      nexus: false
    PronunciationInvalidRequest:
      description: >-
        Invalid collection framing: an unreadable cursor, an out-of-range or
        duplicate `limit`, an unknown query parameter, a list body or an invalid
        create document/header. This is a request error, not a missing resource
        and not an outage.
      headers:
        Cache-Control:
          required: true
          schema:
            type: string
            const: "no-store"
        X-Should-Retry:
          required: true
          schema:
            type: string
            const: "false"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorResponse"
              - properties:
                  error:
                    properties:
                      code:
                        const: pronunciation_invalid_request
                      type:
                        const: invalid_request_error
                      retryable:
                        const: false
                      nexus: false
    PronunciationCollectionForbidden:
      description: The configured Host/Origin policy rejected this collection request.
      headers:
        Cache-Control:
          required: true
          schema:
            type: string
            const: "no-store"
        X-Should-Retry:
          required: true
          schema:
            type: string
            const: "false"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorResponse"
              - properties:
                  error:
                    properties:
                      code:
                        enum:
                          - pronunciation_host_rejected
                          - pronunciation_origin_rejected
                      type:
                        const: permission_error
                      retryable:
                        const: false
                      nexus: false
    PronunciationSetConflict:
      description: |
        `pronunciation_idempotency_conflict`: the Idempotency-Key identifies
        another intent. `pronunciation_configuration_changed`: an append's
        `expected_revision` is not the current allocation head.
        `pronunciation_outcome_unknown`: a keyless submission may already have
        committed, so resubmitting would create another set; reconcile the
        original attempt before deciding to submit again. None of these is
        retryable unchanged.
      headers:
        Cache-Control:
          required: true
          schema:
            type: string
            const: "no-store"
        X-Should-Retry:
          required: true
          schema:
            type: string
            const: "false"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorResponse"
              - properties:
                  error:
                    properties:
                      code:
                        enum:
                          - pronunciation_idempotency_conflict
                          - pronunciation_configuration_changed
                          - pronunciation_outcome_unknown
                      type:
                        const: invalid_request_error
                      retryable:
                        const: false
                      nexus: false
    PronunciationPublicationNotSupported:
      description: >-
        This deployment has not configured the atomic-publication identity and
        this request did not match a committed command receipt. No new revision,
        publication row or head was created. If the same Idempotency-Key already
        committed a publication, repeating it returns 200 with the original
        revision instead of this error. Send `publish: false` for a draft, or
        configure the publication role and repeat the request unchanged.
      headers:
        Cache-Control:
          required: true
          schema:
            type: string
            const: "no-store"
        X-Should-Retry:
          required: true
          schema:
            type: string
            const: "false"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorResponse"
              - properties:
                  error:
                    properties:
                      code:
                        const: pronunciation_publication_not_supported
                      type:
                        const: invalid_request_error
                      retryable:
                        const: false
                      nexus: false
    PronunciationContractViolation:
      description: |
        The deployment produced a pronunciation response that violates this
        contract. Storage is reachable, so this is an implementation defect
        rather than an outage: it is not retryable and repeating the request
        cannot succeed until it is fixed. The reply still uses the public error
        envelope.
      headers:
        Cache-Control:
          required: true
          schema:
            type: string
            const: "no-store"
        X-Should-Retry:
          required: true
          schema:
            type: string
            const: "false"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorResponse"
              - properties:
                  error:
                    properties:
                      code:
                        const: pronunciation_contract_violation
                      type:
                        const: api_error
                      retryable:
                        const: false
                      nexus: false
    GatewayTimeout:
      description: Operation deadline exceeded; coordinate the original intent before retrying.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    Identifier:
      $ref: "shared/identifiers.schema.json#/$defs/Identifier"
    Revision:
      $ref: "shared/identifiers.schema.json#/$defs/Revision"
    EventSequence:
      $ref: "shared/identifiers.schema.json#/$defs/EventSequence"
    Sha256Digest:
      $ref: "shared/identifiers.schema.json#/$defs/Sha256Digest"
    ResourceReference:
      $ref: "shared/references.schema.json#/$defs/ResourceReference"
    ReleaseTier:
      $ref: "shared/capability-domains.schema.json#/$defs/ReleaseTier"
    ProfileReleaseTier:
      $ref: "shared/capability-domains.schema.json#/$defs/ProfileReleaseTier"
    ServiceClass:
      $ref: "shared/capability-domains.schema.json#/$defs/ServiceClass"
    AudioFormat:
      $ref: "shared/capability-domains.schema.json#/$defs/AudioFormat"
    TranscriptFormat:
      $ref: "shared/capability-domains.schema.json#/$defs/TranscriptFormat"
    TextCommitMode:
      $ref: "shared/capability-domains.schema.json#/$defs/TextCommitMode"
    AuxiliaryMode:
      $ref: "shared/capability-domains.schema.json#/$defs/AuxiliaryMode"
    ErrorResponse:
      $ref: "shared/errors.schema.json#/$defs/ErrorResponse"
    VersionIdentity:
      type: object
      additionalProperties: false
      required: [version, contract_digest]
      properties:
        version:
          type: string
          minLength: 1
          description: API package version, the same value `/healthz` reports.
        contract_digest:
          $ref: "#/components/schemas/Sha256Digest"
          description: |
            Digest of the canonical contract sources this process was generated
            from. Equal digest values mean the API and the browser consumer
            compiled the same contracts.
    ModelList:
      type: object
      additionalProperties: false
      required: [object, data]
      properties:
        object:
          const: list
        data:
          type: array
          items:
            $ref: "#/components/schemas/Model"
    Model:
      type: object
      additionalProperties: false
      required: [id, object, created, owned_by]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        object:
          const: model
        created:
          type: integer
          minimum: 0
        owned_by:
          type: string
          minLength: 1
          maxLength: 128
        nexus:
          $ref: "#/components/schemas/ModelNexus"
    ModelNexus:
      type: object
      additionalProperties: false
      required: [logical_model, binding, tasks, release_tier, readiness]
      properties:
        logical_model:
          type: string
          minLength: 1
          maxLength: 128
        binding:
          $ref: "#/components/schemas/ResourceReference"
        tasks:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/SpeechTaskKind"
        release_tier:
          $ref: "#/components/schemas/ReleaseTier"
        readiness:
          $ref: "#/components/schemas/ModelReadiness"
    SpeechTaskKind:
      $ref: "shared/capability-domains.schema.json#/$defs/SpeechTaskKind"
    ModelReadiness:
      type: object
      additionalProperties: false
      required: [configured, engine_ready, quality_qualified, admission_state]
      properties:
        configured:
          type: boolean
        engine_ready:
          type: boolean
        quality_qualified:
          type: boolean
        admission_state:
          type: string
          enum: [available, queueable, capacity_full, unavailable]
          description: |
            A static projection of whether this deployment has established the
            per-workspace admission facts, not a verdict for any workspace at this
            instant. This endpoint carries no workspace while admission is computed
            per workspace, so no value here answers whether a given workspace can be
            admitted now. `unavailable` reports that those facts are not established
            for this catalogue, which is the state the assembled catalogue reports;
            it implies neither an engine fault nor a refused admission. `available`,
            `queueable`, and `capacity_full` remain enum members with no producer:
            this deployment emits only `unavailable`, and the per-workspace
            admission report answers with its own vocabulary (`status` plus a
            single `cause`), never with these three values. The per-workspace
            surface is `GET /v1/nexus/jobs/admission-readiness` (it takes
            `workspace_id`); it returns the live verdict, so an actual create
            answer is either that report or `POST /v1/nexus/jobs`. None of these
            fields implies quality.
    TranscriptionRequest:
      type: object
      additionalProperties: false
      required: [file, model]
      allOf:
        - if:
            required: ["timestamp_granularities[]"]
          then:
            required: [response_format]
            properties:
              response_format:
                const: verbose_json
      properties:
        file:
          type: string
          format: binary
          description: Bounded audio file. Remote URLs and server paths are rejected.
        model:
          type: string
          minLength: 1
          maxLength: 128
        language:
          type: string
          maxLength: 35
          description: |
            Omit for automatic language detection. This field keeps the OpenAI
            language value semantics; `auto` is not a standard sentinel.
        prompt:
          type: string
          maxLength: 4000
        response_format:
          $ref: "#/components/schemas/TranscriptFormat"
          default: json
        timestamp_granularities[]:
          type: array
          uniqueItems: true
          maxItems: 2
          items:
            type: string
            enum: [segment, word]
          description: Only valid with response_format=verbose_json.
        nexus:
          type: string
          maxLength: 8192
          contentMediaType: application/json
          contentSchema:
            $ref: "#/components/schemas/TranscriptionNexusOptions"
          description: |
            JSON-encoded SpeechNexus options. Standard OpenAI clients omit it.
            Accepted keys are workspace_id, client_reference, profile_id,
            profile_revision, overrides, and deadline_ms. `overrides` contains
            only ASR policy fields; voice and pronunciation belong to TTS or
            nexus Jobs, not this endpoint.
    Transcription:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
        languages:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [code]
            properties:
              code:
                type: string
                maxLength: 35
        logprobs:
          type: array
          items:
            $ref: "#/components/schemas/TranscriptionLogprob"
        usage:
          $ref: "#/components/schemas/TranscriptionUsage"
    TranscriptionLogprob:
      type: object
      additionalProperties: false
      properties:
        token:
          type: [string, "null"]
        bytes:
          type: [array, "null"]
          items:
            type: number
        logprob:
          type: [number, "null"]
      description: |
        OpenAI SDK-compatible token log-probability shape. SpeechNexus returns
        this only when a binding supplies genuine log-probability evidence.
    TranscriptionVerbose:
      type: object
      additionalProperties: false
      required: [duration, language, text]
      properties:
        duration:
          type: number
          minimum: 0
        language:
          type: string
          maxLength: 35
        text:
          type: string
        segments:
          type: array
          items:
            $ref: "#/components/schemas/TranscriptionSegment"
        words:
          type: array
          items:
            $ref: "#/components/schemas/TranscriptionWord"
        usage:
          $ref: "#/components/schemas/UsageDuration"
          description: |
            OpenAI verbose_json uses duration usage only. Token usage is declared
            only for the non-verbose Transcription response, matching the
            official SDK's response model.
    TranscriptionSegment:
      type: object
      additionalProperties: false
      required:
        - id
        - avg_logprob
        - compression_ratio
        - end
        - no_speech_prob
        - seek
        - start
        - temperature
        - text
        - tokens
      properties:
        id:
          type: integer
          minimum: 0
        avg_logprob:
          type: number
        compression_ratio:
          type: number
        end:
          type: number
          minimum: 0
        no_speech_prob:
          type: number
          minimum: 0
          maximum: 1
        seek:
          type: integer
          minimum: 0
        start:
          type: number
          minimum: 0
        temperature:
          type: number
        text:
          type: string
        tokens:
          type: array
          items:
            type: integer
            minimum: 0
    TranscriptionWord:
      type: object
      additionalProperties: false
      required: [word, start, end]
      properties:
        word:
          type: string
        start:
          type: number
          minimum: 0
        end:
          type: number
          minimum: 0
    TranscriptionUsage:
      oneOf:
        - $ref: "#/components/schemas/UsageDuration"
        - $ref: "#/components/schemas/UsageTokens"
    UsageDuration:
      $ref: "shared/public-audio.schema.json#/$defs/UsageDuration"
    UsageTokens:
      $ref: "shared/public-audio.schema.json#/$defs/UsageTokens"
    SpeechRequest:
      type: object
      additionalProperties: false
      required: [model, input, voice]
      properties:
        model:
          type: string
          minLength: 1
          maxLength: 128
        input:
          type: string
          minLength: 1
          maxLength: 4096
          description: |
            Text spoken by one synthesis, bounded at `MAX_SPEECH_TEXT_CHARS`
            (4096) characters: one request synthesizes its `input` exactly once
            and never splits, truncates, or silently shortens it. Text above the
            bound is refused as `400` `invalid_request` with `param: input`.
            `POST /v1/nexus/jobs` enforces the same bound on `TtsJobInput.text`
            but reports the same condition as `422` `unsupported_parameter`
            (the asynchronous entry classifies a body that does not match the
            declared Job shape, the synchronous entry a body this route cannot
            accept). Both codes describe one limit, so a consumer branches on
            `error.code` and `param`, not on the status code.
        voice:
          type: string
          minLength: 1
          maxLength: 128
          description: Published voice ID. OpenAI hosted voice names are not implied.
        instructions:
          type: string
          maxLength: 4096
        response_format:
          $ref: "#/components/schemas/AudioFormat"
          default: mp3
        speed:
          type: number
          minimum: 0.25
          maximum: 4.0
          default: 1.0
        stream_format:
          type: string
          enum: [audio]
          default: audio
          description: P0 supports only complete audio. `sse` is rejected as unsupported.
        nexus:
          $ref: "#/components/schemas/SpeechNexusOptions"
    SpeechNexusOptions:
      type: object
      additionalProperties: false
      dependentRequired:
        profile_id: [profile_revision]
        profile_revision: [profile_id]
      properties:
        workspace_id:
          $ref: "#/components/schemas/Identifier"
        client_reference:
          type: string
          maxLength: 256
        profile_id:
          $ref: "#/components/schemas/Identifier"
        profile_revision:
          $ref: "#/components/schemas/Revision"
        voice_revision:
          $ref: "#/components/schemas/Revision"
        pronunciation_revision:
          $ref: "#/components/schemas/Revision"
        overrides:
          $ref: "#/components/schemas/SpeechOverrides"
        deadline_ms:
          type: integer
          minimum: 1
          maximum: 600000
        max_output_audio_ms:
          type: integer
          minimum: 100
          maximum: 3600000
          description: |
            Optional request ceiling in milliseconds, including all source audio.
            Omission retains the deployment limit. The request only tightens
            deployment and approved binding limits; it never increases them.
            Invalid values return 400 invalid_request before execution dispatch.
            Source samples are bounded by floor(limit * sample_rate_hz / 1000);
            encoded delivery must also fit its payload limit. Exceeding either
            bound fails the complete request; backend limit checks return
            503 speech_output_limit_exceeded and gateway refusals retain their
            existing failure responses. No partial audio, truncation, publication
            or automatic resynthesis is allowed.
            The effective ceiling is frozen in the original execution request
            and retained for original-identity recovery.
    TranscriptionNexusOptions:
      type: object
      additionalProperties: false
      dependentRequired:
        profile_id: [profile_revision]
        profile_revision: [profile_id]
      properties:
        workspace_id:
          $ref: "#/components/schemas/Identifier"
        client_reference:
          type: string
          maxLength: 256
        profile_id:
          $ref: "#/components/schemas/Identifier"
        profile_revision:
          $ref: "#/components/schemas/Revision"
        overrides:
          $ref: "#/components/schemas/TranscriptionOverrides"
        deadline_ms:
          type: integer
          minimum: 1
          maximum: 600000
    TranscriptionOverrides:
      type: object
      additionalProperties: false
      properties:
        asr:
          $ref: "#/components/schemas/AsrOverrides"
    SpeechOverrides:
      type: object
      additionalProperties: false
      properties:
        tts:
          $ref: "#/components/schemas/RestTtsOverrides"
    RestTtsOverrides:
      type: object
      additionalProperties: false
      description: |
        REST speech always returns one complete audio response. Chunked delivery
        is available only through realtime sessions and durable Jobs. Standard
        `speed`, `instructions`, and `nexus.pronunciation_revision` are the
        canonical REST fields and cannot be duplicated here.
      properties:
        language:
          type: string
          maxLength: 35
        text_commit_mode:
          $ref: "#/components/schemas/TextCommitMode"
        audio_delivery:
          const: complete
        seed:
          type: [integer, "null"]
          minimum: 0
          maximum: 2147483647
        planner:
          type: object
          additionalProperties: false
          properties:
            max_chars:
              type: integer
              minimum: 40
              maximum: 400
            max_wait_ms:
              type: integer
              minimum: 100
              maximum: 3000
    TtsOverrides:
      $ref: "shared/speech-overrides.schema.json#/$defs/TtsOverrides"
    CapabilitySnapshot:
      type: object
      additionalProperties: false
      required:
        - snapshot_id
        - catalog_revision
        - policy_revision
        - generated_at
        - workspace_id
        - models
        - profiles
        - voices
        - limits
      properties:
        snapshot_id:
          $ref: "#/components/schemas/Identifier"
        catalog_revision:
          $ref: "#/components/schemas/Revision"
        policy_revision:
          $ref: "#/components/schemas/Revision"
        generated_at:
          type: string
          format: date-time
        workspace_id:
          $ref: "#/components/schemas/Identifier"
        models:
          type: array
          items:
            $ref: "#/components/schemas/CapabilityModel"
        profiles:
          type: array
          items:
            $ref: "#/components/schemas/ProfileSummary"
        voices:
          type: array
          items:
            $ref: "#/components/schemas/VoiceSummary"
        limits:
          $ref: "#/components/schemas/CapabilityLimits"
        auxiliary:
          type: array
          items:
            $ref: "#/components/schemas/AuxiliaryCapability"
    CapabilityModel:
      type: object
      additionalProperties: false
      required: [logical_model, binding, tasks, release_tier, parameter_domains, readiness]
      properties:
        logical_model:
          type: string
        binding:
          $ref: "#/components/schemas/ResourceReference"
        tasks:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/SpeechTaskKind"
        release_tier:
          $ref: "#/components/schemas/ReleaseTier"
        parameter_domains:
          $ref: "./model-binding.schema.json#/$defs/ParameterDomains"
        readiness:
          $ref: "#/components/schemas/ModelReadiness"
    CapabilityLimits:
      type: object
      additionalProperties: false
      required:
        - max_audio_bytes
        - max_text_codepoints
        - max_segment_ms
        - max_realtime_session_ms
        - max_queue_wait_ms
      properties:
        max_audio_bytes:
          type: integer
          minimum: 1
        max_text_codepoints:
          type: integer
          minimum: 1
        max_segment_ms:
          type: integer
          minimum: 1000
          maximum: 30000
        max_realtime_session_ms:
          type: integer
          minimum: 60000
        max_queue_wait_ms:
          type: integer
          minimum: 0
    AuxiliaryCapability:
      type: object
      additionalProperties: false
      required: [name, status, supported_modes]
      properties:
        name:
          type: string
          enum: [alignment, diarization]
        status:
          type: string
          enum: [available, unavailable, experimental]
        supported_modes:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/AuxiliaryMode"
        max_speakers:
          type: [integer, "null"]
          minimum: 1
          maximum: 64
    ProfileList:
      type: object
      additionalProperties: false
      required: [object, data, has_more, next_cursor]
      properties:
        object:
          const: nexus.list
        data:
          type: array
          items:
            $ref: "#/components/schemas/ProfileSummary"
        has_more:
          type: boolean
        next_cursor:
          type: [string, "null"]
    ProfileSummary:
      type: object
      additionalProperties: false
      required: [id, revision, display_name, kind, release_tier, execution_classes]
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        revision:
          $ref: "#/components/schemas/Revision"
        display_name:
          type: string
        kind:
          type: string
          enum: [asr, tts, duplex]
        release_tier:
          $ref: "#/components/schemas/ProfileReleaseTier"
        execution_classes:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ServiceClass"
    PublishedProfileList:
      type: object
      additionalProperties: false
      required: [object, data, has_more, next_cursor]
      properties:
        object:
          const: nexus.list
        data:
          type: array
          items:
            $ref: "#/components/schemas/PublishedProfileSummary"
        has_more:
          type: boolean
        next_cursor:
          type: [string, "null"]
    PublishedProfileSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - revision
        - current_revision
        - display_name
        - kind
        - release_tier
        - execution_classes
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        revision:
          $ref: "#/components/schemas/Revision"
        current_revision:
          description: Active published family revision; null when no default is active.
          oneOf:
            - $ref: "#/components/schemas/Revision"
            - type: "null"
        display_name:
          type: string
        kind:
          type: string
          enum: [asr, tts, duplex]
        release_tier:
          $ref: "#/components/schemas/ProfileReleaseTier"
        execution_classes:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ServiceClass"
    VoiceList:
      type: object
      additionalProperties: false
      required: [object, data, has_more, next_cursor]
      properties:
        object:
          const: nexus.list
        data:
          type: array
          items:
            $ref: "#/components/schemas/VoiceSummary"
        has_more:
          type: boolean
        next_cursor:
          type: [string, "null"]
    VoiceSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - revision
        - display_name
        - source_type
        - status
        - languages
        - audio_formats
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        revision:
          $ref: "#/components/schemas/Revision"
        display_name:
          type: string
        source_type:
          type: string
          enum: [designed, cloned, builtin]
        status:
          type: string
          enum: [published, retired, disabled]
        languages:
          type: array
          uniqueItems: true
          items:
            type: string
            maxLength: 35
        audio_formats:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/AudioFormat"
    PronunciationList:
      type: object
      additionalProperties: false
      required: [object, data, has_more, next_cursor]
      properties:
        object:
          const: nexus.list
        data:
          type: array
          items:
            $ref: "#/components/schemas/PronunciationSummary"
        has_more:
          type: boolean
        next_cursor:
          type: [string, "null"]
    PronunciationSummary:
      type: object
      additionalProperties: false
      required: [id, head_revision, encoding, entry_count, status]
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        head_revision:
          $ref: "#/components/schemas/Revision"
        encoding:
          type: string
          enum: [pinyin, ipa]
        entry_count:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [draft, published, retired]
    PronunciationCreateRequest:
      type: object
      additionalProperties: false
      dependentRequired:
        id: [expected_revision]
        expected_revision: [id]
      required: [encoding, entries]
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        expected_revision:
          $ref: "#/components/schemas/Revision"
        encoding:
          type: string
          enum: [pinyin, ipa]
        entries:
          type: array
          minItems: 1
          maxItems: 10000
          items:
            $ref: "./voice-resource.schema.json#/$defs/PronunciationEntry"
        publish:
          type: boolean
          default: true
          description: >-
            Atomic publication. `true` (the default) writes the immutable revision,
            its publication ledger row and the selected head in one transaction;
            `false` writes only an immutable draft revision. A deployment without
            the publication identity answers 422
            `pronunciation_publication_not_supported` instead of writing. This
            field never selects a default, executes TTS or qualifies
            pronunciation.
    JobKind:
      type: string
      enum: [asr, tts, voice_design, voice_clone, voice_preview, voice_validation]
    JobStatus:
      type: string
      enum:
        - queued
        - running
        - retry_wait
        - cancelling
        - succeeded
        - failed
        - cancelled
        - expired
    CleanupState:
      $ref: "shared/operation-states.schema.json#/$defs/CleanupState"
    JobCreateBase:
      type: object
      properties:
        kind:
          $ref: "#/components/schemas/JobKind"
        workspace_id:
          $ref: "#/components/schemas/Identifier"
          description: |
            Target workspace. `default: workspace-default`: omitting the field
            selects the seeded shared workspace, and the response echoes the
            resolved `workspace_id`. The workspace must exist and have a
            provisioned quota row; otherwise the create is refused with 422
            `workspace_not_found`, `workspace_disabled` or
            `workspace_not_configured` respectively, and no Job row is written.
        client_reference:
          type: string
          maxLength: 256
        model:
          type: string
          minLength: 1
          maxLength: 128
        profile:
          $ref: "#/components/schemas/ResourceReference"
        overrides:
          $ref: "#/components/schemas/JobOverrides"
        constraints:
          $ref: "#/components/schemas/JobConstraints"
        draft_target:
          $ref: "#/components/schemas/DraftTarget"
    JobCreateRequest:
      oneOf:
        - $ref: "#/components/schemas/AsrJobCreate"
        - $ref: "#/components/schemas/TtsJobCreate"
        - $ref: "#/components/schemas/VoiceDesignJobCreate"
        - $ref: "#/components/schemas/VoiceCloneJobCreate"
        - $ref: "#/components/schemas/VoicePreviewJobCreate"
        - $ref: "#/components/schemas/VoiceValidationJobCreate"
      discriminator:
        propertyName: kind
        mapping:
          asr: "#/components/schemas/AsrJobCreate"
          tts: "#/components/schemas/TtsJobCreate"
          voice_design: "#/components/schemas/VoiceDesignJobCreate"
          voice_clone: "#/components/schemas/VoiceCloneJobCreate"
          voice_preview: "#/components/schemas/VoicePreviewJobCreate"
          voice_validation: "#/components/schemas/VoiceValidationJobCreate"
      unevaluatedProperties: false
    JobOverrides:
      type: object
      additionalProperties: false
      properties:
        asr:
          $ref: "#/components/schemas/AsrOverrides"
        tts:
          $ref: "#/components/schemas/TtsOverrides"
    JobConstraints:
      type: object
      additionalProperties: false
      properties:
        max_queue_wait_ms:
          type: integer
          minimum: 0
          maximum: 86400000
        allow_degradation:
          type: boolean
          default: false
        require_exact_parameters:
          type: boolean
          default: false
    DraftTarget:
      type: object
      additionalProperties: false
      required: [id, expected_revision]
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        expected_revision:
          $ref: "#/components/schemas/Revision"
    AsrOverrides:
      $ref: "shared/speech-overrides.schema.json#/$defs/AsrOverrides"
    AsrJobCreate:
      allOf:
        - $ref: "#/components/schemas/JobCreateBase"
        - type: object
          properties:
            kind:
              const: asr
            input:
              $ref: "#/components/schemas/AsrJobInput"
            output:
              $ref: "#/components/schemas/AsrJobOutput"
          required: [kind, model, input]
    AsrJobInput:
      type: object
      additionalProperties: false
      required: [audio_asset_id]
      properties:
        audio_asset_id:
          $ref: "#/components/schemas/Identifier"
    AsrJobOutput:
      type: object
      additionalProperties: false
      properties:
        transcript_format:
          $ref: "#/components/schemas/TranscriptFormat"
          default: json
        save_artifacts:
          type: boolean
          const: true
          default: true
    TtsJobCreate:
      allOf:
        - $ref: "#/components/schemas/JobCreateBase"
        - type: object
          properties:
            kind:
              const: tts
            model_binding:
              $ref: "#/components/schemas/ResourceReference"
              description: |
                Optional exact binding for file TTS; revision stays a decimal
                string. `model` must match its logical_model. No default or
                fallback to another binding/version. Older strict servers
                reject this field; deploy the supporting server before clients.
            input:
              $ref: "#/components/schemas/TtsJobInput"
            voice:
              $ref: "#/components/schemas/ResourceReference"
            pronunciation:
              $ref: "#/components/schemas/ResourceReference"
            output:
              $ref: "#/components/schemas/TtsJobOutput"
          required: [kind, model, input, voice]
    TtsJobInput:
      oneOf:
        - type: object
          additionalProperties: false
          required: [text]
          properties:
            text:
              type: string
              minLength: 1
              maxLength: 4096
              description: |
                Inline text for one Job. A Job performs exactly one speech
                synthesis, so the body bound is the same `MAX_SPEECH_TEXT_CHARS`
                (4096) that `input` on `/v1/audio/speech` declares; longer text is
                rejected instead of being split, truncated, or silently shortened.
                This asynchronous entry reports an over-bound body as `422`
                `unsupported_parameter`, while `/v1/audio/speech` reports the same
                condition as `400` `invalid_request` with `param: input`. The two
                codes describe one limit and differ by entry point, so a consumer
                branches on `error.code` and `param`, not on the status code.
        - type: object
          additionalProperties: false
          required: [text_asset_id]
          properties:
            text_asset_id:
              $ref: "#/components/schemas/Identifier"
    TtsJobOutput:
      type: object
      additionalProperties: false
      properties:
        audio_format:
          $ref: "#/components/schemas/AudioFormat"
          default: mp3
        save_artifacts:
          type: boolean
          const: true
          default: true
    VoiceDesignJobCreate:
      allOf:
        - $ref: "#/components/schemas/JobCreateBase"
        - type: object
          properties:
            kind:
              const: voice_design
            input:
              $ref: "#/components/schemas/VoiceDesignJobInput"
          required: [kind, model, input]
    VoiceDesignJobInput:
      $ref: "#/components/schemas/VoiceDesignInput"
    VoiceCloneJobCreate:
      allOf:
        - $ref: "#/components/schemas/JobCreateBase"
        - type: object
          properties:
            kind:
              const: voice_clone
            input:
              $ref: "#/components/schemas/VoiceCloneJobInput"
          required: [kind, model, input]
    VoiceCloneJobInput:
      $ref: "#/components/schemas/VoiceCloneInput"
    VoicePreviewJobCreate:
      allOf:
        - $ref: "#/components/schemas/JobCreateBase"
        - type: object
          properties:
            kind:
              const: voice_preview
            input:
              $ref: "#/components/schemas/VoicePreviewJobInput"
          required: [kind, input]
    VoicePreviewJobInput:
      type: object
      additionalProperties: false
      required: [voice_draft_id, draft_revision, text]
      properties:
        voice_draft_id:
          $ref: "#/components/schemas/Identifier"
        draft_revision:
          $ref: "#/components/schemas/Revision"
        text:
          type: string
          minLength: 1
          maxLength: 2000
    VoiceValidationJobCreate:
      allOf:
        - $ref: "#/components/schemas/JobCreateBase"
        - type: object
          properties:
            kind:
              const: voice_validation
            input:
              $ref: "#/components/schemas/VoiceValidationJobInput"
          required: [kind, input]
    VoiceValidationJobInput:
      type: object
      additionalProperties: false
      required: [voice_draft_id, draft_revision, validation_set_revision]
      properties:
        voice_draft_id:
          $ref: "#/components/schemas/Identifier"
        draft_revision:
          $ref: "#/components/schemas/Revision"
        validation_set_revision:
          $ref: "#/components/schemas/Revision"
    Job:
      type: object
      additionalProperties: false
      required:
        - id
        - object
        - kind
        - status
        - cleanup_state
        - request_id
        - workspace_id
        - execution_revision
        - progress
        - artifacts
        - result
        - operations
        - effective_configuration
        - created_at
        - updated_at
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        object:
          const: nexus.job
        kind:
          $ref: "#/components/schemas/JobKind"
        status:
          $ref: "#/components/schemas/JobStatus"
        cleanup_state:
          $ref: "#/components/schemas/CleanupState"
        request_id:
          type: string
          minLength: 1
          maxLength: 128
        workspace_id:
          $ref: "#/components/schemas/Identifier"
        client_reference:
          type: [string, "null"]
          maxLength: 256
        profile:
          oneOf:
            - $ref: "#/components/schemas/ResourceReference"
            - type: "null"
        execution_revision:
          $ref: "#/components/schemas/Revision"
        progress:
          $ref: "#/components/schemas/JobProgress"
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/JobArtifact"
        result:
          oneOf:
            - $ref: "#/components/schemas/JobResult"
            - type: "null"
        operations:
          type: array
          items:
            $ref: "#/components/schemas/OperationReference"
        effective_configuration:
          $ref: "#/components/schemas/EffectiveConfiguration"
        error:
          oneOf:
            - $ref: "#/components/schemas/JobError"
            - type: "null"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      allOf:
        - if:
            properties:
              status:
                const: failed
            required: [status]
          then:
            required: [error]
            properties:
              error:
                not:
                  type: "null"
        - if:
            properties:
              status:
                enum: [succeeded, cancelled]
            required: [status]
          then:
            properties:
              error:
                type: "null"
        - if:
            properties:
              status:
                const: succeeded
            required: [status]
          then:
            required: [result]
            properties:
              result:
                not:
                  type: "null"
              artifacts:
                minItems: 1
              cleanup_state:
                enum: [not_required, complete]
        - if:
            properties:
              status:
                not:
                  const: succeeded
            required: [status]
          then:
            properties:
              result:
                type: "null"
        - if:
            allOf:
              - properties:
                  status:
                    const: succeeded
                required: [status]
              - properties:
                  kind:
                    const: asr
                required: [kind]
          then:
            properties:
              artifacts:
                contains:
                  type: object
                  properties:
                    kind:
                      const: transcript
                  required: [kind]
              result:
                properties:
                  kind:
                    const: asr
        - if:
            allOf:
              - properties:
                  status:
                    const: succeeded
                required: [status]
              - properties:
                  kind:
                    const: tts
                required: [kind]
          then:
            properties:
              artifacts:
                contains:
                  type: object
                  properties:
                    kind:
                      const: audio
                  required: [kind]
              result:
                properties:
                  kind:
                    const: tts
        - if:
            allOf:
              - properties:
                  status:
                    const: succeeded
                required: [status]
              - properties:
                  kind:
                    const: voice_design
                required: [kind]
          then:
            properties:
              artifacts:
                contains:
                  type: object
                  properties:
                    kind:
                      const: preview
                  required: [kind]
              result:
                properties:
                  kind:
                    const: voice_design
        - if:
            allOf:
              - properties:
                  status:
                    const: succeeded
                required: [status]
              - properties:
                  kind:
                    const: voice_clone
                required: [kind]
          then:
            properties:
              artifacts:
                contains:
                  type: object
                  properties:
                    kind:
                      const: preview
                  required: [kind]
              result:
                properties:
                  kind:
                    const: voice_clone
        - if:
            allOf:
              - properties:
                  status:
                    const: succeeded
                required: [status]
              - properties:
                  kind:
                    const: voice_preview
                required: [kind]
          then:
            properties:
              artifacts:
                contains:
                  type: object
                  properties:
                    kind:
                      const: preview
                  required: [kind]
              result:
                properties:
                  kind:
                    const: voice_preview
        - if:
            allOf:
              - properties:
                  status:
                    const: succeeded
                required: [status]
              - properties:
                  kind:
                    const: voice_validation
                required: [kind]
          then:
            properties:
              artifacts:
                contains:
                  type: object
                  properties:
                    kind:
                      const: validation_report
                  required: [kind]
              result:
                properties:
                  kind:
                    const: voice_validation
        - if:
            properties:
              status:
                const: cancelled
            required: [status]
          then:
            properties:
              cleanup_state:
                enum: [not_required, complete]
        - if:
            properties:
              status:
                const: expired
            required: [status]
          then:
            properties:
              cleanup_state:
                const: not_required
    JobProgress:
      type: object
      additionalProperties: false
      required: [unit, completed]
      properties:
        unit:
          type: string
          enum: [audio_ms, text_codepoints, items]
        completed:
          type: integer
          minimum: 0
        total:
          type: [integer, "null"]
          minimum: 0
    JobArtifact:
      type: object
      additionalProperties: false
      required: [artifact_id, kind, media_type, bytes, sha256]
      properties:
        artifact_id:
          $ref: "#/components/schemas/Identifier"
        kind:
          $ref: "#/components/schemas/ArtifactKind"
        media_type:
          type: string
          minLength: 1
          maxLength: 128
        bytes:
          type: integer
          minimum: 1
        sha256:
          $ref: "#/components/schemas/Sha256Digest"
        receipt_id:
          oneOf:
            - $ref: "#/components/schemas/Identifier"
            - type: "null"
          description: For an artifact referenced by a succeeded Job result, this must be present and equal the result receipt_id.
        expires_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
    JobResult:
      description: |
        Structured successful outcome of a durable Job. `kind` must equal the
        owning Job kind. Artifact identifiers in the result must identify the
        corresponding entries in `Job.artifacts` with the matching kind and
        result receipt; the service validates that cross-array identity before
        committing `succeeded`.
      oneOf:
        - $ref: "#/components/schemas/AsrJobResult"
        - $ref: "#/components/schemas/TtsJobResult"
        - $ref: "#/components/schemas/VoiceDraftJobResult"
        - $ref: "#/components/schemas/VoicePreviewJobResult"
        - $ref: "#/components/schemas/VoiceValidationJobResult"
      discriminator:
        propertyName: kind
        mapping:
          asr: "#/components/schemas/AsrJobResult"
          tts: "#/components/schemas/TtsJobResult"
          voice_design: "#/components/schemas/VoiceDraftJobResult"
          voice_clone: "#/components/schemas/VoiceDraftJobResult"
          voice_preview: "#/components/schemas/VoicePreviewJobResult"
          voice_validation: "#/components/schemas/VoiceValidationJobResult"
    AsrJobResult:
      type: object
      additionalProperties: false
      required: [kind, transcript_artifact_id, receipt_id]
      properties:
        kind:
          const: asr
        transcript_artifact_id:
          $ref: "#/components/schemas/Identifier"
        receipt_id:
          $ref: "#/components/schemas/Identifier"
    TtsJobResult:
      type: object
      additionalProperties: false
      required: [kind, audio_artifact_id, receipt_id]
      properties:
        kind:
          const: tts
        audio_artifact_id:
          $ref: "#/components/schemas/Identifier"
        receipt_id:
          $ref: "#/components/schemas/Identifier"
    VoiceDraftJobResult:
      type: object
      additionalProperties: false
      required: [kind, voice_draft_id, draft_revision, preview_artifact_ids, receipt_id]
      properties:
        kind:
          type: string
          enum: [voice_design, voice_clone]
        voice_draft_id:
          $ref: "#/components/schemas/Identifier"
        draft_revision:
          $ref: "#/components/schemas/Revision"
        preview_artifact_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Identifier"
        receipt_id:
          $ref: "#/components/schemas/Identifier"
    VoicePreviewJobResult:
      type: object
      additionalProperties: false
      required: [kind, voice_draft_id, draft_revision, preview_artifact_id, receipt_id]
      properties:
        kind:
          const: voice_preview
        voice_draft_id:
          $ref: "#/components/schemas/Identifier"
        draft_revision:
          $ref: "#/components/schemas/Revision"
