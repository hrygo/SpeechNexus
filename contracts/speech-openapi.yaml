  /v1/realtime:
    get:
      tags: [realtime]
      operationId: connectRealtime
      summary: Upgrade to the realtime WebSocket
      description: |
        WebSocket upgrade endpoint. Supply exactly one of `session_id` or
        `model`.

        * `session_id` connects to a pre-created nexus session and enables the
          declared standard ASR subset plus nexus.* TTS, metadata, and operation
          events.
        * `model` opens an OpenAI-compatible transcription-only session using
          deployment defaults. This mode is for standard Realtime SDKs and does
          not enable TTS, response.*, tool calls, or conversation history.

        The server validates Origin/Host for browser connections. A shared
        service key, when enabled, is supplied through the Authorization header
        and never in the URL. session_id is a routing identifier, not a
        credential.
      parameters:
        - name: session_id
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Identifier"
        - name: model
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: OpenAI-Beta
          in: header
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "101":
          description: |
            WebSocket protocol switch. JSON events conform to
            realtime-events.schema.json. Binary audio is not used on the public
            WebSocket in P0; ASR audio is base64 inside
            input_audio_buffer.append and TTS audio is base64 inside
            nexus.tts.audio.delta.
          x-websocket-event-schema:
            $ref: "./realtime-events.schema.json"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/nexus/voice-designs:
    post:
      tags: [voice-creation]
      operationId: createVoiceDesign
      summary: Create a voice-design draft and generation job
      parameters:
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoiceDesignCreateRequest"
      responses:
        "202":
          description: Draft and generation job accepted.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceCreationAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/VoiceDraftCreationConflict"
        "422":
          $ref: "#/components/responses/VoiceDraftSubmitUnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/VoiceDraftContractViolation"
        "503":
          description: |
            `voice_draft_unavailable`: storage failed before any definite
            commit, so retrying the same request is safe. The operation is
            implemented; this is an outage, not a permanently unimplemented operation.

            `voice_draft_outcome_unknown`: the submission may have committed
            but its acknowledgement was lost. This code is returned only for a
            request that carried its original Idempotency-Key; retry with that
            exact key so the committed draft is replayed instead of creating a
            second draft and generation Job. Do not retry with a new key.

            `voice_draft_admission_contended`: admission state had not settled
            when the attempt ran (a concurrent version compare-and-set, or an
            instance gateway still draining an earlier generation). Repeating the
            same request is the recovery, so `retryable` is true.

            `voice_draft_engine_unavailable`: the engine pinned by this request
            cannot admit it, and the recovery is an operator step. The message
            names which one: an expired readiness receipt (re-register the engine, renewing the
            readiness receipt), a runtime state that no longer
            matches, an instance/pool/template/recipe approval that is not active,
            or a request whose own admission deadline elapsed. `retryable` is false
            and `X-Should-Retry` is false because repeating the request before that
            step cannot succeed. It is a server-side condition: the published model
            and the ready input are fine, so this is not the 422 input class.
          headers:
            Cache-Control:
              required: true
