# Application-plane background units from the reference Compose assembly.
#
# binding-disable-worker is deliberately absent: its runtime refuses a plain-HTTP
# gateway origin that is not loopback, so it runs on the compute host beside the
# gateway (deploy/cluster/compute/compose.yaml), exactly as the reference does.
#
# Each one is a separate process with its own least-privilege identity, exactly as
# in `deploy/compose.yaml` (profiles binding-disable / artifact-retention /
# admission-watch / engine-readiness). They hold no engine credentials and no
# docker socket; only the binding-disable worker talks to the execution gateway,
# and it does so over the bridge Service.
#
# Readiness and liveness are TCP-free here: these workers expose no port, so the
# only honest probe is the process itself plus its log. A crash loop is visible in
# `kubectl get pods` because the container exits non-zero.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: artifact-retention
  namespace: speechnexus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: artifact-retention
  template:
    metadata:
      labels:
        app: artifact-retention
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        # The staged Secret is root-owned 0440; only the fsGroup can read it.
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: artifact-retention
          image: ${PYTHON_IMAGE}
          imagePullPolicy: IfNotPresent
          command: ["speechnexus-artifact-retention"]
          envFrom:
            - secretRef:
                name: artifact-retention-env
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: "1"
              memory: 384Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admission-watch
  namespace: speechnexus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: admission-watch
  template:
    metadata:
      labels:
        app: admission-watch
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        # The staged Secret is root-owned 0440; only the fsGroup can read it.
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: admission-watch
          image: ${PYTHON_IMAGE}
          imagePullPolicy: IfNotPresent
          command: ["speechnexus-admission-watch"]
          envFrom:
            - secretRef:
                name: admission-watch-env
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
---
# #1248: a Job that reached a terminal state before any dispatcher claimed it kept
# its admission lease `reserved` -- an accepted cancellation of a still-pending
# Job, or an approval that expired before dispatch -- and the four projections
# stayed held, so the next Job of that instance class was refused with
# `capacity_exhausted`. The dispatcher's own return path needs a claim, so nothing
# ever reached those rows. This sweep does, in bounded passes, through the one
# release implementation the dispatcher and the operator exit use.
#
# Forbid: two passes racing for the same rows would settle them one after the
# other anyway (the release is idempotent), but a serialized schedule keeps the
# log readable. A refusal exits non-zero -- the failed Job is the alarm.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: lease-reconciler
  namespace: speechnexus
spec:
  # Five minutes: while a slot is leaked, every new Job of that class is refused,
  # and one pass settles up to --limit of them.
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            # The staged Secret is root-owned 0440; only the fsGroup can read it.
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: lease-reconciler
              image: ${PYTHON_IMAGE}
              imagePullPolicy: IfNotPresent
              command:
                - speechnexus-lease-reconciler
                # Small on purpose: one pass is a short transaction set, and a
                # backlog is drained over several scheduled runs.
                - --limit
                - "8"
              envFrom:
                - secretRef:
                    name: lease-reconciler-env
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: 16Mi
---
# The readiness lease is the only thing keeping the instance admissible, and it
# lasts 24 h: a one-shot report and renewal is a receipt that silently runs out.
# Both run on a schedule instead, and the report exits non-zero while a receipt
# is still expiring -- that failed Job is the alarm, because nothing else in the
# product surfaces a lapsed receipt before admission stops (#1253).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: engine-readiness
  namespace: speechnexus
spec:
  # Hourly: this report is the operator's view of the window, not the admission
  # rule. A stale receipt already refuses work on its own (`unobserved`), so this
  # job is no longer the only thing that can catch a broken renewal.
  schedule: "17 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          restartPolicy: Never
          # The engine has one address in this assembly and it is the host-loopback
          # shim (`127.0.0.1:18190`), exactly as #1253 found: a Pod on the cluster
          # network cannot reach it. The coordination DSN takes the same route, a
          # reverse tunnel on the host's `127.0.0.1:15440`. Joining the host network
          # is what makes both reachable; `ClusterFirstWithHostNet` keeps Service
          # DNS working, so moving the health URL to `engine-asr-1` needs no other
          # change. The controller makes the same trade for the same reason.
          hostNetwork: true
          dnsPolicy: ClusterFirstWithHostNet
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            # The staged Secret is root-owned 0440; only the fsGroup can read it.
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: engine-readiness
              image: ${PYTHON_IMAGE}
              imagePullPolicy: IfNotPresent
              command:
                - speechnexus-engine-readiness
                - --warn-within-seconds
                # Six hours: three hourly periods of headroom before the alarm.
                - "21600"
                - --fail-on-expiring
              envFrom:
                - secretRef:
                    name: readiness-env
              env:
                # #1282: the ledger and the controller count generations separately, and
                # they drifted to 1 and 11 for this instance while the pod serving
                # traffic was the eleventh. Both jobs ask the node which generation it
                # prepared and refuse to sign or report a receipt for a different one;
                # the controller is hostNetwork on this node, so the host's loopback is
                # the address. Without the pair the check would silently not run.
                - name: SPEECHNEXUS_CONTROLLER_API_URL
                  value: http://127.0.0.1:8022
                - name: SPEECHNEXUS_CONTROLLER_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: controller-component-token
                      key: token
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: 16Mi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: engine-readiness-renew
  namespace: speechnexus
spec:
  # Every five minutes against the 15 min freshness window admission enforces:
  # the receipt stopped being a self-signed 24 h pass and now says "a probe saw
  # this engine recently", so the probe interval has to be shorter than the
  # window, not shorter than the receipt's declared TTL (#1263). Three missed
  # runs in a row is what turns an instance into `unobserved` and refuses work.
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          restartPolicy: Never
          # Same reason as the report above: the probe target and the coordination
          # DSN are both on the host's loopback (engine shim and reverse tunnel).
          hostNetwork: true
          dnsPolicy: ClusterFirstWithHostNet
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            # The staged Secret is root-owned 0440; only the fsGroup can read it.
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: engine-readiness-renew
              image: ${PYTHON_IMAGE}
              imagePullPolicy: IfNotPresent
              command:
                - speechnexus-register-engine
                # No --generation: the ledger's current generation is the authority on
                # what is serving. Restating it here is a constant that goes stale the
                # moment the controller prepares a new generation, and the renewal then
                # re-signs a receipt nobody serves or refuses every run (#1253).
                - --node
                - node-megacube-1
                - --gateway
                - gateway-megacube-1
                - --instance
                - instance-asr-1
                - --workspace
                - workspace-default
                - --max-attempts
                - "8"
                - --renew-readiness
              envFrom:
                - secretRef:
                    name: readiness-env
              env:
                # #1282: the ledger and the controller count generations separately, and
                # they drifted to 1 and 11 for this instance while the pod serving
                # traffic was the eleventh. Both jobs ask the node which generation it
                # prepared and refuse to sign or report a receipt for a different one;
                # the controller is hostNetwork on this node, so the host's loopback is
                # the address. Without the pair the check would silently not run.
                - name: SPEECHNEXUS_CONTROLLER_API_URL
                  value: http://127.0.0.1:8022
                - name: SPEECHNEXUS_CONTROLLER_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: controller-component-token
                      key: token
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: private-recipes
                  mountPath: /run/speechnexus-private
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          # Same staging as the API: the recipe loader opens with O_NOFOLLOW and demands
          # an owner-only file, which a Secret volume cannot provide (symlink into
          # ..data, then root ownership).
          initContainers:
            - name: stage-recipes
              image: ${PYTHON_IMAGE}
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - install -m 0400 /src/transcription-recipe.json /run/speechnexus-private/
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: private
                  mountPath: /src
                  readOnly: true
                - name: private-recipes
                  mountPath: /run/speechnexus-private
          volumes:
            - name: private
              secret:
                secretName: private-config
                defaultMode: 0440
            - name: private-recipes
              emptyDir:
                medium: Memory
                sizeLimit: 4Mi
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: 16Mi
---
# The job dispatcher lives next to the database it claims from, not on the
# compute plane. Claiming across the bridge serialises every round on the
# tunnel: a measured 115 s per round there against 0.15 s here, while the
# binding's admission deadline is 120 s, so Jobs expired before they were ever
# dispatched (issues #1234 and #1250). One replica only: the worker holds a
# bucket lease and a second holder would split the same due Jobs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: job-dispatch
  namespace: speechnexus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: job-dispatch
  template:
    metadata:
      labels:
        app: job-dispatch
    spec:
      # Same reason as the API: the gateway answers on the compute host's loopback
      # only, so the dispatcher joins the host network to reach it. It opens no
      # port of its own, so joining costs nothing else.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: job-dispatch
          image: ${PYTHON_IMAGE}
          imagePullPolicy: IfNotPresent
          command: ["speechnexus-job-dispatch-worker"]
          envFrom:
            - secretRef:
                name: dispatch-env
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
