[project]
name = "speechnexus-node-controller"
version = "0.1.0.dev0"
description = "Restricted node-scoped controller for approved runtime instance lifecycles"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.159.1,<0.163",
  "httpx>=0.28.1,<0.29",
  "pydantic>=2.14.1,<3",
  "pydantic-settings>=2.16.1,<3",
  "uvicorn[standard]>=0.54,<0.55",
]

[project.scripts]
speechnexus-node-controller = "speechnexus_node_controller.main:main"

[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speechnexus_node_controller"]
