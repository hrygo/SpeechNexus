apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: speechnexus
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: speechnexus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      terminationGracePeriodSeconds: 30
      # The gateway binds the compute host's loopback and nothing broader, so the
      # only way to present the component credential to it from inside the cluster
      # is to join the host network -- the same trade the readiness units make for
      # the engine shim. `ClusterFirstWithHostNet` keeps Service DNS working, so
      # `postgres`, `minio` and `asset-inspector` still resolve by name. This is why
      # `render-config.py --topology in-cluster` renders `http://127.0.0.1:8010` as
      # the gateway origin; the two must agree, and the test asserts it.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        fsGroup: 10001
      # The recipe loader opens with O_NOFOLLOW and requires the file's owner to be
      # the process uid, with no group/other bits. A Secret volume satisfies
      # neither (symlink into ..data, then 0440 root:fsGroup), so the recipes are
      # copied into an in-memory volume with the mode the loader accepts.
      initContainers:
        - name: stage-recipes
          image: ${PYTHON_IMAGE}
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - install -m 0400 /src/transcription-recipe.json /run/speechnexus-private/ &&
              install -m 0400 /src/speech-recipe.json /run/speechnexus-private/
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: private-config
              mountPath: /src
              readOnly: true
            - name: private-recipes
              mountPath: /run/speechnexus-private
      containers:
        - name: api
          image: ${PYTHON_IMAGE}
          command: ["speechnexus-api"]
          envFrom:
            - secretRef:
                name: api-env
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1536Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: private-recipes
              mountPath: /run/speechnexus-private
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: private-config
          secret:
            secretName: private-config
            defaultMode: 0440
        - name: private-recipes
          emptyDir:
            medium: Memory
            sizeLimit: 4Mi
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
