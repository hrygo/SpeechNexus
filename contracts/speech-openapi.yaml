              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /v1/nexus/voice-drafts/{draft_id}/publications:
    post:
      tags: [voice-creation]
      operationId: publishVoiceDraftRevision
      summary: Publish a validated draft revision as an immutable voice revision
      description: |
        The first publication creates voice_id; later publications append an
        immutable revision to the same voice_id. A stale head, stale validation,
        or expired qualification returns 409/422. Replaying the same intent
        returns the original publication.
      parameters:
        - $ref: "#/components/parameters/DraftIdPath"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoicePublicationRequest"
      responses:
        "201":
          description: Voice revision published.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "./voice-resource.schema.json#/$defs/VoicePublication"
        "200":
          description: Idempotent replay of the same publication.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "./voice-resource.schema.json#/$defs/VoicePublication"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
components:
  securitySchemes:
    SharedServiceKey:
      type: http
      scheme: bearer
      description: |
        Optional deployment-wide shared credential. It grants access to the
        shared deployment, not a user identity. When disabled, any Authorization
        header value is accepted for SDK compatibility and is not interpreted as
        a user.
  parameters:
    XRequestId:
      name: X-Request-ID
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 8
        maxLength: 128
      description: |
        Optional idempotency key. The scope is (deployment_id, workspace_id,
        operation_family, key). Standard OpenAI clients may omit it.
    WorkspaceIdQuery:
      name: workspace_id
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/Identifier"
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    ProfileIdPath:
      name: profile_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    RevisionPath:
      name: revision
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Revision"
    VoiceIdPath:
      name: voice_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    JobIdPath:
      name: job_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    OperationIdPath:
      name: operation_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    AssetIdPath:
      name: asset_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    ArtifactIdPath:
      name: artifact_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    SessionIdPath:
      name: session_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    DraftIdPath:
      name: draft_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    Range:
      name: Range
      in: header
      required: false
      schema:
        type: string
        pattern: "^bytes=[0-9]*-[0-9]*$"
  headers:
    XRequestId:
      description: Validated client request ID or a server-generated correlation ID.
      schema:
        type: string
    XOperationId:
      description: Operation identity for receipt and cancellation coordination.
      schema:
        $ref: "#/components/schemas/Identifier"
    XAudioFormat:
      description: Actual audio encoding of the response body.
      schema:
        type: string
        enum: [mp3, wav, pcm]
    XSampleRateHz:
      description: Actual output sample rate.
      schema:
        type: integer
        minimum: 8000
        maximum: 96000
    XChannels:
      description: Actual output channel count.
      schema:
        type: integer
        minimum: 1
        maximum: 2
    ETag:
      description: Opaque validator derived from deployment, workspace, catalog, and policy revisions.
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before retrying a capacity or cancellation coordination request.
      schema:
        type: integer
        minimum: 0
    AcceptRanges:
      schema:
        type: string
        const: bytes
    ContentLength:
      schema:
        type: integer
        minimum: 0
    ContentRange:
      schema:
        type: string
        pattern: "^bytes [0-9]+-[0-9]+/[0-9]+$"
  responses:
    BadRequest:
      description: Malformed request, invalid JSON, invalid audio, or unknown field.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Shared service credential required or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Origin/Host policy rejected the request or the feature is disabled.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found or not visible to the requested workspace.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Configuration changed, idempotency conflict, operation in progress, or cleanup pending.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Gone:
      description: Content or event history has expired and is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: Upload or request body exceeds the declared bound.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnprocessableEntity:
      description: Unsupported parameter, incompatible profile, or async_required.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: Quota or queue limit exceeded; follow Retry-After.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Backend or capacity unavailable; retry only when `retryable` is true.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    GatewayTimeout:
      description: Operation deadline exceeded; coordinate the original intent before retrying.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    Identifier:
      $ref: "shared/identifiers.schema.json#/$defs/Identifier"
    Revision:
      $ref: "shared/identifiers.schema.json#/$defs/Revision"
    EventSequence:
      $ref: "shared/identifiers.schema.json#/$defs/EventSequence"
    Sha256Digest:
      $ref: "shared/identifiers.schema.json#/$defs/Sha256Digest"
    ResourceReference:
      $ref: "shared/references.schema.json#/$defs/ResourceReference"
    ReleaseTier:
      $ref: "shared/capability-domains.schema.json#/$defs/ReleaseTier"
    ProfileReleaseTier:
      $ref: "shared/capability-domains.schema.json#/$defs/ProfileReleaseTier"
    ServiceClass:
      $ref: "shared/capability-domains.schema.json#/$defs/ServiceClass"
    ErrorResponse:
      $ref: "shared/errors.schema.json#/$defs/ErrorResponse"
    ErrorBody:
      $ref: "shared/errors.schema.json#/$defs/ErrorBody"
    ModelList:
      type: object
      additionalProperties: false
      required: [object, data]
      properties:
        object:
          const: list
        data:
          type: array
          items:
            $ref: "#/components/schemas/Model"
    Model:
      type: object
      additionalProperties: false
      required: [id, object, created, owned_by]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        object:
          const: model
        created:
          type: integer
          minimum: 0
        owned_by:
          type: string
          minLength: 1
          maxLength: 128
        nexus:
          $ref: "#/components/schemas/ModelNexus"
    ModelNexus:
      type: object
      additionalProperties: false
      required: [logical_model, binding, tasks, release_tier, readiness]
      properties:
        logical_model:
          type: string
          minLength: 1
          maxLength: 128
        binding:
          $ref: "#/components/schemas/ResourceReference"
        tasks:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/SpeechTaskKind"
        release_tier:
          $ref: "#/components/schemas/ReleaseTier"
        readiness:
          $ref: "#/components/schemas/ModelReadiness"
    SpeechTaskKind:
      $ref: "shared/capability-domains.schema.json#/$defs/SpeechTaskKind"
    ModelReadiness:
      type: object
      additionalProperties: false
      required: [configured, engine_ready, quality_qualified, admission_state]
      properties:
        configured:
          type: boolean
        engine_ready:
          type: boolean
        quality_qualified:
          type: boolean
        admission_state:
          type: string
          enum: [available, queueable, capacity_full, unavailable]
          description: |
            available means currently admissible; queueable means the binding can
            accept work that waits for capacity; capacity_full means a required
            reservation is currently unavailable; unavailable means the model
            cannot be admitted now. None of these fields implies quality.
    TranscriptionRequest:
      type: object
      additionalProperties: false
      required: [file, model]
      allOf:
        - if:
            required: ["timestamp_granularities[]"]
          then:
            required: [response_format]
            properties:
              response_format:
                const: verbose_json
      properties:
        file:
          type: string
          format: binary
          description: Bounded audio file. Remote URLs and server paths are rejected.
        model:
          type: string
          minLength: 1
          maxLength: 128
        language:
          type: string
          maxLength: 35
          description: |
            Omit for automatic language detection. This field keeps the OpenAI
            language value semantics; `auto` is not a standard sentinel.
        prompt:
          type: string
          maxLength: 4000
        response_format:
          type: string
          enum: [json, text, verbose_json, srt, vtt]
          default: json
        timestamp_granularities[]:
          type: array
          uniqueItems: true
          maxItems: 2
          items:
            type: string
            enum: [segment, word]
          description: Only valid with response_format=verbose_json.
        nexus:
          type: string
          maxLength: 8192
          contentMediaType: application/json
          contentSchema:
            $ref: "#/components/schemas/TranscriptionNexusOptions"
          description: |
            JSON-encoded SpeechNexus options. Standard OpenAI clients omit it.
            Accepted keys are workspace_id, client_reference, profile_id,
            profile_revision, overrides, and deadline_ms. `overrides` contains
            only ASR policy fields; voice and pronunciation belong to TTS or
            nexus Jobs, not this endpoint.
    Transcription:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
        languages:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [code]
            properties:
              code:
                type: string
                maxLength: 35
        logprobs:
          type: array
          items:
            $ref: "#/components/schemas/TranscriptionLogprob"
        usage:
          $ref: "#/components/schemas/TranscriptionUsage"
    TranscriptionLogprob:
      type: object
      additionalProperties: false
      properties:
        token:
          type: [string, "null"]
        bytes:
          type: [array, "null"]
          items:
            type: number
        logprob:
          type: [number, "null"]
      description: |
        OpenAI SDK-compatible token log-probability shape. SpeechNexus returns
        this only when a binding supplies genuine log-probability evidence.
    TranscriptionVerbose:
      type: object
      additionalProperties: false
      required: [duration, language, text]
      properties:
        duration:
          type: number
          minimum: 0
        language:
          type: string
          maxLength: 35
        text:
          type: string
        segments:
          type: array
          items:
            $ref: "#/components/schemas/TranscriptionSegment"
        words:
          type: array
          items:
            $ref: "#/components/schemas/TranscriptionWord"
        usage:
          $ref: "#/components/schemas/UsageDuration"
          description: |
            OpenAI verbose_json uses duration usage only. Token usage is declared
            only for the non-verbose Transcription response, matching the
            official SDK's response model.
    TranscriptionSegment:
      type: object
      additionalProperties: false
      required:
        - id
        - avg_logprob
        - compression_ratio
        - end
        - no_speech_prob
        - seek
        - start
        - temperature
        - text
        - tokens
      properties:
        id:
          type: integer
          minimum: 0
        avg_logprob:
          type: number
        compression_ratio:
          type: number
        end:
          type: number
          minimum: 0
        no_speech_prob:
          type: number
          minimum: 0
          maximum: 1
        seek:
          type: integer
          minimum: 0
        start:
          type: number
          minimum: 0
        temperature:
          type: number
        text:
          type: string
        tokens:
          type: array
          items:
            type: integer
            minimum: 0
    TranscriptionWord:
      type: object
      additionalProperties: false
      required: [word, start, end]
      properties:
        word:
          type: string
        start:
          type: number
          minimum: 0
        end:
          type: number
          minimum: 0
    TranscriptionUsage:
      oneOf:
        - $ref: "#/components/schemas/UsageDuration"
        - $ref: "#/components/schemas/UsageTokens"
    UsageDuration:
      $ref: "shared/public-audio.schema.json#/$defs/UsageDuration"
    UsageTokens:
      $ref: "shared/public-audio.schema.json#/$defs/UsageTokens"
    SpeechRequest:
      type: object
      additionalProperties: false
      required: [model, input, voice]
      properties:
        model:
          type: string
          minLength: 1
          maxLength: 128
        input:
          type: string
          minLength: 1
          maxLength: 4096
        voice:
          type: string
          minLength: 1
          maxLength: 128
          description: Published voice ID. OpenAI hosted voice names are not implied.
        instructions:
          type: string
          maxLength: 2000
        response_format:
          type: string
          enum: [mp3, wav, pcm]
          default: mp3
        speed:
          type: number
          minimum: 0.25
          maximum: 4.0
          default: 1.0
        stream_format:
          type: string
          enum: [audio]
          default: audio
          description: P0 supports only complete audio. `sse` is rejected as unsupported.
        nexus:
          $ref: "#/components/schemas/SpeechNexusOptions"
    SpeechNexusOptions:
      type: object
      additionalProperties: false
      dependentRequired:
        profile_id: [profile_revision]
        profile_revision: [profile_id]
      properties:
        workspace_id:
          $ref: "#/components/schemas/Identifier"
        client_reference:
          type: string
          maxLength: 256
        profile_id:
          $ref: "#/components/schemas/Identifier"
        profile_revision:
          $ref: "#/components/schemas/Revision"
        voice_revision:
          $ref: "#/components/schemas/Revision"
        pronunciation_revision:
          $ref: "#/components/schemas/Revision"
        overrides:
          $ref: "#/components/schemas/SpeechOverrides"
        deadline_ms:
          type: integer
          minimum: 1
          maximum: 600000
    TranscriptionNexusOptions:
      type: object
      additionalProperties: false
      dependentRequired:
        profile_id: [profile_revision]
        profile_revision: [profile_id]
      properties:
        workspace_id:
          $ref: "#/components/schemas/Identifier"
        client_reference:
          type: string
          maxLength: 256
        profile_id:
          $ref: "#/components/schemas/Identifier"
        profile_revision:
          $ref: "#/components/schemas/Revision"
        overrides:
          $ref: "#/components/schemas/TranscriptionOverrides"
        deadline_ms:
          type: integer
          minimum: 1
          maximum: 600000
    TranscriptionOverrides:
      type: object
      additionalProperties: false
      properties:
        asr:
          $ref: "#/components/schemas/AsrOverrides"
    SpeechOverrides:
      type: object
      additionalProperties: false
      properties:
        tts:
          $ref: "#/components/schemas/RestTtsOverrides"
    RestTtsOverrides:
      type: object
      additionalProperties: false
      description: |
        REST speech always returns one complete audio response. Chunked delivery
        is available only through realtime sessions and durable Jobs. Standard
        `speed`, `instructions`, and `nexus.pronunciation_revision` are the
        canonical REST fields and cannot be duplicated here.
      properties:
        language:
          type: string
          maxLength: 35
        text_commit_mode:
          type: string
          enum: [explicit, sentence]
        audio_delivery:
          const: complete
        seed:
          type: [integer, "null"]
          minimum: 0
          maximum: 2147483647
        planner:
          type: object
          additionalProperties: false
          properties:
            max_chars:
              type: integer
              minimum: 40
              maximum: 400
            max_wait_ms:
              type: integer
              minimum: 100
              maximum: 3000
    TtsOverrides:
      type: object
      additionalProperties: false
      properties:
        language:
          type: string
          maxLength: 35
        text_commit_mode:
          type: string
          enum: [explicit, sentence]
        audio_delivery:
          type: string
          enum: [complete, chunked]
        speed:
          type: number
          minimum: 0.25
          maximum: 4.0
        instructions:
          type: [string, "null"]
          maxLength: 2000
        pronunciation_revision:
          oneOf:
            - $ref: "#/components/schemas/Revision"
            - type: "null"
        seed:
          type: [integer, "null"]
          minimum: 0
          maximum: 2147483647
        planner:
          type: object
          additionalProperties: false
          properties:
            max_chars:
              type: integer
              minimum: 40
              maximum: 400
            max_wait_ms:
              type: integer
              minimum: 100
              maximum: 3000
    CapabilitySnapshot:
      type: object
      additionalProperties: false
      required:
        - snapshot_id
        - catalog_revision
        - policy_revision
        - generated_at
        - workspace_id
        - models
        - profiles
        - voices
        - limits
      properties:
        snapshot_id:
          $ref: "#/components/schemas/Identifier"
        catalog_revision:
          $ref: "#/components/schemas/Revision"
        policy_revision:
          $ref: "#/components/schemas/Revision"
        generated_at:
          type: string
          format: date-time
        workspace_id:
          $ref: "#/components/schemas/Identifier"
        models:
          type: array
          items:
            $ref: "#/components/schemas/CapabilityModel"
        profiles:
          type: array
          items:
            $ref: "#/components/schemas/ProfileSummary"
        voices:
          type: array
          items:
            $ref: "#/components/schemas/VoiceSummary"
        limits:
          $ref: "#/components/schemas/CapabilityLimits"
        auxiliary:
          type: array
          items:
            $ref: "#/components/schemas/AuxiliaryCapability"
    CapabilityModel:
      type: object
      additionalProperties: false
      required: [logical_model, binding, tasks, release_tier, parameter_domains, readiness]
      properties:
        logical_model:
          type: string
        binding:
          $ref: "#/components/schemas/ResourceReference"
        tasks:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/SpeechTaskKind"
        release_tier:
          $ref: "#/components/schemas/ReleaseTier"
        parameter_domains:
          $ref: "./model-binding.schema.json#/$defs/ParameterDomains"
        readiness:
          $ref: "#/components/schemas/ModelReadiness"
    CapabilityLimits:
      type: object
      additionalProperties: false
      required:
        - max_audio_bytes
        - max_text_codepoints
        - max_segment_ms
        - max_realtime_session_ms
        - max_queue_wait_ms
      properties:
        max_audio_bytes:
          type: integer
          minimum: 1
        max_text_codepoints:
          type: integer
          minimum: 1
        max_segment_ms:
          type: integer
          minimum: 1000
          maximum: 30000
        max_realtime_session_ms:
          type: integer
          minimum: 60000
        max_queue_wait_ms:
          type: integer
          minimum: 0
    AuxiliaryCapability:
      type: object
      additionalProperties: false
      required: [name, status, supported_modes]
      properties:
        name:
          type: string
          enum: [alignment, diarization]
        status:
          type: string
          enum: [available, unavailable, experimental]
        supported_modes:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: ["off", required, best_effort]
        max_speakers:
          type: [integer, "null"]
          minimum: 1
          maximum: 64
    ProfileList:
      type: object
      additionalProperties: false
      required: [object, data, has_more, next_cursor]
      properties:
        object:
          const: nexus.list
        data:
          type: array
          items:
            $ref: "#/components/schemas/ProfileSummary"
        has_more:
          type: boolean
        next_cursor:
          type: [string, "null"]
    ProfileSummary:
      type: object
      additionalProperties: false
      required: [id, revision, display_name, kind, release_tier, execution_classes]
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        revision:
          $ref: "#/components/schemas/Revision"
        display_name:
          type: string
        kind:
          type: string
          enum: [asr, tts, duplex]
        release_tier:
          $ref: "#/components/schemas/ProfileReleaseTier"
        execution_classes:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ServiceClass"
    VoiceList:
      type: object
      additionalProperties: false
      required: [object, data, has_more, next_cursor]
      properties:
        object:
          const: nexus.list
        data:
          type: array
          items:
            $ref: "#/components/schemas/VoiceSummary"
        has_more:
          type: boolean
        next_cursor:
          type: [string, "null"]
    VoiceSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - revision
        - display_name
        - source_type
        - status
        - languages
        - audio_formats
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        revision:
          $ref: "#/components/schemas/Revision"
        display_name:
          type: string
        source_type:
          type: string
          enum: [designed, cloned, builtin]
        status:
          type: string
          enum: [published, retired, disabled]
        languages:
          type: array
          uniqueItems: true
          items:
            type: string
            maxLength: 35
        audio_formats:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [mp3, wav, pcm]
    PronunciationList:
      type: object
      additionalProperties: false
      required: [object, data, has_more, next_cursor]
      properties:
        object:
          const: nexus.list
        data:
          type: array
          items:
            $ref: "#/components/schemas/PronunciationSummary"
        has_more:
          type: boolean
        next_cursor:
          type: [string, "null"]
    PronunciationSummary:
      type: object
      additionalProperties: false
      required: [id, head_revision, encoding, entry_count, status]
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        head_revision:
          $ref: "#/components/schemas/Revision"
        encoding:
          type: string
          enum: [pinyin, ipa]
        entry_count:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [draft, published, retired]
    PronunciationCreateRequest:
      type: object
      additionalProperties: false
      dependentRequired:
        id: [expected_revision]
        expected_revision: [id]
      required: [encoding, entries]
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        expected_revision:
          $ref: "#/components/schemas/Revision"
        encoding:
          type: string
          enum: [pinyin, ipa]
        entries:
          type: array
          minItems: 1
          maxItems: 10000
          items:
            $ref: "./voice-resource.schema.json#/$defs/PronunciationEntry"
        publish:
          type: boolean
          default: true
    JobKind:
      type: string
      enum: [asr, tts, voice_design, voice_clone, voice_preview, voice_validation]
    JobStatus:
      type: string
      enum:
        - queued
        - running
        - retry_wait
        - cancelling
        - succeeded
        - failed
        - cancelled
        - expired
    CleanupState:
      $ref: "shared/operation-states.schema.json#/$defs/CleanupState"
    JobCreateBase:
      type: object
      properties:
        kind:
          $ref: "#/components/schemas/JobKind"
        workspace_id:
          $ref: "#/components/schemas/Identifier"
        client_reference:
          type: string
          maxLength: 256
        model:
          type: string
          minLength: 1
          maxLength: 128
        profile:
          $ref: "#/components/schemas/ResourceReference"
        overrides:
          $ref: "#/components/schemas/JobOverrides"
        constraints:
          $ref: "#/components/schemas/JobConstraints"
        draft_target:
          $ref: "#/components/schemas/DraftTarget"
    JobCreateRequest:
      oneOf:
        - $ref: "#/components/schemas/AsrJobCreate"
        - $ref: "#/components/schemas/TtsJobCreate"
        - $ref: "#/components/schemas/VoiceDesignJobCreate"
        - $ref: "#/components/schemas/VoiceCloneJobCreate"
        - $ref: "#/components/schemas/VoicePreviewJobCreate"
        - $ref: "#/components/schemas/VoiceValidationJobCreate"
      discriminator:
        propertyName: kind
        mapping:
          asr: "#/components/schemas/AsrJobCreate"
          tts: "#/components/schemas/TtsJobCreate"
          voice_design: "#/components/schemas/VoiceDesignJobCreate"
          voice_clone: "#/components/schemas/VoiceCloneJobCreate"
          voice_preview: "#/components/schemas/VoicePreviewJobCreate"
          voice_validation: "#/components/schemas/VoiceValidationJobCreate"
      unevaluatedProperties: false
    JobOverrides:
      type: object
      additionalProperties: false
      properties:
        asr:
          $ref: "#/components/schemas/AsrOverrides"
        tts:
          $ref: "#/components/schemas/TtsOverrides"
    JobConstraints:
      type: object
      additionalProperties: false
      properties:
        max_queue_wait_ms:
          type: integer
          minimum: 0
          maximum: 86400000
        allow_degradation:
          type: boolean
          default: false
        require_exact_parameters:
          type: boolean
          default: false
    DraftTarget:
      type: object
      additionalProperties: false
      required: [id, expected_revision]
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        expected_revision:
          $ref: "#/components/schemas/Revision"
    AsrOverrides:
      type: object
      additionalProperties: false
      properties:
        language:
          type: string
          maxLength: 35
        preview_interval_ms:
          type: integer
          minimum: 100
          maximum: 5000
        max_segment_ms:
          type: integer
          minimum: 1000
          maximum: 30000
        finalization:
          type: string
          enum: [full_segment, streaming_finalize]
        final_deadline_ms:
          type: integer
          minimum: 100
          maximum: 10000
        auxiliary_deadline_ms:
          type: integer
          minimum: 100
          maximum: 10000
        rollback_tokens:
          type: integer
          minimum: 0
          maximum: 32
        turn_detection:
          type: object
          additionalProperties: false
          properties:
            mode:
              type: string
              enum: [server_vad, manual]
            silence_duration_ms:
              type: integer
              minimum: 200
              maximum: 3000
        vocabulary_set_revision:
          oneOf:
            - $ref: "#/components/schemas/Revision"
            - type: "null"
        alignment:
          type: string
          enum: ["off", required, best_effort]
        diarization:
          type: string
          enum: ["off", required, best_effort]
    AsrJobCreate:
      allOf:
        - $ref: "#/components/schemas/JobCreateBase"
        - type: object
          properties:
            kind:
              const: asr
            input:
              $ref: "#/components/schemas/AsrJobInput"
            output:
              $ref: "#/components/schemas/AsrJobOutput"
          required: [kind, model, input]
    AsrJobInput:
      type: object
      additionalProperties: false
      required: [audio_asset_id]
      properties:
        audio_asset_id:
          $ref: "#/components/schemas/Identifier"
    AsrJobOutput:
      type: object
      additionalProperties: false
      properties:
        transcript_format:
          type: string
          enum: [json, text, verbose_json, srt, vtt]
          default: json
        save_artifacts:
          type: boolean
          const: true
          default: true
    TtsJobCreate:
      allOf:
        - $ref: "#/components/schemas/JobCreateBase"
        - type: object
          properties:
            kind:
              const: tts
            input:
              $ref: "#/components/schemas/TtsJobInput"
            voice:
              $ref: "#/components/schemas/ResourceReference"
            pronunciation:
              $ref: "#/components/schemas/ResourceReference"
            output:
              $ref: "#/components/schemas/TtsJobOutput"
          required: [kind, model, input, voice]
    TtsJobInput:
      oneOf:
        - type: object
          additionalProperties: false
          required: [text]
          properties:
            text:
              type: string
              minLength: 1
              maxLength: 200000
        - type: object
          additionalProperties: false
          required: [text_asset_id]
          properties:
            text_asset_id:
              $ref: "#/components/schemas/Identifier"
    TtsJobOutput:
      type: object
      additionalProperties: false
      properties:
        audio_format:
          type: string
          enum: [mp3, wav, pcm]
          default: mp3
        save_artifacts:
          type: boolean
          const: true
          default: true
    VoiceDesignJobCreate:
      allOf:
        - $ref: "#/components/schemas/JobCreateBase"
        - type: object
          properties:
            kind:
              const: voice_design
            input:
              $ref: "#/components/schemas/VoiceDesignJobInput"
          required: [kind, model, input]
    VoiceDesignJobInput:
      $ref: "#/components/schemas/VoiceDesignInput"
    VoiceCloneJobCreate:
      allOf:
        - $ref: "#/components/schemas/JobCreateBase"
        - type: object
          properties:
            kind:
              const: voice_clone
            input:
              $ref: "#/components/schemas/VoiceCloneJobInput"
          required: [kind, model, input]
    VoiceCloneJobInput:
      $ref: "#/components/schemas/VoiceCloneInput"
    VoicePreviewJobCreate:
      allOf:
        - $ref: "#/components/schemas/JobCreateBase"
        - type: object
          properties:
            kind:
              const: voice_preview
            input:
              $ref: "#/components/schemas/VoicePreviewJobInput"
          required: [kind, input]
    VoicePreviewJobInput:
      type: object
      additionalProperties: false
      required: [voice_draft_id, draft_revision, text]
      properties:
        voice_draft_id:
          $ref: "#/components/schemas/Identifier"
        draft_revision:
          $ref: "#/components/schemas/Revision"
        text:
          type: string
          minLength: 1
          maxLength: 2000
    VoiceValidationJobCreate:
      allOf:
        - $ref: "#/components/schemas/JobCreateBase"
        - type: object
          properties:
            kind:
              const: voice_validation
            input:
              $ref: "#/components/schemas/VoiceValidationJobInput"
          required: [kind, input]
    VoiceValidationJobInput:
      type: object
      additionalProperties: false
