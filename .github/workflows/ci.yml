name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.5"
  PNPM_VERSION: "12.14.0"

jobs:
  python_checks:
    name: Python static checks and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Fetch only the compatibility baseline
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags --depth=1 origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          prune-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-packages --all-groups

      - name: Set up Node.js for reproducible contract generation
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc

      - name: Install locked contract generation tools
        run: |
          npm install --global --allow-scripts=pnpm pnpm@${PNPM_VERSION}
          pnpm install --frozen-lockfile

      - name: Reject generated contract drift
        run: make contracts-drift

      - name: Check breaking changes to OpenAI-compatible contracts
        if: github.event_name == 'pull_request'
        env:
          CONTRACT_BASE_REF: origin/${{ github.base_ref }}
        run: uv run python scripts/dev-env/check-openai-contract-compat.py --base "$CONTRACT_BASE_REF"

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Enforce module dependency direction
        run: uv run lint-imports

      - name: Validate contracts
        run: uv run python scripts/dev-env/validate-contracts.py

      - name: Run tests with coverage
        run: uv run pytest -m "not integration" --cov --cov-report=term-missing

      - name: Verify media toolchain
        run: uv run python scripts/dev-env/media-smoke.py

      - name: Build Python distributions
        run: uv build --all-packages --out-dir dist/python

  integration_shards:
    name: PostgreSQL/InnoDB shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: speechnexus
          POSTGRES_PASSWORD: speechnexus_test
          POSTGRES_DB: speechnexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U speechnexus -d speechnexus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.4.8
        env:
          MYSQL_ROOT_PASSWORD: speechnexus_test
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -pspeechnexus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          prune-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-packages --all-groups

      - name: Select external tools for this integration partition
        id: integration_tools
        run: |
          python3 scripts/dev-env/integration-shards.py requirements \
            --index "${{ matrix.shard }}" --count 6 >> "$GITHUB_OUTPUT"

      - name: Set up Node.js for actual contract HTTP consumption
        if: steps.integration_tools.outputs.node_contracts == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc

      - name: Install locked contract runtime dependencies
        if: steps.integration_tools.outputs.node_contracts == 'true'
        run: |
          npm install --global --allow-scripts=pnpm pnpm@${PNPM_VERSION}
          pnpm --filter @speechnexus/contracts --prod install --frozen-lockfile --ignore-scripts

      - name: Start isolated versioned object storage
        run: ./scripts/dev-env/minio-test-service.sh

      - name: Run a complete integration partition with PG, InnoDB and MinIO
        env:
          SPEECHNEXUS_TEST_DATABASE_URL: postgresql://speechnexus:speechnexus_test@127.0.0.1:5432/speechnexus_test
          SPEECHNEXUS_TEST_MYSQL_URL: mysql://root:speechnexus_test@127.0.0.1:3306/
          SPEECHNEXUS_TEST_MINIO_ENDPOINT: http://127.0.0.1:59000
          SPEECHNEXUS_TEST_MINIO_ACCESS_KEY: speechnexus_test
          SPEECHNEXUS_TEST_MINIO_SECRET_KEY: synthetic_asset_test_secret
        run: |
          test -n "$SPEECHNEXUS_TEST_DATABASE_URL"
          test -n "$SPEECHNEXUS_TEST_MYSQL_URL"
          uv run python scripts/dev-env/integration-shards.py run \
            --index "${{ matrix.shard }}" --count 6 \
            --report "$RUNNER_TEMP/integration-shard-${{ matrix.shard }}.json"

      - name: Preserve integration partition evidence
        if: ${{ always() }}
        # Official v7.0.2; reports contain only test identities and results.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: integration-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/integration-shard-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  # Preserve the protected status name and require both actual execution and
  # a complete, disjoint inventory. Failure/cancellation/skipping cannot pass.
  coordination:
    name: PostgreSQL and InnoDB integration
    needs: [integration_shards]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every integration shard
        env:
          SHARDS_RESULT: ${{ needs.integration_shards.result }}
        run: |
          if [[ "$SHARDS_RESULT" != success ]]; then
            echo "::error::Integration shards=$SHARDS_RESULT"
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Download integration partition evidence
        # Official v8.0.2; only artifacts from this repository/run are used.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: integration-shard-*
          path: ${{ runner.temp }}/integration-shards
          merge-multiple: true
          digest-mismatch: error

      - name: Require the complete integration collection exactly once
        run: |
          python3 scripts/dev-env/integration-shards.py check \
            --count 6 --head "$(git rev-parse HEAD)" \
            --reports-dir "$RUNNER_TEMP/integration-shards"

  # Keep the protected status name stable; a failed, cancelled or skipped
  # prerequisite must never turn into a successful merge gate.
  python:
    name: Python quality and tests
    needs: [python_checks, coordination]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require both Python and dual-database evidence
        env:
          CHECKS_RESULT: ${{ needs.python_checks.result }}
          COORDINATION_RESULT: ${{ needs.coordination.result }}
        run: |
          if [[ "$CHECKS_RESULT" != success || "$COORDINATION_RESULT" != success ]]; then
            echo "::error::Python checks=$CHECKS_RESULT; PG/InnoDB=$COORDINATION_RESULT"
            exit 1
          fi

  web:
    name: Web quality, tests, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc

      - name: Activate pnpm
        run: |
          npm install --global --allow-scripts=pnpm pnpm@${PNPM_VERSION}

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify OpenAI JavaScript SDK contract parity
        run: pnpm test:contracts-sdk

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  deployment:
    name: Deployment configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate Compose configuration
        run: |
          docker compose \
            --env-file deploy/compose.env.example \
            -f deploy/compose.yaml \
            config --quiet
