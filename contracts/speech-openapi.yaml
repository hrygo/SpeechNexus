          description: Persistent job_event_seq used as the SSE id.
        type:
          type: string
          enum:
            - job.queued
            - job.started
            - job.progress
            - job.retry_scheduled
            - job.cancelling
            - job.succeeded
            - job.failed
            - job.cancelled
            - job.expired
            - job.cleanup_updated
            - artifact.published
        job_id:
          $ref: "#/components/schemas/Identifier"
        occurred_at:
          type: string
          format: date-time
        data:
          type: object
          description: Event-type-specific payload; see the concrete JobEvent variant.
