openapi: 3.1.0
info:
  title: SpeechNexus public speech API
  version: 0.1.0.dev0
  description: |
    SpeechNexus public speech protocol.

    The OpenAI-compatible subset is limited to the paths, fields, formats, and
    events explicitly declared here. A standard OpenAI SDK can use this API by
    setting base_url to <deployment>/v1 and supplying any api_key value unless
    the deployment enables a shared service key. SpeechNexus enhancements live
    under /v1/nexus and the optional `nexus` request field; a standard request
    never needs an enhancement wrapper. Unsupported standard parameters are
    rejected with 422 `unsupported_parameter`, never silently ignored.

    Realtime has two connection modes at GET /v1/realtime: a pre-created
    nexus session (`session_id`) and a compatibility transcription session
    opened with `model`. Both accept the declared standard transcription
    event subset. TTS, previews, metadata, and operation coordination remain
    nexus.* events and are available only in a nexus-created session.
servers:
  - url: /
security:
  - SharedServiceKey: []
  - {}
tags:
  - name: openai-compatible
  - name: capabilities
  - name: profiles
  - name: voices
  - name: jobs
  - name: operations
  - name: assets
  - name: artifacts
  - name: realtime
  - name: voice-creation
paths:
  /v1/models:
    get:
      tags: [openai-compatible]
      operationId: listModels
      summary: List published logical models
      description: |
        Returns the OpenAI model-list shape. The `nexus` object on each model
        separates binding revision, support, quality qualification, and current
        admission facts. This endpoint never exposes model paths or endpoints.
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Published logical models.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/models/{model}:
    get:
      tags: [openai-compatible]
      operationId: retrieveModel
      summary: Retrieve one published logical model
      parameters:
        - name: model
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Published logical model.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Model"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/audio/transcriptions:
    post:
      tags: [openai-compatible]
      operationId: createTranscription
      summary: Create a synchronous file transcription
      description: |
        OpenAI Audio transcription subset. `file`, `model`, `language`,
        `prompt`, `response_format`, and `timestamp_granularities[]` are
        declared. `response_format=verbose_json` is accepted only when the
        selected binding can provide real segment and word evidence; a lack of
        evidence returns 422 `unsupported_parameter` instead of fabricated
        timestamps. The optional `nexus` form field is a JSON string and is
        never required for standard clients.
      parameters:
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/TranscriptionRequest"
            encoding:
              file:
                contentType: application/octet-stream
              nexus:
                contentType: application/json
      responses:
        "200":
          description: |
            JSON for `json` / `verbose_json`; plain text for `text`, `srt`, and
            `vtt`. The response shape follows the requested format.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
            X-Operation-ID:
              $ref: "#/components/headers/XOperationId"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Transcription"
                  - $ref: "#/components/schemas/TranscriptionVerbose"
            text/plain:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/audio/speech:
    post:
      tags: [openai-compatible]
      operationId: createSpeech
      summary: Create synchronous text-to-speech audio
      description: |
        OpenAI Audio speech subset. The declared response formats are mp3, wav,
        and raw PCM. `stream_format` accepts only `audio` in P0; `sse` is
        rejected as unsupported. A standard request returns complete audio.
        Chunked audio delivery is a nexus realtime capability, not an OpenAI
        speech response mode.
      parameters:
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpeechRequest"
      responses:
        "200":
          description: Complete audio in the negotiated format.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
            X-Operation-ID:
              $ref: "#/components/headers/XOperationId"
            X-Audio-Format:
              $ref: "#/components/headers/XAudioFormat"
            X-Sample-Rate-Hz:
              $ref: "#/components/headers/XSampleRateHz"
            X-Channels:
              $ref: "#/components/headers/XChannels"
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
            audio/wav:
              schema:
                type: string
                format: binary
            audio/pcm:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/nexus/capabilities:
    get:
      tags: [capabilities]
      operationId: getCapabilities
      summary: Get an atomic capability snapshot
      description: |
        Returns one consistent snapshot for the deployment, workspace, catalog,
        and policy revision. The endpoint is side-effect free: it never loads,
        warms, downloads, or evicts a model. `ETag` covers the same revisions.
      parameters:
        - $ref: "#/components/parameters/WorkspaceIdQuery"
        - $ref: "#/components/parameters/XRequestId"
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Current capability snapshot.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilitySnapshot"
        "304":
          description: The supplied ETag still matches the current snapshot.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/nexus/profiles:
    get:
      tags: [profiles]
      operationId: listProfiles
      summary: List published scenario profiles
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/WorkspaceIdQuery"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Published profile revisions.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/nexus/profiles/{profile_id}/revisions/{revision}:
    get:
      tags: [profiles]
      operationId: getProfileRevision
      summary: Get one immutable scenario profile revision
      parameters:
        - $ref: "#/components/parameters/ProfileIdPath"
        - $ref: "#/components/parameters/RevisionPath"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Immutable profile revision.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "./scenario-profile.schema.json"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/nexus/voices:
    get:
      tags: [voices]
      operationId: listVoices
      summary: List published voices visible to the deployment
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/WorkspaceIdQuery"
        - name: language
          in: query
          required: false
          schema:
            type: string
            maxLength: 35
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Published voice revisions.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/nexus/voices/{voice_id}/revisions/{revision}:
    get:
      tags: [voices]
      operationId: getVoiceRevision
      summary: Get one immutable published voice revision
      parameters:
        - $ref: "#/components/parameters/VoiceIdPath"
        - $ref: "#/components/parameters/RevisionPath"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Immutable published voice revision.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "./voice-resource.schema.json#/$defs/VoiceRevision"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/nexus/voices/{voice_id}/revisions/{revision}/retirements:
    post:
      tags: [voices]
      operationId: retireVoiceRevision
      summary: Retire or disable a published voice revision
      description: |
        `retire` stops new references while fixed in-flight jobs with a valid
        dependency lease may finish. `disable` is an emergency action that also
        cancels confirmed in-flight use; unknown cleanup remains quarantined.
      parameters:
        - $ref: "#/components/parameters/VoiceIdPath"
        - $ref: "#/components/parameters/RevisionPath"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoiceRetirementRequest"
      responses:
        "200":
          description: Updated voice revision state.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "./voice-resource.schema.json#/$defs/VoiceRevision"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /v1/nexus/pronunciation-sets:
    get:
      tags: [voices]
      operationId: listPronunciationSets
      summary: List pronunciation sets
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Pronunciation-set heads.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PronunciationList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      tags: [voices]
      operationId: createPronunciationRevision
      summary: Create an immutable pronunciation-set revision
      description: |
        Omit `id` to create a new pronunciation set. Supply `id` and
        `expected_revision` to append a revision to an existing set. Entries are
        validated and published atomically; an existing revision is never
        modified.
      parameters:
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PronunciationCreateRequest"
      responses:
        "201":
          description: Pronunciation revision created.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "./voice-resource.schema.json#/$defs/PronunciationRevision"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/nexus/pronunciation-sets/{pronunciation_id}/revisions/{revision}:
    get:
      tags: [voices]
      operationId: getPronunciationRevision
      summary: Get one immutable pronunciation-set revision
      parameters:
        - name: pronunciation_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Identifier"
        - $ref: "#/components/parameters/RevisionPath"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Immutable pronunciation revision.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "./voice-resource.schema.json#/$defs/PronunciationRevision"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/nexus/jobs:
    post:
      tags: [jobs]
      operationId: createJob
      summary: Create a durable ASR, TTS, or voice-creation job
      description: |
        The request discriminator is `kind`. The service resolves mutable
        defaults once, pins the model binding and all dependent revisions, and
        returns an immutable effective configuration. A repeated Idempotency-Key
        with the same canonical intent replays the original job; a different
        intent returns 409 `idempotency_conflict`.
      parameters:
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobCreateRequest"
      responses:
        "202":
          description: Job accepted.
          headers:
            Location:
              description: Relative or absolute job URL.
              schema:
                type: string
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    get:
      tags: [jobs]
      operationId: listJobs
      summary: List durable jobs
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/WorkspaceIdQuery"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/JobStatus"
        - name: kind
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/JobKind"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Jobs ordered by (created_at, id).
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/nexus/jobs/{job_id}:
    get:
      tags: [jobs]
      operationId: getJob
      summary: Get job state and committed artifacts
      parameters:
        - $ref: "#/components/parameters/JobIdPath"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Current job state.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/nexus/jobs/{job_id}/cancellations:
    post:
      tags: [jobs]
      operationId: cancelJob
      summary: Request idempotent job cancellation
      description: |
        Returns 202 while the cancellation is being confirmed and 200 when the
        job is already terminal. A cancellation request is not stop evidence;
        `cleanup_state` reports the actual resource state.
      parameters:
        - $ref: "#/components/parameters/JobIdPath"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Job already terminal.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobCancellation"
        "202":
          description: Cancellation accepted and awaiting stop evidence.
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobCancellation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/nexus/jobs/{job_id}/retries:
    post:
      tags: [jobs]
      operationId: retryJob
      summary: Create a new job from a terminal job intent
      description: |
        Retry creates a new Job with a new attempt history; it never revives the
        old job. While the old execution is not verifiably stopped, returns 409
        `execution_cleanup_pending`.
      parameters:
        - $ref: "#/components/parameters/JobIdPath"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Replacement job accepted.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /v1/nexus/jobs/{job_id}/events:
    get:
      tags: [jobs]
      operationId: streamJobEvents
      summary: Stream durable job events with SSE
      description: |
        SSE `id` is the persistent job_event_seq. `Last-Event-ID` resumes after
        that sequence. Expired event history returns 410
        `event_history_expired`; clients then read current job state. Event data
        is a JobEvent JSON object.
      parameters:
        - $ref: "#/components/parameters/JobIdPath"
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            $ref: "#/components/schemas/EventSequence"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Server-sent event stream.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              description: Always no-cache for event streams.
              schema:
                type: string
                const: no-cache
          content:
            text/event-stream:
              schema:
                type: string
              x-sse-event-schema:
                $ref: "#/components/schemas/JobEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Gone"
  /v1/nexus/operations/{operation_id}:
    get:
      tags: [operations]
      operationId: getOperation
      summary: Get execution coordination state
      parameters:
        - $ref: "#/components/parameters/OperationIdPath"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Operation state and receipt.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/nexus/operations/{operation_id}/cancellations:
    post:
      tags: [operations]
      operationId: cancelOperation
      summary: Request cancellation of a synchronous or realtime operation
      description: |
        For an operation owned by a Job, this creates a cancellation request for
        the owning job so that a required step cannot be left without a result.
      parameters:
        - $ref: "#/components/parameters/OperationIdPath"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Operation already terminal.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationCancellation"
        "202":
          description: Cancellation accepted and awaiting stop evidence.
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationCancellation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/nexus/assets:
    post:
      tags: [assets]
      operationId: uploadAsset
      summary: Upload a bounded input asset
      description: |
        The body is streamed to private staging, validated, and only then marked
        ready. No remote URL, object key, or server path is accepted.
      parameters:
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/AssetUploadRequest"
      responses:
        "201":
          description: Asset accepted and ready or awaiting validation.
          headers:
            Location:
