name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.5"
  PNPM_VERSION: "12.14.0"

jobs:
  changes:
    name: "Scope routing and CI / design-token checks"
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      mode: ${{ steps.route.outputs.mode }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify routing boundaries without installing project dependencies
        run: python3 -m unittest discover -s tests/ci -v

      - name: Set up Node.js for dependency-free design checks
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc

      - name: Verify design token guardrails without installing project dependencies
        run: |
          node --test tests/ci/design-tokens.test.mjs
          node scripts/dev-env/validate-design-tokens.mjs

      - name: Route the exact checked-out diff
        id: route
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 scripts/dev-env/ci-routing.py \
            --event="$EVENT_NAME" --base="$BASE_SHA" \
            --output="$GITHUB_OUTPUT" --summary="$GITHUB_STEP_SUMMARY"

  # The committed snapshot is the only render input, so a hand-edited matrix or a
  # stale snapshot-derived view fails here without querying GitHub. Unrelated
  # changes skip the regeneration step and cannot be blocked by this gate.
  delivery_tracking:
    name: "Docs: delivery matrix freshness"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Detect delivery matrix inputs in this change
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ || "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git fetch --no-tags --depth=1 origin "$BASE_SHA"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          inputs=(
            docs/plans/delivery-tracking.md
            docs/plans/delivery-issues.json
            docs/plans/github-issues-snapshot.json
            scripts/dev-env/refresh-implementation-tracker.py
            scripts/dev-env/delivery_tracker.py
          )
          if git diff --name-only "$BASE_SHA" HEAD -- "${inputs[@]}" | grep -q .; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate the delivery matrix from the committed snapshot
        if: steps.scope.outputs.relevant == 'true'
        run: |
          SNAPSHOT_AT="$(python3 -c \
            'import json; print(json.load(open("docs/plans/github-issues-snapshot.json", encoding="utf-8"))["fetched_at"])')"
          python3 scripts/dev-env/refresh-implementation-tracker.py \
            --snapshot docs/plans/github-issues-snapshot.json \
            --snapshot-at "$SNAPSHOT_AT" \
            --output docs/plans/delivery-tracking.md
          git diff --exit-code -- docs/plans/delivery-tracking.md

  python_checks:
    name: "Python: tests, coverage and package build"
    needs: [changes]
    if: ${{ needs.changes.outputs.mode == 'full' || needs.changes.outputs.mode == 'web' || needs.changes.outputs.mode == 'no-db' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Fetch only the compatibility baseline
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags --depth=1 origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          prune-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-packages --all-groups

      - name: Set up Node.js for reproducible contract generation
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc

      - name: Install locked contract generation tools
        run: |
          npm install --global --allow-scripts=pnpm pnpm@${PNPM_VERSION}
          pnpm install --frozen-lockfile

      - name: Verify media decoding dependencies before complete regression
        # Fail the same required job early when the native decode stack is
        # unusable. PyAV/FFmpeg, imageio-ffmpeg and soundfile come from the
        # locked wheels synced above; this job installs no media system package.
        # The complete coverage run remains unchanged after this real probe.
        run: >-
          uv run pytest -q
          tests/unit/media/test_audio_inspection.py::test_real_decode_binds_complete_source_facts_to_digest_without_pcm

      - name: Ensure PostgreSQL 16 tools for the private coverage cluster
        run: |
          if [[ ! -x /usr/lib/postgresql/16/bin/initdb ]]; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends --yes postgresql-16
          fi
          test -x /usr/lib/postgresql/16/bin/initdb

      - name: Start isolated versioned object storage for coverage
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/dev-env/minio-test-service.sh

      - name: Measure Python unit, contract, CI and Workbench PG tests for the merged gate
        id: coverage
        env:
          SPEECHNEXUS_TEST_MINIO_ENDPOINT: http://127.0.0.1:59000
          SPEECHNEXUS_TEST_MINIO_ACCESS_KEY: speechnexus_test
          SPEECHNEXUS_TEST_MINIO_SECRET_KEY: synthetic_asset_test_secret
        run: |
          uv run python scripts/dev-env/python-coverage.py run \
            --pg-bin /usr/lib/postgresql/16/bin --workers 2 \
            --output "$RUNNER_TEMP/workbench-pg-coverage.json"

      - name: Preserve full coverage execution evidence
        if: ${{ !cancelled() && (steps.coverage.outcome == 'success' || steps.coverage.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: workbench-pg-full-coverage
          path: |
            ${{ runner.temp }}/workbench-pg-coverage.json
            ${{ runner.temp }}/workbench-pg-coverage-parts/
          if-no-files-found: error
          retention-days: 7

      - name: Verify media toolchain
        run: uv run python scripts/dev-env/media-smoke.py

      - name: Build Python distributions
        run: |
          uv build --all-packages --out-dir dist/python
          uv build --wheel --no-sources deploy/engines/vllm-asr-lifecycle --out-dir dist/python

  python_contracts:
    name: "Python: lint, types and contract compatibility"
    needs: [changes]
    if: ${{ needs.changes.outputs.mode == 'full' || needs.changes.outputs.mode == 'web' || needs.changes.outputs.mode == 'no-db' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Fetch only the compatibility baseline
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags --depth=1 origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          prune-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-packages --all-groups

      - name: Set up Node.js for reproducible contract generation
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc

      - name: Install locked contract generation tools
        run: |
          npm install --global --allow-scripts=pnpm pnpm@${PNPM_VERSION}
          pnpm install --frozen-lockfile

      - name: Reject generated contract drift
        run: make contracts-drift

      - name: Check breaking changes to OpenAI-compatible contracts
        if: github.event_name == 'pull_request'
        env:
          CONTRACT_BASE_REF: origin/${{ github.base_ref }}
        run: uv run python scripts/dev-env/check-openai-contract-compat.py --base "$CONTRACT_BASE_REF"

      - name: Check known structural changes to versioned HTTP contracts
        if: github.event_name == 'pull_request'
        env:
          CONTRACT_BASE_REF: origin/${{ github.base_ref }}
        run: make contracts-http-changes

      - name: Check known structural changes to the full speech HTTP source
        if: github.event_name == 'pull_request'
        env:
          CONTRACT_BASE_REF: origin/${{ github.base_ref }}
        run: make contracts-speech-changes

      - name: Check speech route conformance against the current contract
        run: make contracts-route-conformance

      - name: Check known structural changes to coordination request entrypoints
        if: github.event_name == 'pull_request'
        env:
          CONTRACT_BASE_REF: origin/${{ github.base_ref }}
        run: make contracts-coordination-requests

      - name: Check known structural changes to coordination result guarantees
        if: github.event_name == 'pull_request'
        env:
          CONTRACT_BASE_REF: origin/${{ github.base_ref }}
        run: make contracts-coordination-results

      - name: Check declared realtime runtime constraints
        if: github.event_name == 'pull_request'
        env:
          CONTRACT_BASE_REF: origin/${{ github.base_ref }}
        run: make contracts-realtime-changes

      - name: Check Python formatting with Ruff
        run: uv run ruff format --check .

      - name: Lint Python with Ruff
        run: uv run ruff check .

      - name: Check Python types with mypy
        run: uv run mypy

      - name: Check Python module dependency boundaries
        run: uv run lint-imports

      - name: Validate API and event schemas
        run: uv run python scripts/dev-env/validate-contracts.py

  integration_shards:
    name: "Integration ${{ matrix.shard }}: ${{ matrix.shard >= 4 && 'Web + PG/MySQL/MinIO' || 'PG/MySQL/MinIO' }}"
    needs: [changes]
    if: ${{ needs.changes.outputs.mode == 'full' }}
    runs-on: ubuntu-24.04
    # Baseline: the four database partitions need 7-9.5 min of job wall clock.
    # PR #498's Integration 2 attempt 1 stalled at 84% and hit the old 18 min
    # inner ceiling; the same commit passed on retry in 760 s. The old 20 min job
    # left only ~9 s from the inner deadline to job completion. The probe now
    # derives a 25 min ceiling from this 30 min budget with a five-minute
    # setup/cleanup reserve (docs/validation/ci-validation.md). This is headroom
    # for the slow tail and the same work, not a different selection or weaker
    # assertion.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        # The canonical partitioner groups Web consumers into two lanes and
        # ordinary DB cases into four; tools still follow the actual collection.
        shard: [0, 1, 2, 3, 4, 5]
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: speechnexus
          POSTGRES_PASSWORD: speechnexus_test
          POSTGRES_DB: speechnexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U speechnexus -d speechnexus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.4.8
        env:
          MYSQL_ROOT_PASSWORD: speechnexus_test
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -pspeechnexus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Record partition wall-clock start
        # Observation only; the value feeds the timing summary after the run.
        run: echo "SHARD_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          prune-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-packages --all-groups

      - name: Ensure PostgreSQL 16 tools for the private integration cluster
        run: |
          if [[ ! -x /usr/lib/postgresql/16/bin/initdb ]]; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends --yes postgresql-16
          fi
          test -x /usr/lib/postgresql/16/bin/initdb

      - name: Select external tools for this integration partition
        id: integration_tools
        run: |
          uv run python scripts/dev-env/integration-shards.py requirements \
            --index "${{ matrix.shard }}" --count 6 >> "$GITHUB_OUTPUT"

      - name: Set up Node.js for actual contract HTTP consumption
        if: steps.integration_tools.outputs.node_contracts == 'true' || steps.integration_tools.outputs.browser == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc

      - name: Activate pnpm for integration consumers
        if: steps.integration_tools.outputs.node_contracts == 'true' || steps.integration_tools.outputs.browser == 'true'
        run: |
          npm install --global --allow-scripts=pnpm pnpm@${PNPM_VERSION}

      - name: Install locked contract runtime dependencies
        if: steps.integration_tools.outputs.node_contracts == 'true' && steps.integration_tools.outputs.browser != 'true'
        run: |
          pnpm --filter @speechnexus/contracts --prod install --frozen-lockfile --ignore-scripts

      - name: Install locked Web dependencies for browser consumers
        if: steps.integration_tools.outputs.browser == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build actual Web bundles for browser consumers
        if: steps.integration_tools.outputs.browser == 'true'
        run: pnpm build

      - name: Install Chromium for browser consumers
        if: steps.integration_tools.outputs.browser == 'true'
        run: python3 scripts/dev-env/prepare-ci-browser.py

      - name: Start isolated versioned object storage
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/dev-env/minio-test-service.sh

      - name: Run a complete integration partition with PG, InnoDB and MinIO
        env:
          SPEECHNEXUS_TEST_DATABASE_URL: postgresql://speechnexus:speechnexus_test@127.0.0.1:5432/speechnexus_test
          SPEECHNEXUS_TEST_MYSQL_URL: mysql://root:speechnexus_test@127.0.0.1:3306/
          SPEECHNEXUS_TEST_MINIO_ENDPOINT: http://127.0.0.1:59000
          SPEECHNEXUS_TEST_MINIO_ACCESS_KEY: speechnexus_test
          SPEECHNEXUS_TEST_MINIO_SECRET_KEY: synthetic_asset_test_secret
        run: |
          test -n "$SPEECHNEXUS_TEST_DATABASE_URL"
          test -n "$SPEECHNEXUS_TEST_MYSQL_URL"
          uv run python scripts/dev-env/workbench-pg-probe.py \
            --pg-bin /usr/lib/postgresql/16/bin \
            --integration-shard "${{ matrix.shard }}" --shard-count 6 \
            --shard-report "$RUNNER_TEMP/integration-shard-${{ matrix.shard }}.json" \
            --shard-coverage "$RUNNER_TEMP/coverage-${{ matrix.shard }}.data" \
            --output "$RUNNER_TEMP/workbench-pg-shard-${{ matrix.shard }}.json"

      - name: Publish integration partition timing
        # Observation only: the summary never decides the job result, which stays
        # bound to the partition run above. A job cancelled at its timeout does
        # not run this step, so a missing summary is itself a timeout signal.
        if: ${{ always() }}
        env:
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          python3 - "$RUNNER_TEMP/integration-shard-${SHARD_INDEX}.json" "$SHARD_INDEX" <<'PY'
          import json
          import os
          import sys
          import time
          from pathlib import Path

          report, index = Path(sys.argv[1]), sys.argv[2]
          entry = {"Job wall clock": "unavailable", "pytest execution": "unavailable"}
          started = os.environ.get("SHARD_STARTED_EPOCH", "")
          if started.isdigit():
              entry["Job wall clock"] = f"{time.time() - int(started):.0f} s"
          try:
              data = json.loads(report.read_text(encoding="utf-8"))
              entry["pytest execution"] = f"{float(data['elapsed_seconds']):.1f} s"
              entry["Selected cases"] = str(len(data["selected"]))
          except (OSError, KeyError, TypeError, ValueError):
              pass
          lines = [f"### Integration partition {index}", "", "| metric | value |", "| --- | --- |"]
          lines.extend(f"| {name} | {value} |" for name, value in entry.items())
          lines.extend(
              [
                  "",
                  "Budget: 30 min job timeout with a 25 min inner probe ceiling.",
                  "A shard consistently above 15 min is split or repartitioned,",
                  "not given a larger timeout (docs/validation/ci-validation.md).",
                  "",
              ]
          )
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as output:
              output.write("\n".join(lines))
          PY

      - name: Preserve integration partition evidence
        if: ${{ always() }}
        # Official v7.0.2; reports contain only test identities and results.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: integration-shard-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/integration-shard-${{ matrix.shard }}.json
            ${{ runner.temp }}/workbench-pg-shard-${{ matrix.shard }}.json
            ${{ runner.temp }}/coverage-${{ matrix.shard }}.data
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  # Full scope still requires actual execution, a complete disjoint inventory, and
  # one coverage judgment over the measured dataset plus all six partitions. The
  # gate keeps failing closed: absent shards or absent coverage data stop it exactly
  # like a test failure does.
  coordination:
    name: "Gate: six-shard integration evidence and merged coverage"
    needs: [changes, python_checks, integration_shards]
    if: ${{ always() && needs.changes.result == 'success' && needs.changes.outputs.mode == 'full' }}
    runs-on: ubuntu-24.04
    # Setup and a locked install are new here: the merged judgment needs the same
    # coverage version the measurement used. Download plus combine stay in seconds.
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require every integration shard
        env:
          SHARDS_RESULT: ${{ needs.integration_shards.result }}
        run: |
          if [[ "$SHARDS_RESULT" != success ]]; then
            echo "::error::Integration shards=$SHARDS_RESULT"
            exit 1
          fi

      - name: Require the Python coverage measurement
        env:
          MEASUREMENT_RESULT: ${{ needs.python_checks.result }}
        run: |
          if [[ "$MEASUREMENT_RESULT" != success ]]; then
            echo "::error::Python coverage measurement=$MEASUREMENT_RESULT"
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          prune-cache: true

      - name: Install locked dependencies for the coverage judgment
        run: uv sync --locked --all-packages --all-groups

      - name: Download integration partition evidence
        # The Node action hung after successful downloads in both client modes.
        # Bound CLI processes; verify archive digests before reading expected files.
        env:
          GH_TOKEN: ${{ github.token }}
          CI_REPOSITORY: ${{ github.repository }}
          CI_RUN_ID: ${{ github.run_id }}
        run: |
          python3 scripts/dev-env/download-integration-evidence.py \
            --repository "$CI_REPOSITORY" --run-id "$CI_RUN_ID" \
            --count 6 --output "$RUNNER_TEMP/integration-shards" \
            --coverage-output "$RUNNER_TEMP/coverage-evidence"

      - name: Verify same-commit collection, partition coverage and actual test outcomes
        run: |
          python3 scripts/dev-env/integration-shards.py check \
            --count 6 --head "$(git rev-parse HEAD)" \
            --reports-dir "$RUNNER_TEMP/integration-shards"

      - name: Merge the measured and integration coverage and enforce the unchanged gate
        # Measured dataset plus six partition datasets, then one report through
        # pyproject.toml. Missing or digest-divergent data fails before any report.
        run: |
          uv run python scripts/dev-env/python-coverage.py combine \
            --job-summary "$RUNNER_TEMP/coverage-evidence/workbench-pg-coverage.json" \
            --job-parts "$RUNNER_TEMP/coverage-evidence/workbench-pg-coverage-parts" \
            --integration-dir "$RUNNER_TEMP/integration-shards" \
            --count 6 --output "$RUNNER_TEMP/coverage-merge"

      - name: Publish the merged coverage result
        # Observation only: reads what the judgment above wrote and never decides.
        if: ${{ always() }}
        run: |
          python3 - "$RUNNER_TEMP/coverage-merge/merged.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          entry = {"Merged data sources": "unavailable", "Merged coverage": "unavailable",
                   "fail_under=80": "unavailable"}
          path = Path(sys.argv[1])
          try:
              data = json.loads(path.read_text(encoding="utf-8"))
              sources = data["job_parts"] + data["shards"]
              entry["Merged data sources"] = f"{data['job_parts']} measured + {data['shards']} shard = {sources}"
              percent = data["coverage_percent"]
              if isinstance(percent, (int, float)):
                  entry["Merged coverage"] = f"{percent:.4f}%"
              entry["fail_under=80"] = "passed" if data["coverage_passed"] else "failed"
          except (OSError, KeyError, TypeError, ValueError):
              pass
          lines = ["### Merged Python coverage gate", "", "| metric | value |", "| --- | --- |"]
          lines.extend(f"| {name} | {value} |" for name, value in entry.items())
          lines.extend([
              "",
              "The six integration partitions are the only source of integration-only",
              "coverage; a missing dataset fails this gate instead of shrinking it.",
              "",
          ])
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as output:
              output.write("\n".join(lines))
          PY

      - name: Preserve merged coverage evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: merged-python-coverage
          path: ${{ runner.temp }}/coverage-merge/
          if-no-files-found: warn
          retention-days: 7
          overwrite: true

      - name: Publish per-shard timing comparison
        # Observation only: reads the evidence downloaded above and never gates.
        if: ${{ always() }}
        run: |
          python3 - "$RUNNER_TEMP/integration-shards" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          evidence = Path(sys.argv[1])
          lines = ["### Integration shard timing", ""]
          rows = []
          paths = sorted(evidence.glob("integration-shard-*.json")) if evidence.is_dir() else []
          for path in paths:
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
                  rows.append(
                      (
                          int(data["shard_index"]),
                          float(data["elapsed_seconds"]),
                          len(data["selected"]),
                      )
                  )
              except (OSError, KeyError, TypeError, ValueError):
                  continue
          if rows:
              slowest = max(row[1] for row in rows)
              lines.extend(["| shard | pytest execution | selected cases |", "| --- | --- | --- |"])
              for index, seconds, cases in sorted(rows):
                  marker = " (slowest)" if seconds == slowest else ""
                  lines.append(f"| {index} | {seconds:.1f} s{marker} | {cases} |")
          else:
              lines.append("Shard timing unavailable: downloaded evidence is absent.")
          lines.extend(
              [
                  "",
                  "Pair this with each shard job's wall clock. A shard consistently above",
                  "15 min is split, not given a larger timeout",
                  "(docs/validation/ci-validation.md).",
                  "",
              ]
          )
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as output:
              output.write("\n".join(lines))
          PY

  # Require both Python execution and independent static/contract checks.
  python_checks_gate:
    name: "Gate: Python execution and static checks"
    needs: [changes, python_checks, python_contracts]
    if: ${{ always() && needs.changes.result == 'success' && (needs.changes.outputs.mode == 'full' || needs.changes.outputs.mode == 'web' || needs.changes.outputs.mode == 'no-db') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require Python test/build and static/contract jobs to succeed
        env:
          CHECKS_RESULT: ${{ needs.python_checks.result }}
          CONTRACTS_RESULT: ${{ needs.python_contracts.result }}
        run: |
          if [[ "$CHECKS_RESULT" != success || "$CONTRACTS_RESULT" != success ]]; then
            echo "::error::Python execution=$CHECKS_RESULT; contracts=$CONTRACTS_RESULT"
            exit 1
          fi

  # The reusable workflow always reports its scope; its own gate requires both
  # matrix members when applicable and only accepts a skip when inapplicable.
  node_controller_image:
    name: "Node Controller image evidence"
    needs: [changes]
    if: ${{ always() && needs.changes.result == 'success' }}
    uses: ./.github/workflows/node-controller-image.yml

  # Branch protection must use this gate's display name. Only a successful route
  # can make a lane inapplicable; unexpected skipping or failure cannot pass.
  python:
    name: "Gate: required checks for this change"
    needs:
      [
        changes,
        delivery_tracking,
        python_checks_gate,
        coordination,
        web,
        deployment,
        reference_acceptance,
        node_controller_image,
      ]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require successful routing and every applicable CI result
        env:
          MODE: ${{ needs.changes.outputs.mode }}
          ROUTING_RESULT: ${{ needs.changes.result }}
          DELIVERY_RESULT: ${{ needs.delivery_tracking.result }}
          CHECKS_RESULT: ${{ needs.python_checks_gate.result }}
          COORDINATION_RESULT: ${{ needs.coordination.result }}
          WEB_RESULT: ${{ needs.web.result }}
          DEPLOYMENT_RESULT: ${{ needs.deployment.result }}
          ACCEPTANCE_RESULT: ${{ needs.reference_acceptance.result }}
          CONTROLLER_RESULT: ${{ needs.node_controller_image.result }}
          CONTROLLER_REQUIRED: ${{ needs.node_controller_image.outputs.required }}
        run: |
          if [[ "$ROUTING_RESULT" != success ]]; then
            echo "::error::CI routing=$ROUTING_RESULT"
            exit 1
          fi
          if [[ "$DELIVERY_RESULT" != success ]]; then
            echo "::error::Delivery matrix freshness=$DELIVERY_RESULT"
            exit 1
          fi
          if [[ "$CONTROLLER_RESULT" != success ]]; then
            echo "::error::Node Controller image evidence=$CONTROLLER_RESULT"
            exit 1
          fi
          case "$CONTROLLER_REQUIRED" in
            true|false) ;;
            *) echo '::error::Missing or invalid Node Controller image scope'; exit 1 ;;
          esac
          case "$MODE" in
            docs)
              checks=skipped; coordination=skipped; web=skipped; deployment=skipped;
              acceptance=skipped ;;
            web)
              checks=success; coordination=skipped; web=success; deployment=skipped;
              acceptance=skipped ;;
            no-db)
              checks=success; coordination=skipped; web=success; deployment=success;
              acceptance=success ;;
            full)
              checks=success; coordination=success; web=success; deployment=success;
              acceptance=success ;;
            *)
              echo "::error::Missing or invalid CI scope"
              exit 1 ;;
          esac
          if [[ "$CHECKS_RESULT" != "$checks" || "$COORDINATION_RESULT" != "$coordination" ||
                "$WEB_RESULT" != "$web" || "$DEPLOYMENT_RESULT" != "$deployment" ||
                "$ACCEPTANCE_RESULT" != "$acceptance" ]]; then
            echo "::error::Scope=$MODE; Python=$CHECKS_RESULT; PG/InnoDB=$COORDINATION_RESULT; Web=$WEB_RESULT; deployment=$DEPLOYMENT_RESULT; acceptance=$ACCEPTANCE_RESULT"
            exit 1
          fi
          echo "Verified scope=$MODE; inapplicable lanes are not application-test evidence."

  web:
    name: "Web: lint, types, tests, build and accessibility"
    needs: [changes]
    if: ${{ needs.changes.outputs.mode == 'full' || needs.changes.outputs.mode == 'web' || needs.changes.outputs.mode == 'no-db' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc

      - name: Activate pnpm
        run: |
          npm install --global --allow-scripts=pnpm pnpm@${PNPM_VERSION}

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify OpenAI JavaScript SDK contract parity
        run: pnpm test:contracts-sdk

      - name: Check Web and configuration formatting with Prettier
        run: pnpm format:check

      - name: Lint Web code and validate design tokens
        run: pnpm lint

      - name: Check workspace TypeScript types
        run: pnpm typecheck

      - name: Run workspace unit and component tests
        run: pnpm test

      - name: Build workspace packages and Web applications
        run: pnpm build

      - name: Install Chromium headless shell for accessibility checks
        run: python3 scripts/dev-env/prepare-ci-browser.py

      - name: Check rendered accessibility and contrast
        id: a11y
        run: pnpm test:a11y

      - name: Preserve accessibility evidence
        if: ${{ !cancelled() && (steps.a11y.outcome == 'success' || steps.a11y.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: web-accessibility-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: error
          retention-days: 7

  deployment:
    name: "Compose: configuration validation"
    needs: [changes]
    if: ${{ needs.changes.outputs.mode == 'full' || needs.changes.outputs.mode == 'no-db' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate Compose configuration without starting services
        run: |
          docker compose \
            --env-file deploy/compose.env.example \
            -f deploy/compose.yaml \
            config --quiet

      - name: Validate opt-in job-dispatch Compose configuration
        run: |
          docker compose \
            --env-file deploy/compose.env.example \
            -f deploy/compose.yaml \
            --profile job-dispatch \
            config --quiet

  # `scripts/dev-env/reference-acceptance.py` is the operator's single command for
  # deciding whether the reference deployment works, but no job executed it: the
  # tests/ci cases drive it through a fake Runner, so an entry point that only
  # works under stubs could merge untouched. This job runs the real process the way
  # an operator does, then checks the entry's *structure* with
  # `scripts/dev-env/ci-entry-guard.py`.
  #
  # What "structure" means here, and what it does not mean. The guard proves four
  # things and claims only those: (1) every `<ctx>.mutate(...)` command the entry
  # shipped is still present, at the site the anchored registry names, with an
  # evidence pointer that survives (`sites`); (2) every registered pure judgement
  # function still rejects a failing input (`probe`); (3) the `read` boundary can be
  # decided statically - a literal argv or a registered argv builder - and carries
  # no write word, because the dry-run really executes `read` commands; (4) the
  # workflow still runs all four guard subcommands, each as the first command of
  # its step, so a `echo`-only replacement cannot pass (`wiring`). It does NOT
  # prove a condition is correct: an inverted `if` that still reads `.ok` is
  # invisible to an AST, which is why the judgement itself stays with the fake
  # Runner cases in tests/ci and with a real apply run. `probe` only covers the
  # registered pure functions, not `step_*` bodies.
  #
  # Every registration (sites, read arguments, write words, probe cases, deferrals,
  # self-test fixtures) is mirrored into `docs/operations/reference-acceptance.md`
  # inside an anchor block that the guard compares on every run, so deleting a row
  # or shrinking a word list is red unless the documentation changes in the same
  # diff. A shape the guard cannot decide is registered with a reason and an
  # evidence pointer instead of forcing the author to bend the code.
  #
  # Coverage boundary: `--dry-run` executes the real `tools` step (docker/compose/
  # uv versions, the compose-derived `${KEY:?}` set plus the entry's own required
  # keys, compose rendering, three distinct Job DSN identities), the migration
  # head derived from the revision graph, the bucket-name derivation, the resolved
  # `--profile job-dispatch` compose document that stack/gate read, and the private
  # input scan (JSON parse, result-bucket agreement, VAD digest) against synthetic
  # inputs derived from `deploy/compose.yaml`. It plans and never runs a mutating
  # command: those write state or need a real engine, so a decision that needs a
  # live database, Docker or a model is still only exercised by an apply run and by
  # the fake-Runner cases in tests/ci.
  #
  # The negative control makes "green" mean something. Without it the positive run
  # would stay green even if the entry swallowed every failure, so a corrupted
  # environment must still exit non-zero and name the failing step. The job
  # therefore covers what "Compose: configuration validation" does not: not the
  # Compose file, but the Python entry point that reads it.
  reference_acceptance:
    name: "Deploy: reference acceptance entry (dry-run execution)"
    needs: [changes]
    if: ${{ needs.changes.outputs.mode == 'full' || needs.changes.outputs.mode == 'no-db' }}
    runs-on: ubuntu-24.04
    # The entry point plus the four structural guards measured under 2 s; checkout,
    # setup-uv and the three `docker compose config` renders dominate. The job runs
    # beside python_checks and integration_shards, so it adds no critical-path
    # minutes; the ceiling only bounds a hung docker daemon.
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Verify the workflow still executes every structural guard
        # `wiring` requires each guard subcommand to be the first command of its
        # step, so replacing a step with an `echo` that merely mentions the command
        # is red instead of green.
        run: |
          python3 scripts/dev-env/ci-entry-guard.py wiring

      - name: Prepare the acceptance environment from the committed example
        run: |
          cp deploy/compose.env.example deploy/compose.env
          cat >> deploy/compose.env <<'EOF'

          # CI overlay: the three Job DSNs are blank in the committed example
          # because the base topology must render without them; the entry point
          # requires all three to name distinct roles.
          SPEECHNEXUS_JOB_WRITER_DATABASE_URL=postgresql://sn_job_writer:change-me-job-writer@postgres:5432/speechnexus
          SPEECHNEXUS_JOB_ADMISSION_DATABASE_URL=postgresql://sn_job_admission:change-me-job-admission@postgres:5432/speechnexus
          SPEECHNEXUS_JOB_DISPATCH_DATABASE_URL=postgresql://sn_job_dispatch:change-me-job-dispatch@postgres:5432/speechnexus
          EOF
          python3 - <<'PY'
          import hashlib
          import json
          import re
          import shutil
          from pathlib import Path

          # Synthetic private inputs under the directory the committed example env
          # file names, so the stack step's static scan runs against complete
          # inputs. Every name is derived from deploy/compose.yaml: adding a
          # gateway lane, renaming the VAD model or moving the private directory
          # needs no change here. Comment lines are skipped: a compose comment that
          # mentions a private path is not a mount.
          root = Path(".")
          env_example = (root / "deploy/compose.env.example").read_text(encoding="utf-8")
          match = re.search(r"^SPEECHNEXUS_PRIVATE_CONFIG_DIR=(.+)$", env_example, re.MULTILINE)
          # The compose variable is resolved next to deploy/compose.yaml, so a
          # relative value is anchored at deploy/ rather than at the repo root.
          configured = (match.group(1).strip().strip('"') if match else "./.runtime/private")
          configured_path = Path(configured)
          private = (
              configured_path if configured_path.is_absolute() else root / "deploy" / configured_path
          )
          private.mkdir(parents=True, exist_ok=True)
          compose = (root / "deploy/compose.yaml").read_text(encoding="utf-8")
          code_lines = [
              line for line in compose.splitlines() if not line.lstrip().startswith("#")
          ]
          targets = set(
              re.findall(r"/run/speechnexus-private/([A-Za-z0-9._-]+)", "\n".join(code_lines))
          )
          if not targets:
              raise SystemExit(
                  "deploy/compose.yaml 没有挂载任何 /run/speechnexus-private 文件；"
                  "CI 无法构造私有输入，先确认 compose 的私有配置挂载"
              )
          missing = []
          for name in sorted(targets):
              stem = name.removesuffix(".json")
              example = root / "deploy/private" / f"{stem}.example.json"
              if example.is_file():
                  shutil.copyfile(example, private / name)
                  continue
              # A mount without a committed example is not a reason to fail the
              # job: the dry-run only parses the JSON configs, so synthesize a
              # placeholder and say so in the job summary.
              if name.endswith(".json"):
                  (private / name).write_text("{}\n", encoding="utf-8")
              else:
                  (private / name).write_bytes(b"")
              missing.append(name)
          if missing:
              print(f"::warning::私有挂载没有 committed 示例，已合成占位: {', '.join(missing)}")
          # Lane configs name their VAD model and its digest; satisfy both from the
          # file each lane asks for, so a renamed model stays green.
          for config_path in sorted(private.glob("*.json")):
              try:
                  document = json.loads(config_path.read_text(encoding="utf-8"))
              except json.JSONDecodeError:
                  continue
              if not isinstance(document, dict):
                  continue
              model = document.get("vad_model_file")
              if not isinstance(model, str) or not isinstance(document.get("vad_model_sha256"), str):
                  continue
              host = private / model.removeprefix("/run/speechnexus-private/")
              host.parent.mkdir(parents=True, exist_ok=True)
              host.write_bytes(b"speechnexus synthetic vad model for the CI dry-run\n")
              document["vad_model_sha256"] = hashlib.sha256(host.read_bytes()).hexdigest()
              config_path.write_text(json.dumps(document, indent=2) + "\n", encoding="utf-8")
          print("private inputs:", sorted(item.name for item in private.rglob("*") if item.is_file()))
          PY

      - name: Execute the reference acceptance entry in dry-run mode
        env:
          SN_ADMIN_DSN: postgresql://speechnexus:change-me-local-postgres@postgres:5432/speechnexus
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/reference-acceptance-dry-run.log"
          started="$SECONDS"
          code=0
          python3 scripts/dev-env/reference-acceptance.py --dry-run 2>&1 | tee "$log" || code=$?
          deferred="$(grep -c '待输入: ' "$log" || true)"
          {
            echo "### Reference acceptance entry (dry-run)"
            echo ""
            echo "| metric | value |"
            echo "| --- | --- |"
            echo "| entry exit | $code |"
            echo "| entry wall clock | $((SECONDS - started))s |"
            echo "| deferred inputs | ${deferred} (each must be declared in ci-entry-guard.py) |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$code" -ne 0 ]]; then
            echo "::error::reference-acceptance.py --dry-run exited $code"
            exit "$code"
          fi

      - name: Verify the documented output contract and declared deferred inputs
        # `log` asserts the machine-readable contract written down in
        # docs/operations/reference-acceptance.md: the `steps= order= mode=` header,
        # one `[i/N] <ident> —` line per step, a `结论:` line per step, the
        # `待输入:` deferral lines, and the final verdict whose `pending=` must equal
        # the number of deferral lines. Deferrals are matched by the stable slugs in
        # DECLARED_DEFERRALS, so clarifying the wording stays green while a new
        # deferral has to be registered with one line.
        run: |
          python3 scripts/dev-env/ci-entry-guard.py log \
            --log "$RUNNER_TEMP/reference-acceptance-dry-run.log"

      - name: Check the mutating surface against the registered site inventory
        # The dry-run never executes `ctx.mutate`, so it cannot see a deleted write
        # command. `sites` enumerates every `<ctx>.mutate(...)` call and compares it
        # with MUTATE_SITES: a command that disappeared or appeared is red, a result
        # that is thrown away is red, and so is a `read` whose argv cannot be decided
        # statically or carries a write word (`compose run/up`, `sh -c`, ...).
        run: |
          python3 scripts/dev-env/ci-entry-guard.py sites

      - name: Probe the registered pure judgement functions
        # `--dry-run` returns from every state-changing step before judging, so an
        # apply-path judgement that was emptied (migration_verify returning None
        # forever) would stay green. `probe` imports the entry and calls the
        # functions registered in PROBE_CASES with inputs that must fail; deleting a
        # case, or the implementation behind it, is red because the registry and its
        # documentation anchor are compared on every run.
        run: |
          python3 scripts/dev-env/ci-entry-guard.py probe

      - name: Reject a corrupted environment instead of passing quietly
        env:
          # The same shell-only admin DSN the positive run uses, so the only
          # corruption this control introduces is the blanked compose key.
          SN_ADMIN_DSN: postgresql://speechnexus:change-me-local-postgres@postgres:5432/speechnexus
        run: |
          broken="$RUNNER_TEMP/reference-acceptance-broken.env"
          cp deploy/compose.env "$broken"
          # POSTGRES_PASSWORD is a compose `${KEY:?}` key, not an entry-owned extra:
          # it cannot be relaxed without breaking compose rendering, so this control
          # keeps working when the entry's own required-key set legitimately changes.
          grep -v '^POSTGRES_PASSWORD=' deploy/compose.env > "$broken"
          echo 'POSTGRES_PASSWORD=' >> "$broken"
          code=0
          python3 scripts/dev-env/reference-acceptance.py --dry-run --env-file "$broken" \
            > "$RUNNER_TEMP/reference-acceptance-broken.log" 2>&1 || code=$?
          cat "$RUNNER_TEMP/reference-acceptance-broken.log"
          if [[ "$code" -eq 0 ]]; then
            echo "::error::the entry accepted a blank POSTGRES_PASSWORD (exit 0)"
            exit 1
          fi
          if ! grep -q 'FAIL step=tools' "$RUNNER_TEMP/reference-acceptance-broken.log"; then
            echo "::error::the corrupted environment was not attributed to step=tools"
            exit 1
          fi
          echo "negative control: exit=$code step=tools"
