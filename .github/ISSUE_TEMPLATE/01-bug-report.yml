name: 缺陷报告 / Bug report
description: 报告可复现或间歇出现的问题 / Report unexpected behavior.
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有的 open / closed issues；标题概括具体问题。可以使用中文或英文。
        Search existing issues first. Chinese and English are both welcome.
        仅提供合成或最小脱敏示例；不要上传凭据、私有地址、私人音频或完整业务转写。
        Use synthetic or redacted examples; omit credentials, private addresses, audio, and transcripts.
        安全漏洞请先查看仓库 Security 页的私密报告入口；若未开放，仅公开请求私密联系方式。
        For security vulnerabilities, check the Security tab for private reporting; otherwise request a private contact without disclosing details.
  - type: textarea
    id: behavior
    attributes:
      label: 预期与实际结果 / Expected and actual behavior
      description: 说明执行了什么、期望什么、实际发生什么，以及影响。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤 / Steps to reproduce
      description: 提供最小命令或操作步骤；无法稳定复现时说明触发条件与频率。
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 版本与环境 / Version and environment
      description: 填写 release/tag/commit 或镜像版本、OS/架构和部署方式；仅补充相关浏览器、引擎或模型版本。无法确定时写 unknown。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 补充证据 / Additional evidence
      description: 可选：脱敏错误摘要、最小日志、截图或相关 issue；请勿粘贴完整环境变量或业务数据。
