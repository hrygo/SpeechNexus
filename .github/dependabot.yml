version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    patterns: ["*"]
    multi-ecosystem-group: dependencies

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    patterns: ["*"]
    multi-ecosystem-group: dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    patterns: ["*"]
    multi-ecosystem-group: dependencies

  - package-ecosystem: docker
    directory: /deploy/images
    schedule:
      interval: weekly
    patterns: ["*"]
    multi-ecosystem-group: dependencies

  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
    patterns: ["*"]
    multi-ecosystem-group: dependencies
