openapi: 3.1.0
info:
  title: SpeechNexus public speech API
  version: 0.1.0.dev18
  description: |
    SpeechNexus public speech protocol.

    The OpenAI-compatible subset is limited to the paths, fields, formats, and
    events explicitly declared here. A standard OpenAI SDK can use this API by
    setting base_url to <deployment>/v1 and supplying any api_key value unless
    the deployment enables a shared service key. SpeechNexus enhancements live
    under /v1/nexus and the optional `nexus` request field; a standard request
    never needs an enhancement wrapper. Unsupported standard parameters are
    rejected with 422 `unsupported_parameter`, never silently ignored.

    Realtime has two connection modes at GET /v1/realtime: a pre-created
    nexus session (`session_id`) and a compatibility transcription session
    opened with `model`. Both accept the declared standard transcription
    event subset. TTS, previews, metadata, and operation coordination remain
    nexus.* events and are available only in a nexus-created session.

    One admission cause has one code per surface, and the two surfaces group them
    differently: the Job surface separates the four engine-side causes as
    `engine_not_ready`, `engine_state_mismatch`, `engine_resource_disabled` and
    `recipe_not_admitted`, while the voice-draft surface answers all four as
    `voice_draft_engine_unavailable` because the client action is identical and the
    message names the cause. Both are 503 with `retryable: false`.
servers:
  - url: /
security:
  - SharedServiceKey: []
  - {}
tags:
  - name: openai-compatible
  - name: capabilities
  - name: profiles
  - name: voices
  - name: jobs
  - name: operations
  - name: assets
  - name: artifacts
  - name: realtime
  - name: voice-creation
  - name: version
paths:
  /v1/models:
    get:
      tags: [openai-compatible]
      operationId: listModels
      summary: List published logical models
      description: |
        Returns the OpenAI model-list shape. The `nexus` object on each model
        separates binding revision, support, quality qualification, and a static
        readiness projection: the readiness block reports only the facts this
        catalogue has established, never a live verdict for a workspace. This
        endpoint never exposes model paths or endpoints. The per-workspace surface
        is `GET /v1/nexus/jobs/admission-readiness`, which returns the live verdict
        for one workspace by running the same predicate a create runs.
      parameters:
        - $ref: "#/components/parameters/XRequestId"
        - name: If-None-Match
          in: header
          required: false
          description: |
            Return `304` without a body when the supplied validator still
            matches the current catalogue.
          schema:
            type: string
      responses:
        "200":
          description: Published logical models.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelList"
        "304":
          description: The supplied ETag still matches the current catalogue.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/models/{model}:
    get:
      tags: [openai-compatible]
      operationId: retrieveModel
      summary: Retrieve one published logical model
      parameters:
        - name: model
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - $ref: "#/components/parameters/XRequestId"
        - name: If-None-Match
          in: header
          required: false
          description: |
            Return `304` without a body when the supplied validator still
            matches the current revision of this model entry.
          schema:
            type: string
      responses:
        "200":
          description: Published logical model.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Model"
        "304":
          description: The supplied ETag still matches this model entry.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/audio/transcriptions:
    post:
      tags: [openai-compatible]
      operationId: createTranscription
      summary: Create a synchronous file transcription
      description: |
        OpenAI Audio transcription subset. `file`, `model`, `language`,
        `prompt`, `response_format`, and `timestamp_granularities[]` are
        declared. `response_format=verbose_json` is accepted only when the
        selected binding can provide real segment and word evidence; a lack of
        evidence returns 422 `unsupported_parameter` instead of fabricated
        timestamps. The optional `nexus` form field is a JSON string and is
        never required for standard clients.
      parameters:
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/TranscriptionRequest"
            encoding:
              file:
                contentType: application/octet-stream
              nexus:
                contentType: application/json
      responses:
        "200":
          description: |
            JSON for `json` / `verbose_json`; plain text for `text`, `srt`, and
            `vtt`. The response shape follows the requested format.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
            X-Operation-ID:
              $ref: "#/components/headers/XOperationId"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Transcription"
                  - $ref: "#/components/schemas/TranscriptionVerbose"
            text/plain:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/audio/speech:
    post:
      tags: [openai-compatible]
      operationId: createSpeech
      summary: Create synchronous text-to-speech audio
      description: |
        OpenAI Audio speech subset. The declared response formats are mp3, wav,
        and raw PCM. `stream_format` accepts only `audio` in P0; `sse` is
        rejected as unsupported. A standard request returns complete audio.
        Chunked audio delivery is a nexus realtime capability, not an OpenAI
        speech response mode.
      parameters:
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpeechRequest"
      responses:
        "200":
          description: Complete audio in the negotiated format.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
            X-Operation-ID:
              $ref: "#/components/headers/XOperationId"
            X-Audio-Format:
              $ref: "#/components/headers/XAudioFormat"
            X-Sample-Rate-Hz:
              $ref: "#/components/headers/XSampleRateHz"
            X-Channels:
              $ref: "#/components/headers/XChannels"
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
            audio/wav:
              schema:
                type: string
                format: binary
            audio/pcm:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/SpeechMethodNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/nexus/version:
    get:
      tags: [version]
      operationId: getVersionIdentity
      summary: Report the API version and canonical contract digest
      description: |
        Returns the API package version and the digest of the canonical contract
        sources this process was generated from. A browser consumer bakes in the
        same digest at build time and compares it on start-up, so a deployment
        whose frontend and API came from different contract revisions shows the
        difference instead of interpreting new responses with old types.

        The digest covers the machine contract sources under `contracts/` (every
        `*.yaml` and `*.json` file): SHA-256 over each file's relative path and
        its own SHA-256, in sorted path order. It is not a git revision and
        exposes no endpoint, identity, credential or filesystem path.
        `scripts/dev-env/print-contract-digest.py` recomputes it offline. A
        consumer must never cache this response.
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: API package version and canonical contract digest.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                const: "no-store"
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionIdentity"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /v1/nexus/capabilities:
    get:
      tags: [capabilities]
      operationId: getCapabilities
      summary: Get an atomic capability snapshot
      description: |
        Returns one consistent snapshot for the deployment, workspace, catalog,
        and policy revision. The endpoint is side-effect free: it never loads,
        warms, downloads, or evicts a model. `ETag` covers the same revisions.
      parameters:
        - $ref: "#/components/parameters/WorkspaceIdQuery"
        - $ref: "#/components/parameters/XRequestId"
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Current capability snapshot.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilitySnapshot"
        "304":
          description: The supplied ETag still matches the current snapshot.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/nexus/profiles:
    get:
      tags: [profiles]
      operationId: listProfiles
      summary: List published scenario profiles
      description: |
        Lists published revisions in stable profile ID / decimal revision order.
        Drafts are excluded. workspace_id is compatibility context, not isolation.
        A cursor identifies the last returned profile/revision; pages are live reads.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/WorkspaceIdQuery"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Published profile revisions.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/ProfileReadMethodNotAllowed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/nexus/profiles/{profile_id}/revisions/{revision}:
    get:
      tags: [profiles]
      operationId: getProfileRevision
      summary: Get one immutable scenario profile revision
      description: |
        Public readers may fetch published, retired, or disabled revisions.
        Draft revisions are visible only through the administration API.
        An existing draft returns 409 profile_not_published; absence returns 404.
      parameters:
        - $ref: "#/components/parameters/ProfileIdPath"
        - $ref: "#/components/parameters/RevisionPath"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Immutable profile revision.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "./scenario-profile.schema.json"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/ProfileReadMethodNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v2/nexus/profiles:
    get:
      tags: [profiles]
      operationId: listPublishedProfiles
      summary: List published scenario profiles with the active family revision
      description: |
        v2 public surface. It reports the same published revisions as v1 and adds
        the nullable family default pointer; the v1 ProfileSummary and ProfileList
        shapes remain unchanged. Drafts are excluded. Revisions are ordered by
        profile ID and decimal revision, and a cursor identifies the last returned
        item. Pages are live reads, not a cross-page snapshot. workspace_id is
        compatibility context, not isolation.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/WorkspaceIdQuery"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Published profile revisions with the nullable family default.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishedProfileList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/ProfileReadMethodNotAllowed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/nexus/voices:
    get:
      tags: [voices]
      operationId: listVoices
      summary: List published voices visible to the deployment
      description: |
        Invalid, unknown or duplicate query parameters return a non-retryable
        400 voice_invalid_request before reading the catalogue, even when the
        catalogue is unavailable. Correct the request before sending it again.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/WorkspaceIdQuery"
        - name: language
          in: query
          required: false
          schema:
            type: string
            maxLength: 35
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Published voice revisions.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceList"
        "400":
          $ref: "#/components/responses/VoiceCatalogueBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/nexus/voices/{voice_id}/revisions/{revision}:
    get:
      tags: [voices]
      operationId: getVoiceRevision
      summary: Get one immutable published voice revision
      description: |
        Invalid path values or any query parameter return a non-retryable
        400 voice_invalid_request before reading the catalogue. A published fact
        whose exact qualification document is missing or inconsistent is
        unavailable (retryable 503), never a confirmed missing revision (404).
      parameters:
        - $ref: "#/components/parameters/VoiceIdPath"
        - $ref: "#/components/parameters/RevisionPath"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Immutable published voice revision.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "./voice-resource.schema.json#/$defs/VoiceRevision"
        "400":
          $ref: "#/components/responses/VoiceCatalogueBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/nexus/voices/{voice_id}/revisions/{revision}/retirements:
    post:
      tags: [voices]
      operationId: retireVoiceRevision
      summary: Retire or disable a published voice revision
      description: |
        `retire` stops new references while fixed in-flight jobs with a valid
        dependency lease may finish. `disable` is an emergency action that also
        cancels confirmed in-flight use; unknown cleanup remains quarantined.
      parameters:
        - $ref: "#/components/parameters/VoiceIdPath"
        - $ref: "#/components/parameters/RevisionPath"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoiceRetirementRequest"
      responses:
        "200":
          description: Updated voice revision state.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "./voice-resource.schema.json#/$defs/VoiceRevision"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          description: >-
            The deployment has no lifecycle writer or publication storage is
            unavailable. The operation is implemented; this 503 is an outage,
            not a permanently unimplemented operation.

            `voice_draft_unavailable` is `retryable: false`: the store refused this
            dispatch, so repeating it is answered by the same refusal. The operation
            is still implemented -- an outage, not a permanently unimplemented
            operation -- and the value matches the Job surface's `job_unavailable`.
            `voice_draft_outcome_unknown` stays `true`: the same key is replayed
            because the outcome is unknown, which is a recovery, not a permission.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                const: "no-store"
            X-Should-Retry:
              required: true
              description: |
                Mirrors the body's `retryable`: true for
                `voice_draft_outcome_unknown`, false for
                `voice_draft_unavailable`.
              schema:
                type: string
                enum: ["true", "false"]
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [error]
                properties:
                  error:
                    $ref: "./shared/errors.schema.json#/$defs/ErrorBody"
                allOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - properties:
                      error:
                        properties:
                          code:
                            enum:
                              - voice_catalogue_unavailable
                              - voice_retirement_unavailable
                          type:
                            const: service_unavailable_error
                          retryable:
                            enum: [true, false]
                          nexus: false
  /v1/nexus/pronunciation-sets:
    get:
      tags: [voices]
      operationId: listPronunciationSets
      summary: List pronunciation sets
      description: |
        Lists family heads by ascending opaque `id`. The cursor is the canonical
        unpadded base64 form of the last returned id; a cursor that does not
        re-encode to the same bytes is rejected rather than silently moving the
        page. `limit` is 1-100 and defaults to 50. `has_more` is true only when a
        further page exists, and `next_cursor` is then that page's opaque cursor.

        `head_revision` is the family's latest immutable revision (the allocation
        head). `status` is computed from the publication ledger for that exact
        revision: `published` only when a `speech_publications` row exists for
        `(id, head_revision)`, otherwise `draft`. A draft appended above a
        published revision therefore lists with the new revision and `draft`; the
        older published revision keeps its own published fact and stays readable
        through the fixed-revision GET. `retired` is reserved for a later
        retirement command and is not produced by this deployment. An empty
        collection is a successful 200 with no entries, never a 404.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Pronunciation-set heads.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PronunciationList"
        "400":
          $ref: "#/components/responses/PronunciationInvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/PronunciationCollectionForbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/PronunciationContractViolation"
        "503":
          description: >-
            Draft storage is unavailable. A list read carries no body and may be
            repeated; this is an outage, not a permanently unimplemented operation.

            `voice_draft_unavailable` is `retryable: false`: the store refused this
            dispatch, so repeating it is answered by the same refusal. The operation
            is still implemented -- an outage, not a permanently unimplemented
            operation -- and the value matches the Job surface's `job_unavailable`.
            `voice_draft_outcome_unknown` stays `true`: the same key is replayed
            because the outcome is unknown, which is a recovery, not a permission.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                const: "no-store"
            X-Should-Retry:
              required: true
              description: |
                Mirrors the body's `retryable`: true for
                `voice_draft_outcome_unknown`, false for
                `voice_draft_unavailable`.
              schema:
                type: string
                enum: ["true", "false"]
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - properties:
                      error:
                        properties:
                          code:
                            const: pronunciation_unavailable
                          type:
                            const: service_unavailable_error
                          retryable:
                            enum: [true, false]
                          nexus: false
    post:
      tags: [voices]
      operationId: createPronunciationRevision
      summary: Create an immutable pronunciation-set revision
      description: |
        Omit `id` to create a new pronunciation set. Supply `id` and
        `expected_revision` to append a revision to an existing set. Entries are
        validated and stored as one immutable revision; an existing revision is
        never modified and this operation never selects a default, executes TTS or
        qualifies pronunciation.

        `publish` defaults to `true` and is atomic: the same transaction writes
        the immutable revision, its `speech_publications` row and the selected
        `speech_publication_heads` row. A failure anywhere rolls all of them back,
        so a client can never observe a publication without its revision or a
        published-status revision without a ledger row. `publish: false` writes
        only the revision and leaves it a private draft. The returned `status` is
        `published` for the atomic case and `draft` otherwise.

        A deployment that has not configured the atomic-publication identity
        answers 422 `pronunciation_publication_not_supported` for a request that
        did not already commit; a keyed replay of a committed publication still
        returns 200. Send `publish: false` for draft-only use there.

        With an `Idempotency-Key`, the same canonical intent replays the original
        revision with 200 and a different intent returns 409
        `pronunciation_idempotency_conflict`. Without a key, a submission whose
        commit cannot be confirmed returns 409 `pronunciation_outcome_unknown`
        because a resubmission would be a new intent. An append whose
        `expected_revision` is not the current allocation head returns 409
        `pronunciation_configuration_changed`; the compare-and-swap happens under
        the family head lock in the same transaction, never as a MAX aggregate,
        and exactly one concurrent publisher wins.
      parameters:
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PronunciationCreateRequest"
      responses:
        "201":
          description: Immutable pronunciation revision created (published when requested).
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "./voice-resource.schema.json#/$defs/PronunciationRevision"
        "200":
          description: Idempotent replay of the same original intent.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "./voice-resource.schema.json#/$defs/PronunciationRevision"
        "400":
          $ref: "#/components/responses/PronunciationInvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/PronunciationCollectionForbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/PronunciationSetConflict"
        "422":
          $ref: "#/components/responses/PronunciationPublicationNotSupported"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/PronunciationContractViolation"
        "503":
          description: >-
            Draft storage is unavailable. Only a request that carries its
            original Idempotency-Key may be replayed unchanged: replaying that key
            recovers the committed revision instead of allocating a second one, and
            `voice_draft_outcome_unknown` is the code that says so.

            `voice_draft_unavailable` is `retryable: false`: the store refused this
            dispatch, so repeating it is answered by the same refusal. The operation
            is still implemented -- an outage, not a permanently unimplemented
            operation -- and the value matches the Job surface's `job_unavailable`.
            `voice_draft_outcome_unknown` stays `true`: the same key is replayed
            because the outcome is unknown, which is a recovery, not a permission.
          headers:
            Cache-Control:
