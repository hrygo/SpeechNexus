[project]
name = "speechnexus-backend"
version = "0.1.0.dev0"
description = "SpeechNexus speech service and administrative API"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "av>=19,<20",
  "fastapi>=0.159.1,<0.160",
  "httpx>=0.28.1,<0.29",
  "minio>=7.2.20,<8",
  "psycopg-pool>=3.3,<4",
  "psycopg[binary]>=3.3.6,<4",
  "pydantic>=2.14.1,<3",
  "pydantic-settings>=2.16.1,<3",
  "python-multipart>=0.0.20,<0.1",
  "rfc8785>=0.1.4,<0.2",
  "speechnexus-contracts",
  "uvicorn[standard]>=0.54,<0.55",
]

[project.scripts]
speechnexus-api = "speechnexus_backend.main:main"
speechnexus-runtime-delivery-worker = "speechnexus_backend.runtime_delivery_worker:main"
speechnexus-asset-maintain = "speechnexus_backend.asset_worker:main"
speechnexus-job-migrate = "speechnexus_backend.speech.infrastructure.migrate_jobs:main"

[project.optional-dependencies]
migrations = ["alembic>=1.18,<2"]

[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speechnexus_backend"]

[tool.uv.sources]
speechnexus-contracts = { workspace = true }
