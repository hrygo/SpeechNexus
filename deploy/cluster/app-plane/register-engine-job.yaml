# One-shot registration of the file-ASR engine instance that runs on MegaCube.
#
# The engine is reached by its cluster Service (`engine-service.yaml`), not by a Pod
# IP: the address changes on every generation, and a registration that carries one
# goes stale silently. Registration runs in the application plane because the
# coordination database is reachable from there. The private recipe is copied to
# /tmp with the mode the loader requires: a Secret mount cannot satisfy "owned by
# the running uid and 0600".
apiVersion: batch/v1
kind: Job
metadata:
  name: engine-register
  namespace: speechnexus
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: register
          image: ${PYTHON_IMAGE}
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - install -m 600 /private/transcription-recipe.json /tmp/transcription-recipe.json &&
              exec speechnexus-register-engine
              --generation 1
              --node node-megacube-1
              --gateway gateway-megacube-1
              --instance instance-asr-3
              --workspace workspace-default
              --max-attempts 8
              --host-capacity 25769803776,0,0,2400,0,0
          env:
            - name: SPEECHNEXUS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: registration-credentials
                  key: SPEECHNEXUS_REGISTRATION_DATABASE_URL
            - name: SPEECHNEXUS_DATABASE_SCHEMA
              value: speech
            - name: SPEECHNEXUS_TRANSCRIPTION_RECIPE_FILE
              value: /tmp/transcription-recipe.json
            - name: SPEECHNEXUS_ENGINE_HEALTH_URL
              value: http://engine-asr-1:18190/health
          volumeMounts:
            - name: private-config
              mountPath: /private
              readOnly: true
      volumes:
        - name: private-config
          secret:
            secretName: private-config
            defaultMode: 0444
