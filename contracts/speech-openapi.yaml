        kind:
          $ref: "#/components/schemas/OperationKind"
        status:
          $ref: "#/components/schemas/OperationStatus"
        cleanup_state:
          $ref: "#/components/schemas/CleanupState"
    EffectiveConfiguration:
      type: object
