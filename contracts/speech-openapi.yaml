  /v1/nexus/jobs:
    post:
      tags: [jobs]
      operationId: createJob
      summary: Create a durable ASR, TTS, or voice-creation job
      description: |
        The request discriminator is `kind`. The service resolves mutable
        defaults once, pins the model binding and all dependent revisions, and
        returns an immutable effective configuration. A repeated Idempotency-Key
        with the same canonical intent replays the original job; a different
        intent returns 409 `idempotency_conflict`.

        TTS requests may supply `model_binding` as an exact immutable reference.
        With this field, `model` must equal that binding's `logical_model` and
        the binding must support `tts_file`. A new request accepts only the
        exact authoritative publication head (including its internal revision ID),
        and that revision must be published and non-retired. The head may move
        back to an older non-retired revision; a cleared head selects nothing.
        There is no fallback to the maximum published revision. Missing/unpublished,
        retired, unselected, mismatched-model and unsupported-task pins return
        422 `model_binding_not_published`, `model_binding_retired`,
        `model_binding_not_current`, `model_binding_mismatch` and
        `model_binding_task_not_supported`, respectively. These errors are not
        retryable unchanged. Obtain a fresh selection for a new intent only
        after resolving any earlier unknown submission.

        `workspace_id` is optional. Omitting it selects `workspace-default`,
        the shared workspace the deployment seeds; the response reports the
        resolved `workspace_id`, and an explicit `workspace-default` is the same
        canonical intent as omitting the field.

        For `asr` and `tts`, the admission operation, attempt, request, lease,
        quota and capacity projections, the coordination claim and every public
        Job row commit in one transaction. A capacity shortage returns 429
        `job_capacity_exhausted` with `Retry-After` and writes no row. Admission
        reserves one attempt against the workspace's quota row, which is
        provisioned by registering an engine for that workspace; a workspace
        that exists but has no quota row returns 422 `workspace_not_configured`
        and writes no row. That refusal is deterministic until an operator
        provisions the workspace: retrying the same request cannot succeed
        beforehand, while the same request under its original idempotency key is
        admitted afterwards. It is deliberately not the 503 `job_unavailable`
        answer, which reports a storage read the store rejected or persisted data
        it cannot reconcile -- a condition retrying cannot fix -- and is therefore
        `retryable: false`. A connection-level failure or a timed-out attempt is
        instead 503 `job_outcome_unknown`, which is `retryable: true`; callers
        must read `retryable` rather than infer it from the status.
        `workspace_not_configured` is likewise never retryable.

        An engine-side refusal has its own answer per cause, so a caller never has
        to read a storage outage into a healthy store. These all write no row, they
        are 503 with `retryable: false` except the concurrency class, and `message`
        states the recovery:

        | code | cause | recovery |
        | --- | --- | --- |
        | `engine_not_ready` | The pinned ready instance is the right one, but its readiness receipt is outside its declared validity window. | Re-sign the receipt (`speechnexus-register-engine --renew-readiness`, or the `engine-readiness` deployment profile), then send the request again under its key. |
        | `engine_state_mismatch` | The pinned runtime state (generation, topology, observation or pool-owner identity) disagrees with the request, or the pinned instance row is gone. | Register the engine again so the receipt and the pinned plan agree. |
        | `engine_resource_disabled` | The instance, its pool, its node or its recipe approval is not active (stopped, draining, outside the approval window). | Restore the instance and its approval, then register the engine again. |
        | `recipe_not_admitted` | The request was assembled from a different recipe than the one approved for the pinned instance. | Register the engine against the approved recipe. |
        | `job_admission_contended` | A quota, instance or host version compare-and-set failed, or the pool-owner fencing token moved. | Retry the same request: it is the one admission code with `retryable: true`, because the concurrent writer finishes and the durable intent survives. |

        None of these is `job_unavailable`, which on this operation reports only the
        Job store refusing the read or the write. A deployment that lets the
        readiness receipt elapse refuses every create with `engine_not_ready` until a
        renewal runs, so the receipt TTL is an operational deadline rather than a
        per-request retry delay. A request whose own admission deadline elapsed
        before it was admitted returns 422 `job_request_expired`, and the deadline is
        part of the pinned intent, so only a new request can succeed. An admission
        counter or clock leaving its declared range returns 500
        `admission_state_invalid`: a deployment defect rather than a refusal, whose
        request must not be replayed as-is. A binding
        whose frozen `execution_defaults` cannot complete every execution
        parameter returns 422 `job_binding_incomplete`; `tts` input
        `text_asset_id` returns 422 `job_text_asset_unsupported` until the
        frozen text-asset material exists. A custom voice from `voice_clone` is
        available for `tts` once its revision is published on the same Base
        binding: admission assembles the published reference material and paired
        transcript as `voice_kind=custom`, and returns 422 `voice_not_published`
        for unpublished, retired or preview-only material. The same 422 also
        applies to a missing or retired builtin voice; this replaces the previous
        503 `job_unavailable` for that client-fixable condition. `voice_design`
        remains preview-only and cannot be selected for `tts`.

        A request that does not match the declared `JobCreateRequest` shape is
        rejected before any admission attempt and creates no Job row: an unknown
        field, an undeclared enum value, or a `tts` inline `text` above the
        declared 4096-character bound returns 422 `unsupported_parameter`. The
        bound is never enforced by splitting, truncating or silently shortening
        the text, so a `tts` Job synthesizes exactly the text it was admitted
        with and at most what `/v1/audio/speech` accepts for one `input`.

        Independent of every field bound, the request body has a byte ceiling.
        It is a deployment setting rather than a contract constant; the
        deployment default is 256 KiB. A body whose declared `Content-Length` or
        received bytes exceed that ceiling is refused before schema validation
        and creates no Job row: 413 `PayloadTooLarge` with code
        `job_request_too_large`, non-retryable. This answer is distinct from the
        422 `unsupported_parameter` above: 413 means the transport body is larger
        than this deployment receives, so the caller must shorten the body or the
        operator must raise the deployment limit; 422 means the request shape or a
        declared field bound was not satisfied. Because the ceiling is
        deployment-configurable, a body accepted at one deployment can be refused
        at another; the contract does not promise a fixed byte size.

        Original-key replay is checked before mutable publication/workspace
        facts: the same canonical request returns the stored Job even after
        retirement or supersession. A changed pin is another intent and
        conflicts under the same key. After 503 `job_outcome_unknown`, preserve
        the original key and entire request, replay or query the original Job;
        never switch the key/version to recover. Keyless requests have no such
        replay guarantee. A queued Job/effective configuration is a public
        submission fact, not proof of execution, full resource admission or
        engine readiness. Deployments without an assembled planner remain
        fail-closed for dispatch.

        Without `model_binding`, existing resolution is unchanged: this
        implementation uses `model` as the binding object ID and selects its
        current non-retired publication. It does not promise a caller-selected
        version or treat object ID and logical model as interchangeable.
      parameters:
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobCreateRequest"
      responses:
        "202":
          description: Job accepted.
          headers:
            Location:
              description: Relative or absolute job URL.
              schema:
                type: string
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          description: |
            The request is well formed but admission refuses it deterministically.
            Every code here writes no Job row; the recovery differs per code and is
            stated in `message`.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [error]
                properties:
                  error:
                    $ref: "./shared/errors.schema.json#/$defs/ErrorBody"
                allOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - properties:
                      error:
                        properties:
                          code:
                            enum:
                              - unsupported_parameter
                              - job_kind_not_supported
                              - workspace_not_found
                              - workspace_disabled
                              - workspace_not_configured
                              - model_not_published
                              - model_binding_not_published
                              - model_binding_retired
                              - model_binding_not_current
                              - model_binding_mismatch
                              - model_binding_task_not_supported
                              - voice_not_published
                              - profile_not_published
                              - pronunciation_not_found
                              - asset_not_ready
                              - voice_draft_not_candidate
                              - job_binding_incomplete
                              - job_text_asset_unsupported
                              - job_request_expired
        "429":
          # Enumerated, not the shared `TooManyRequests` reference: a create answers
          # exactly one capacity code, and a guard that cannot name it accepts any
          # code as "declared" (#845 review, section 4.3).
          description: |
            Capacity refuses this create: the workspace quota holds every attempt, the
            pinned instance is at its slot bound, or no ready engine instance is
            registered at all. Follow `Retry-After`: a released attempt or slot clears
            it, while the missing-instance arm waits for an operator to register one,
            so an unbounded retry loop sees the same 429.
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            type: string
                            enum: [job_capacity_exhausted]
                          retryable:
                            type: boolean
                            const: true
        "500":
          description: |
            Admission failed an internal invariant (a clock or version counter left
            its declared range). This is a deployment defect rather than a refusal:
            the transaction rolled back, no Job row exists, and the same request must
            not be replayed as-is.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [error]
                properties:
                  error:
                    $ref: "./shared/errors.schema.json#/$defs/ErrorBody"
                allOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - properties:
                      error:
                        properties:
                          code:
                            enum:
                              - admission_state_invalid
        "503":
          description: |
            The create was refused or its outcome is unknown, and the code states
            which: `job_unavailable` is the Job store refusing the read or the write,
            `job_outcome_unknown` is a connection-level failure whose outcome must be
            replayed under the original key, `job_admission_contended` is the one
            retryable admission race, and the `engine_*` and `recipe_not_admitted`
            codes name an engine-side cause with an operator recovery. Retry only
            when `retryable` is true.
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [error]
                properties:
                  error:
                    $ref: "./shared/errors.schema.json#/$defs/ErrorBody"
                allOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - properties:
                      error:
                        properties:
                          code:
                            enum:
                              - job_unavailable
                              - job_outcome_unknown
                              - job_admission_contended
                              - engine_not_ready
                              - engine_state_mismatch
                              - engine_resource_disabled
                              - recipe_not_admitted
    get:
      tags: [jobs]
      operationId: listJobs
      summary: List durable jobs
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/WorkspaceIdQuery"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/JobStatus"
        - name: kind
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/JobKind"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Jobs ordered by (created_at, id).
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/nexus/jobs/admission-readiness:
    get:
      tags: [jobs]
      operationId: getJobAdmissionReadiness
      summary: Report whether a public Job create would be admitted right now
      description: |
        One read-only verdict on whether a create sent at this instant would be
        admitted, so an orchestrator or a monitor can see a deployment that cannot
        admit without reading a refusal out of a create response. This surface
        exists because an elapsed engine readiness receipt refuses every create with
        503 `engine_not_ready` while `/readyz`, the container healthcheck and
        `docker ps` all stay green (#845). `/readyz` deliberately keeps meaning "this
        process can serve traffic": a receipt that elapsed refuses only creation, so
        failing `/readyz` would remove the whole API from a load balancer and answer
        a create-only degradation with a total outage (#828 review B8). The two
        surfaces divide the work: `/readyz` is process and dependency health, this
        route is whether a create is admitted.

        The verdict is one value, never a set. `cause` is the single refusal class a
        create would answer right now for the first admissible binding in ascending
        `binding_revision_id` order, or null when a create for every admissible
        binding would be admitted; `status` is `admitting`
        if and only if `cause` is null, and `admitting` holds if and only if a
        create for every admissible binding sent now would be admitted. "Admissible"
        is a property of the binding, not of this response: the current publication
        head of a published, unretired binding that a create could actually name --
        one whose declared kinds pass every binding gate the create applies before
        admission: the execution block and its timeout, the file-TTS request
        semantics, and the stored plan's agreement with the binding on revision,
        manifest, pool, gateway and node. `voice_validation` needs no execution
        block, so it is admissible on the published binding alone. A create naming a
        binding outside that set is refused before admission runs (a superseded
        revision is `model_binding_not_current`; a binding whose declared kinds all
        fail those gates is `job_binding_incomplete`), so those bindings are neither
        a cause nor an `instances` row here. The create path
        answers one code, so a report naming several could only invent a precedence
        the API does not have -- which of the observed refusals a create reached
        first -- and would let the report describe a class the create never returns.
        Naming one makes "this is the code a create would answer at this instant" the
        only shape the response can take, and the two fields cannot disagree; the
        schema rejects a body that does.

        With no admissible binding the report answers `capacity_exhausted` rather
        than `admitting`: the universal would be vacuously true, but a deployment
        that can admit no create must not read as admitting.

        Every public code that means "this deployment refuses every create" has
        exactly one cause here, and every cause names exactly one of those codes, so
        the two closed sets are equal. That equality is the whole guarantee: a
        refusal class missing from the report would let it answer `admitting` while
        every create is refused (the failure this surface exists to remove), and a
        cause without a declared create code would point an operator at an answer the
        API does not produce.

        The response is `200` whenever the Job surface is assembled, and the verdict
        is in the body. A degraded deployment therefore answers 200 with a cause, and
        the HTTP status of this route means only whether the report could be produced
        -- a 5xx would make "the report is broken" and "admission is degraded"
        identical to a monitor. When this deployment does not assemble the Job
        surface at all, the route answers the same 503 `job_unavailable` every other
        Job route answers in that state.

        Each cause has one create answer and one operator action behind it:

        | cause | what a create would answer |
        | --- | --- |
        | `engine_receipt_expired` | 503 `engine_not_ready`, `retryable: false`. The ready instance the create would pin holds a readiness receipt outside its window. Re-sign it with `speechnexus-register-engine --renew-readiness`; `speechnexus-engine-readiness` prints the remaining window. |
        | `engine_state_mismatch` | 503 `engine_state_mismatch`, `retryable: false`. The pinned instance's stored intent no longer decodes or no longer matches admission's expectation, its generation moved, or the pool owner lease is being reconciled or transferred, so the pin cannot be trusted. Reconcile or re-register the instance. |
        | `engine_resource_disabled` | 503 `engine_resource_disabled`, `retryable: false`. The instance's runtime service state, the host node it runs on, the pool that owns it (its state, its owner identity or its fencing token), the approved recipe (including its approval window) or the runtime template approval is not active. Re-enable the instance, restore the pool owner, or re-approve the recipe. |
        | `capacity_exhausted` | 429 `job_capacity_exhausted` with `Retry-After`. The workspace quota holds every attempt, an instance is at its slot bound, or no ready instance can serve a create: none is registered for the pinned binding, or every registered one is not ready. A released attempt or slot clears it; the missing-instance arms only clear when an instance becomes ready, which is an operator action, so a client that retries forever sees the same 429. A pool that does not admit work or a missing pool-owner identity is `engine_resource_disabled`, not this code. |
        | `workspace_not_found` | 422 `workspace_not_found`. No workspace catalog row exists for the reported workspace. |
        | `workspace_disabled` | 422 `workspace_disabled`. The workspace row exists but is not active. Enable the workspace. |
        | `workspace_not_configured` | 422 `workspace_not_configured`. The workspace exists but has no quota row, so admission has nothing to charge. Registering an engine for the workspace writes one. |
        | `storage_unavailable` | 503 `job_unavailable`, `retryable: false`. The coordination store could not be read on the identity that admits creates, so no other fact could be read either; this cause is the only one reported. |

        The value is the refusal the create path reaches *first*, not a ranking of its
        own: the create path short-circuits, so a deployment that is both past a
        receipt window and out of quota answers one of the two and the report names
        that one. A report that re-ordered the observed refusals would describe a
        refusal the same request never sees.

        Boundaries: the report speaks for the deployment and for the reported
        `workspace_id`, not for one request body. `workspace_id` selects the
        workspace to report on and defaults to the same `workspace-default` a create
        selects by omitting the field; a deployment that creates in another workspace
        must pass it, otherwise the quota counters and the workspace causes describe a
        workspace nothing creates in. A `workspace_id` that is not a valid identifier
        is 400 `invalid_job_request`, the same refusal `GET /v1/nexus/jobs` answers
        for a malformed one. What is *not* classified is every request-shaped refusal
        (`recipe_not_admitted`, `unsupported_parameter`, an unpublished binding, an
        input artifact that is not ready), the single-request answers
        (`job_outcome_unknown`, `job_admission_contended`, `job_request_expired`), and
        the deployment defect `admission_state_invalid`: the first two classes depend
        on the body, the third changes with the request's own identity or deadline,
        and the fourth is a 500 rather than a refusal. Host-level resource headroom
        is not evaluated, because its required vector comes from the request's plan.
        Receipt identity is not classified: a receipt that names another fencing
        token answers 503 `engine_state_mismatch` from a create and is reported here
        as the instance's readiness *window* state. The per-instance rows carry the
        same `valid`/`expiring`/`expired`/`missing`/`invalid` vocabulary the read-only
        `speechnexus-engine-readiness` report prints, plus the slot counters, and
        `capacity` carries the quota counters, so a degraded answer names the lever
        to move.
      parameters:
        - $ref: "#/components/parameters/WorkspaceIdQuery"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: |
            The admission verdict for this deployment: `status: admitting` with a
            null `cause` and a null `detail`, or `status: degraded` with the one
            cause a create would answer and the sentence naming its recovery. The
            status code is 200 in both cases.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdmissionReadiness"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/nexus/jobs/{job_id}:
    get:
      tags: [jobs]
      operationId: getJob
      summary: Get job state and committed artifacts
      parameters:
        - $ref: "#/components/parameters/JobIdPath"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Current job state.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/nexus/jobs/{job_id}/cancellations:
    post:
      tags: [jobs]
      operationId: cancelJob
      summary: Request idempotent job cancellation
      description: |
        Durably accepts one cancellation intent for the Job and binds the original
        operation/attempt identity. It never submits a new execution, changes
        budgets or meters, or deletes execution/fencing evidence.

        An accepted cancellation on a Job that may have an execution returns 202
        with `status: cancelling` and `cleanup_state: pending`; it is not stop
        evidence. A pending Job with no execution closes directly as 200
        `cancelled`, while a Job whose execution may exist closes only after
        reconciliation proves there is no runnable execution or records verified
        stop evidence. A repeated request then returns 200 with
        the same durable `cancellation_requested_at` and the authoritative terminal
        status. A Job that was already terminal when first requested returns 200
        with that status and `accepted: false`; it is never revived or rewritten.

        A terminal Job whose execution has not confirmed stop reports 409
        `execution_cleanup_pending`; it is neither cancelled nor released. The
        same Idempotency-Key replays the original acceptance and current Job state;
        reusing that key for another Job is 409 `idempotency_conflict`. Unknown
        Jobs and Jobs outside the caller's workspace are 404.

        If acceptance commits before the gateway creates an execution, the gateway
        refuses the submit with `gateway_barrier_fenced` and no runnable execution
        exists. If a dispatcher observed the accepted cancellation before submitting,
        that observation is persisted. The Job closes 200 `cancelled` from such a
        no-execution fact (including a gateway 404 only together with the persisted
        dispatcher observation) or from verified stop evidence; a missing execution
        alone is never treated as a stop.
      parameters:
        - $ref: "#/components/parameters/JobIdPath"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Job already terminal; the terminal receipt is recorded.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobCancellation"
        "202":
          description: Cancellation accepted; reconciliation decides terminal status.
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobCancellation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/JobCancellationConflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/nexus/jobs/{job_id}/retries:
    post:
      tags: [jobs]
      operationId: retryJob
      summary: Create a new job from a terminal job intent
      description: |
        Retry creates a new Job with a new attempt history; it never revives the
        old job. While the old execution is not verifiably stopped, returns 409
        `execution_cleanup_pending`. A malformed `Idempotency-Key` is rejected
        with 400 `invalid_job_request`; an unverifiable outcome or an unavailable
        backend returns 503 without creating a second execution.
      parameters:
        - $ref: "#/components/parameters/JobIdPath"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Replacement job accepted.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/nexus/jobs/{job_id}/events:
    get:
      tags: [jobs]
      operationId: streamJobEvents
      summary: Stream durable job events with SSE
      description: |
        SSE `id` is the persistent job event sequence plus one, matching the
        one-based EventSequence value; `Last-Event-ID` resumes strictly after it.
        A malformed `Last-Event-ID` is rejected with 400 `invalid_job_request`,
        and an unavailable backend returns 503. 410 `event_history_expired` is
        returned only when the persisted event history for the job has expired;
        the current implementation has no history-expiry policy and therefore
        never returns it, so clients must still be prepared to read current job
        state on 410. Event data is a JobEvent JSON object.
      parameters:
        - $ref: "#/components/parameters/JobIdPath"
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            $ref: "#/components/schemas/EventSequence"
        - $ref: "#/components/parameters/XRequestId"
      responses:
