openapi: 3.1.0
info:
  title: SpeechNexus operational API
  version: 0.1.0.dev0
  description: |
    Liveness and readiness endpoints shared by SpeechNexus processes. These
    endpoints report process and dependency state only. They do not imply that
    speech, voice, workbench, or engine-control capabilities are enabled.
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Report process liveness
      responses:
        "200":
          description: The process can serve HTTP traffic.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /readyz:
    get:
      operationId: getReadiness
      summary: Report dependency readiness
      responses:
        "200":
          description: Every required dependency is ready.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: At least one required dependency is unavailable.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
components:
  headers:
    XRequestId:
      description: Validated client request ID or a server-generated correlation ID.
      schema:
        type: string
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service, version]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          minLength: 1
          maxLength: 64
        version:
          type: string
          minLength: 1
    ReadinessCheck:
      type: object
      additionalProperties: false
      required: [name, status]
      properties:
        name:
          type: string
          minLength: 1
        status:
          type: string
          enum: [ok, failed]
        detail:
          type: [string, "null"]
    ReadinessResponse:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, unready]
        checks:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ReadinessCheck"
