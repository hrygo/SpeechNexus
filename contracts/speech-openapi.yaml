          type: string
          enum: [none, resource_tightened, quality_reduced]
          default: none
    JobError:
      type: object
      additionalProperties: false
      required: [code, message, retryable]
      properties:
        code:
          type: string
          pattern: "^[a-z][a-z0-9_]{2,63}$"
        message:
          type: string
          minLength: 1
          maxLength: 2000
        retryable:
          type: boolean
        param:
          type: [string, "null"]
          maxLength: 128
