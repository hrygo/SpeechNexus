# The compute-plane node controller as a resident k3s workload.
#
# Rendered from the versioned variable sets rather than checked in with literal
# values, exactly as `compose.yaml` is: `${CONTROLLER_IMAGE}` comes from
# `deploy/cluster/versions.env`, the component token from the Secret the runbook
# creates out of `.runtime/cluster/compute.env`. See `deploy/cluster/README.md`.
#
# This replaces the `controller` service in `compose.yaml`. Unlike that service
# it mounts no container-daemon socket: with `RUNTIME=k8s` the driver creates
# engine Pods through the API server, and a socket here would be a second,
# unused path to the same host.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: controller-state
  namespace: speechnexus
spec:
  accessModes: ["ReadWriteOnce"]
  # The intent store is a SQLite file: exactly one controller may write it, so
  # the Deployment below is pinned to one replica and a Recreate rollout.
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-controller
  namespace: speechnexus
  labels:
    app: speechnexus-node-controller
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: speechnexus-node-controller
  template:
    metadata:
      labels:
        app: speechnexus-node-controller
    spec:
      serviceAccountName: speechnexus-node-controller
      # The gateway reaches the controller at loopback, exactly as it did when
      # this ran as a compose service, and that path is also what the bridge
      # tunnel forwards (18020 -> host 127.0.0.1:8022). Sharing the host network
      # namespace keeps both working and lets the controller bind loopback, so
      # the replacement is reachability-identical to the service it replaces.
      # Moving to a Service instead means also moving the gateway, which is a
      # separate change.
      hostNetwork: true
      # Without this a host-network Pod inherits the node's resolver and cannot
      # see cluster DNS.
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: controller
          image: ${CONTROLLER_IMAGE}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8022
          env:
            - name: SPEECHNEXUS_CONTROLLER_ENVIRONMENT
              value: production
            - name: SPEECHNEXUS_CONTROLLER_NODE_ID
              value: node-megacube-1
            # Loopback, same as the compose service: sharing the host network
            # namespace means the Pod can bind it, and nothing off-host can
            # reach it.
            - name: SPEECHNEXUS_CONTROLLER_HOST
              value: 127.0.0.1
            - name: SPEECHNEXUS_CONTROLLER_PORT
              value: "8022"
            - name: SPEECHNEXUS_CONTROLLER_COMPONENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: controller-component-token
                  key: token
            - name: SPEECHNEXUS_CONTROLLER_APPROVED_TEMPLATES_FILE
              value: /etc/speechnexus/approved-templates.json
            - name: SPEECHNEXUS_CONTROLLER_INTENT_STORE_PATH
              value: /var/lib/speechnexus/controller/intents.sqlite3
            # The whole point of the port: the driver under test is the Pod one.
            - name: SPEECHNEXUS_CONTROLLER_RUNTIME
              value: k8s
            - name: SPEECHNEXUS_CONTROLLER_K8S_NAMESPACE
              value: speechnexus
            - name: SPEECHNEXUS_CONTROLLER_K8S_SERVICE_ACCOUNT_NAME
              value: speechnexus-node-controller
            # The engine's share of one GPU, stated as a ratio or derived from the
            # budget plus the card's size. A template that asks for a GPU with none
            # of these stated is refused at prepare: omitting them is not neutral
            # because vLLM then claims 92% of the device, which fails wherever the
            # card is shared (#1262).
            - name: SPEECHNEXUS_CONTROLLER_ENGINE_GPU_MEMORY_MIB
              value: "${CONTROLLER_ENGINE_GPU_MEMORY_MIB}"
            - name: SPEECHNEXUS_CONTROLLER_ENGINE_GPU_TOTAL_MIB
              value: "${CONTROLLER_ENGINE_GPU_TOTAL_MIB}"
            - name: SPEECHNEXUS_CONTROLLER_ENGINE_GPU_MEMORY_UTILIZATION
              value: "${CONTROLLER_ENGINE_GPU_MEMORY_UTILIZATION}"
          # Probed on loopback, not on the Pod IP: the server binds the host's
          # loopback by design, so a probe against 10.42.x would never connect
          # and the kubelet would restart a healthy controller.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
              host: 127.0.0.1
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              host: 127.0.0.1
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: approved-templates
              mountPath: /etc/speechnexus
              readOnly: true
            - name: controller-state
              mountPath: /var/lib/speechnexus/controller
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: approved-templates
          configMap:
            name: controller-approved-templates
        - name: controller-state
          persistentVolumeClaim:
            claimName: controller-state
        - name: tmp
          emptyDir: {}
