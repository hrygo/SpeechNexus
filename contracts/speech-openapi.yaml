      tags: [voice-creation]
      operationId: validateVoiceDraftRevision
      summary: Validate a fixed candidate revision
      parameters:
        - $ref: "#/components/parameters/DraftIdPath"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
