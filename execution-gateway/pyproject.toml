[project]
name = "speechnexus-execution-gateway"
version = "0.1.0.dev0"
description = "Controlled execution gateway for SpeechNexus inference engines"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.159.1,<0.160",
  "psycopg[binary]>=3.3.6,<4",
  "psycopg-pool>=3.3,<4",
  "pydantic>=2.14.1,<3",
  "pydantic-settings>=2.16.1,<3",
  "speechnexus-contracts",
  "uvicorn[standard]>=0.54,<0.55",
]

[project.scripts]
speechnexus-gateway = "speechnexus_gateway.main:main"

[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speechnexus_gateway"]

[tool.uv.sources]
speechnexus-contracts = { workspace = true }
