name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.5"
  PNPM_VERSION: "12.14.0"

jobs:
  changes:
    name: "Scope routing and CI / design-token checks"
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      mode: ${{ steps.route.outputs.mode }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify routing boundaries without installing project dependencies
        run: python3 -m unittest discover -s tests/ci -v

      - name: Set up Node.js for dependency-free design checks
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc

      - name: Verify design token guardrails without installing project dependencies
        run: |
          node --test tests/ci/design-tokens.test.mjs
          node scripts/dev-env/validate-design-tokens.mjs

      - name: Route the exact checked-out diff
        id: route
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 scripts/dev-env/ci-routing.py \
            --event="$EVENT_NAME" --base="$BASE_SHA" \
            --output="$GITHUB_OUTPUT" --summary="$GITHUB_STEP_SUMMARY"

  # The committed snapshot is the only render input, so a hand-edited matrix or a
  # stale snapshot-derived view fails here without querying GitHub. Unrelated
  # changes skip the regeneration step and cannot be blocked by this gate.
  delivery_tracking:
    name: "Docs: delivery matrix freshness"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Detect delivery matrix inputs in this change
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ || "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git fetch --no-tags --depth=1 origin "$BASE_SHA"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          inputs=(
            docs/plans/delivery-tracking.md
            docs/plans/delivery-issues.json
            docs/plans/github-issues-snapshot.json
            scripts/dev-env/refresh-implementation-tracker.py
            scripts/dev-env/delivery_tracker.py
          )
          if git diff --name-only "$BASE_SHA" HEAD -- "${inputs[@]}" | grep -q .; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate the delivery matrix from the committed snapshot
        if: steps.scope.outputs.relevant == 'true'
        run: |
          SNAPSHOT_AT="$(python3 -c \
            'import json; print(json.load(open("docs/plans/github-issues-snapshot.json", encoding="utf-8"))["fetched_at"])')"
          python3 scripts/dev-env/refresh-implementation-tracker.py \
            --snapshot docs/plans/github-issues-snapshot.json \
            --snapshot-at "$SNAPSHOT_AT" \
            --output docs/plans/delivery-tracking.md
          git diff --exit-code -- docs/plans/delivery-tracking.md

  python_checks:
    name: "Python: tests, coverage and package build"
    needs: [changes]
    if: ${{ needs.changes.outputs.mode == 'full' || needs.changes.outputs.mode == 'web' || needs.changes.outputs.mode == 'no-db' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Fetch only the compatibility baseline
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags --depth=1 origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          prune-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-packages --all-groups

      - name: Set up Node.js for reproducible contract generation
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc

      - name: Install locked contract generation tools
        run: |
          npm install --global --allow-scripts=pnpm pnpm@${PNPM_VERSION}
          pnpm install --frozen-lockfile

      - name: Install Linux inspection sandbox
        # Only this job executes the real Linux inspection-process tests. The
        # bubblewrap package supplies the executable, not an enabled AppArmor
        # profile. The following separately bounded, approved step loads only
        # the pinned official two rules on this disposable job VM.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap

      - name: Load approved official inspection rules on this temporary VM
        run: python3 scripts/dev-env/ci-inspection-profile.py load

      - name: Verify inspection startup before complete regression
        # Fail the same required job early on an unusable native dependency.
        # The complete coverage run remains unchanged after this real probe.
        run: >-
          uv run pytest -q
          tests/unit/backend/test_audio_inspection_process.py::test_real_worker_sees_only_readonly_input_and_no_host_environment

      - name: Ensure PostgreSQL 16 tools for the private coverage cluster
        run: |
          if [[ ! -x /usr/lib/postgresql/16/bin/initdb ]]; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends --yes postgresql-16
          fi
          test -x /usr/lib/postgresql/16/bin/initdb

      - name: Start isolated versioned object storage for coverage
        run: ./scripts/dev-env/minio-test-service.sh

      - name: Run Python unit, contract, CI and Workbench PG tests with combined coverage
        id: coverage
        env:
          SPEECHNEXUS_TEST_MINIO_ENDPOINT: http://127.0.0.1:59000
          SPEECHNEXUS_TEST_MINIO_ACCESS_KEY: speechnexus_test
          SPEECHNEXUS_TEST_MINIO_SECRET_KEY: synthetic_asset_test_secret
        run: |
          uv run python scripts/dev-env/python-coverage.py run \
            --pg-bin /usr/lib/postgresql/16/bin --workers 2 \
            --output "$RUNNER_TEMP/workbench-pg-coverage.json"

      - name: Preserve full coverage execution evidence
        if: ${{ !cancelled() && (steps.coverage.outcome == 'success' || steps.coverage.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: workbench-pg-full-coverage
          path: |
            ${{ runner.temp }}/workbench-pg-coverage.json
            ${{ runner.temp }}/workbench-pg-coverage-parts/
          if-no-files-found: error
          retention-days: 7

      - name: Report read-only sandbox startup context
        if: failure()
        run: |
          bwrap --version
          python3 - <<'PY'
          import json
          import os
          import platform
          import re
          import subprocess
          from pathlib import Path
          result = {"kernel": platform.release(), "uid": os.getuid()}
          for label, path in {
              "lsm_context": "/proc/self/attr/current",
              "userns_limit": "/proc/sys/user/max_user_namespaces",
              "unprivileged_userns": "/proc/sys/kernel/unprivileged_userns_clone",
              "apparmor_userns_restriction": "/proc/sys/kernel/apparmor_restrict_unprivileged_userns",
          }.items():
              try:
                  result[label] = Path(path).read_text().strip()[:160]
              except OSError as error:
                  result[label] = f"unavailable(errno={error.errno})"
          packages = subprocess.run(
              ["dpkg-query", "-W", "-f=${binary:Package} ${Version} ${db:Status-Status}\n",
               "bubblewrap", "apparmor", "apparmor-profiles"],
              capture_output=True, text=True, check=False, timeout=5,
          )
          result["packages"] = {"returncode": packages.returncode,
                                "stdout": packages.stdout[:1600], "stderr": packages.stderr[:400]}
          result["parser_present"] = Path("/usr/sbin/apparmor_parser").is_file()
          result["local_overrides"] = {
              name: Path("/etc/apparmor.d/local", name).exists()
              for name in ("bwrap-userns-restrict", "unpriv_bwrap")
          }
          # Read-only audit using the runner's existing sudo access. No parser,
          # profile loading, service restart or security setting change.
          audit = subprocess.run(
              ["sudo", "-n", "/usr/sbin/aa-status", "--json"],
              capture_output=True, text=True, check=False, timeout=5,
          )
          result["profile_audit"] = {"returncode": audit.returncode}
          if audit.returncode == 0:
              try:
                  profiles = json.loads(audit.stdout).get("profiles")
                  if not isinstance(profiles, dict):
                      raise ValueError("Unknown status schema")
                  result["profile_audit"]["format"] = "profiles_dict"
                  result["profile_audit"]["bwrap"] = {
                      name: mode for name, mode in profiles.items() if "bwrap" in name
                  }
              except (ValueError, AttributeError):
                  result["profile_audit"]["format"] = "unavailable"
          else:
              result["profile_audit"]["stderr"] = audit.stderr[:400]
          # Read only recent kernel denials. Emit fixed audit fields for bwrap,
          # never unrelated journal lines or arbitrary command/path arguments.
          kernel_audit = subprocess.run(
              ["sudo", "-n", "journalctl", "--dmesg", "--since=-5min", "-n", "80",
               "--no-pager", "--output=short-iso", '--grep=apparmor="DENIED"'],
              capture_output=True, text=True, check=False, timeout=5,
          )
          fields = ("apparmor", "operation", "profile", "comm", "pid", "error",
                    "capability", "capname", "requested_mask", "denied_mask")
          denials = []
          for line in kernel_audit.stdout.splitlines():
              if "bwrap" not in line or 'apparmor="DENIED"' not in line:
                  continue
              entry = {"timestamp": line.split(maxsplit=1)[0][:40]}
              for field in fields:
                  match = re.search(r'\b' + field + r'=("[^"]*"|\S+)', line)
                  if match:
                      entry[field] = match.group(1).strip('"')[:120]
              denials.append(entry)
          result["recent_bwrap_kernel_denials"] = {
              "returncode": kernel_audit.returncode, "records": denials[:16],
          }
          print(json.dumps(result, sort_keys=True))
          PY

      - name: Verify media toolchain
        run: uv run python scripts/dev-env/media-smoke.py

      - name: Build Python distributions
        run: |
          uv build --all-packages --out-dir dist/python
          uv build --wheel --no-sources deploy/engines/vllm-asr-lifecycle --out-dir dist/python

      - name: Remove only new inspection rules after owned processes stop
        if: always()
        run: python3 scripts/dev-env/ci-inspection-profile.py cleanup

      - name: Preserve inspection policy identity and cleanup evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: inspection-policy-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/speech-inspection-profile/receipt.json
            ${{ runner.temp }}/speech-inspection-profile/bwrap-userns-restrict
            ${{ runner.temp }}/speech-inspection-profile/load-consumed
          if-no-files-found: error
          retention-days: 7

  python_contracts:
    name: "Python: lint, types and contract compatibility"
    needs: [changes]
    if: ${{ needs.changes.outputs.mode == 'full' || needs.changes.outputs.mode == 'web' || needs.changes.outputs.mode == 'no-db' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Fetch only the compatibility baseline
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags --depth=1 origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          prune-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-packages --all-groups

      - name: Set up Node.js for reproducible contract generation
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc

      - name: Install locked contract generation tools
        run: |
          npm install --global --allow-scripts=pnpm pnpm@${PNPM_VERSION}
          pnpm install --frozen-lockfile

      - name: Reject generated contract drift
        run: make contracts-drift

      - name: Check breaking changes to OpenAI-compatible contracts
        if: github.event_name == 'pull_request'
        env:
          CONTRACT_BASE_REF: origin/${{ github.base_ref }}
        run: uv run python scripts/dev-env/check-openai-contract-compat.py --base "$CONTRACT_BASE_REF"

      - name: Check known structural changes to versioned HTTP contracts
        if: github.event_name == 'pull_request'
        env:
          CONTRACT_BASE_REF: origin/${{ github.base_ref }}
        run: make contracts-http-changes

      - name: Check known structural changes to the full speech HTTP source
        if: github.event_name == 'pull_request'
        env:
          CONTRACT_BASE_REF: origin/${{ github.base_ref }}
        run: make contracts-speech-changes

      - name: Check speech route conformance against the current contract
        run: make contracts-route-conformance

      - name: Check known structural changes to coordination request entrypoints
        if: github.event_name == 'pull_request'
        env:
          CONTRACT_BASE_REF: origin/${{ github.base_ref }}
        run: make contracts-coordination-requests

      - name: Check known structural changes to coordination result guarantees
        if: github.event_name == 'pull_request'
        env:
          CONTRACT_BASE_REF: origin/${{ github.base_ref }}
        run: make contracts-coordination-results

      - name: Check declared realtime runtime constraints
        if: github.event_name == 'pull_request'
        env:
          CONTRACT_BASE_REF: origin/${{ github.base_ref }}
        run: make contracts-realtime-changes

      - name: Check Python formatting with Ruff
        run: uv run ruff format --check .

      - name: Lint Python with Ruff
        run: uv run ruff check .

      - name: Check Python types with mypy
        run: uv run mypy

      - name: Check Python module dependency boundaries
        run: uv run lint-imports

      - name: Validate API and event schemas
        run: uv run python scripts/dev-env/validate-contracts.py

  integration_shards:
    name: "Integration ${{ matrix.shard }}: ${{ matrix.shard >= 4 && 'Web + PG/MySQL/MinIO' || 'PG/MySQL/MinIO' }}"
    needs: [changes]
    if: ${{ needs.changes.outputs.mode == 'full' }}
    runs-on: ubuntu-24.04
    # Baseline: the four database partitions need 7-9.5 min of job wall clock.
    # PR #498's Integration 2 attempt 1 stalled at 84% and hit the old 18 min
    # inner ceiling; the same commit passed on retry in 760 s. The old 20 min job
    # left only ~9 s from the inner deadline to job completion. The probe now
    # derives a 25 min ceiling from this 30 min budget with a five-minute
    # setup/cleanup reserve (docs/validation/ci-validation.md). This is headroom
    # for the slow tail and the same work, not a different selection or weaker
    # assertion.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        # The canonical partitioner groups Web consumers into two lanes and
        # ordinary DB cases into four; tools still follow the actual collection.
        shard: [0, 1, 2, 3, 4, 5]
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: speechnexus
          POSTGRES_PASSWORD: speechnexus_test
          POSTGRES_DB: speechnexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U speechnexus -d speechnexus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.4.8
        env:
          MYSQL_ROOT_PASSWORD: speechnexus_test
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -pspeechnexus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Record partition wall-clock start
        # Observation only; the value feeds the timing summary after the run.
        run: echo "SHARD_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          prune-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-packages --all-groups

      - name: Ensure PostgreSQL 16 tools for the private integration cluster
        run: |
          if [[ ! -x /usr/lib/postgresql/16/bin/initdb ]]; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends --yes postgresql-16
          fi
          test -x /usr/lib/postgresql/16/bin/initdb

      - name: Select external tools for this integration partition
        id: integration_tools
        run: |
          uv run python scripts/dev-env/integration-shards.py requirements \
            --index "${{ matrix.shard }}" --count 6 >> "$GITHUB_OUTPUT"

      - name: Set up Node.js for actual contract HTTP consumption
        if: steps.integration_tools.outputs.node_contracts == 'true' || steps.integration_tools.outputs.browser == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc

      - name: Activate pnpm for integration consumers
        if: steps.integration_tools.outputs.node_contracts == 'true' || steps.integration_tools.outputs.browser == 'true'
        run: |
          npm install --global --allow-scripts=pnpm pnpm@${PNPM_VERSION}

      - name: Install locked contract runtime dependencies
        if: steps.integration_tools.outputs.node_contracts == 'true' && steps.integration_tools.outputs.browser != 'true'
        run: |
          pnpm --filter @speechnexus/contracts --prod install --frozen-lockfile --ignore-scripts

      - name: Install locked Web dependencies for browser consumers
        if: steps.integration_tools.outputs.browser == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build actual Web bundles for browser consumers
        if: steps.integration_tools.outputs.browser == 'true'
        run: pnpm build

      - name: Install Chromium for browser consumers
        if: steps.integration_tools.outputs.browser == 'true'
        run: python3 scripts/dev-env/prepare-ci-browser.py

      - name: Start isolated versioned object storage
        run: ./scripts/dev-env/minio-test-service.sh

      - name: Run a complete integration partition with PG, InnoDB and MinIO
        env:
          SPEECHNEXUS_TEST_DATABASE_URL: postgresql://speechnexus:speechnexus_test@127.0.0.1:5432/speechnexus_test
          SPEECHNEXUS_TEST_MYSQL_URL: mysql://root:speechnexus_test@127.0.0.1:3306/
          SPEECHNEXUS_TEST_MINIO_ENDPOINT: http://127.0.0.1:59000
          SPEECHNEXUS_TEST_MINIO_ACCESS_KEY: speechnexus_test
          SPEECHNEXUS_TEST_MINIO_SECRET_KEY: synthetic_asset_test_secret
        run: |
          test -n "$SPEECHNEXUS_TEST_DATABASE_URL"
          test -n "$SPEECHNEXUS_TEST_MYSQL_URL"
          uv run python scripts/dev-env/workbench-pg-probe.py \
            --pg-bin /usr/lib/postgresql/16/bin \
            --integration-shard "${{ matrix.shard }}" --shard-count 6 \
            --shard-report "$RUNNER_TEMP/integration-shard-${{ matrix.shard }}.json" \
            --output "$RUNNER_TEMP/workbench-pg-shard-${{ matrix.shard }}.json"

      - name: Publish integration partition timing
        # Observation only: the summary never decides the job result, which stays
        # bound to the partition run above. A job cancelled at its timeout does
        # not run this step, so a missing summary is itself a timeout signal.
        if: ${{ always() }}
        env:
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          python3 - "$RUNNER_TEMP/integration-shard-${SHARD_INDEX}.json" "$SHARD_INDEX" <<'PY'
          import json
          import os
          import sys
          import time
          from pathlib import Path

          report, index = Path(sys.argv[1]), sys.argv[2]
          entry = {"Job wall clock": "unavailable", "pytest execution": "unavailable"}
          started = os.environ.get("SHARD_STARTED_EPOCH", "")
          if started.isdigit():
              entry["Job wall clock"] = f"{time.time() - int(started):.0f} s"
          try:
              data = json.loads(report.read_text(encoding="utf-8"))
              entry["pytest execution"] = f"{float(data['elapsed_seconds']):.1f} s"
              entry["Selected cases"] = str(len(data["selected"]))
          except (OSError, KeyError, TypeError, ValueError):
              pass
          lines = [f"### Integration partition {index}", "", "| metric | value |", "| --- | --- |"]
          lines.extend(f"| {name} | {value} |" for name, value in entry.items())
          lines.extend(
              [
                  "",
                  "Budget: 30 min job timeout with a 25 min inner probe ceiling.",
                  "A shard consistently above 15 min is split or repartitioned,",
                  "not given a larger timeout (docs/validation/ci-validation.md).",
                  "",
              ]
          )
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as output:
              output.write("\n".join(lines))
          PY

      - name: Preserve integration partition evidence
        if: ${{ always() }}
        # Official v7.0.2; reports contain only test identities and results.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: integration-shard-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/integration-shard-${{ matrix.shard }}.json
            ${{ runner.temp }}/workbench-pg-shard-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  # Full scope still requires actual execution and a complete, disjoint inventory.
  coordination:
    name: "Gate: six-shard integration evidence"
    needs: [changes, integration_shards]
    if: ${{ always() && needs.changes.result == 'success' && needs.changes.outputs.mode == 'full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require every integration shard
        env:
          SHARDS_RESULT: ${{ needs.integration_shards.result }}
        run: |
          if [[ "$SHARDS_RESULT" != success ]]; then
            echo "::error::Integration shards=$SHARDS_RESULT"
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Download integration partition evidence
        # The Node action hung after successful downloads in both client modes.
        # Bound CLI processes; verify archive digests before reading expected files.
        env:
          GH_TOKEN: ${{ github.token }}
          CI_REPOSITORY: ${{ github.repository }}
          CI_RUN_ID: ${{ github.run_id }}
        run: |
          python3 scripts/dev-env/download-integration-evidence.py \
            --repository "$CI_REPOSITORY" --run-id "$CI_RUN_ID" \
            --count 6 --output "$RUNNER_TEMP/integration-shards"

      - name: Verify same-commit collection, partition coverage and actual test outcomes
        run: |
          python3 scripts/dev-env/integration-shards.py check \
            --count 6 --head "$(git rev-parse HEAD)" \
            --reports-dir "$RUNNER_TEMP/integration-shards"

      - name: Publish per-shard timing comparison
        # Observation only: reads the evidence downloaded above and never gates.
        if: ${{ always() }}
        run: |
          python3 - "$RUNNER_TEMP/integration-shards" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          evidence = Path(sys.argv[1])
          lines = ["### Integration shard timing", ""]
          rows = []
          paths = sorted(evidence.glob("integration-shard-*.json")) if evidence.is_dir() else []
          for path in paths:
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
                  rows.append(
                      (
                          int(data["shard_index"]),
                          float(data["elapsed_seconds"]),
                          len(data["selected"]),
                      )
                  )
              except (OSError, KeyError, TypeError, ValueError):
                  continue
          if rows:
              slowest = max(row[1] for row in rows)
              lines.extend(["| shard | pytest execution | selected cases |", "| --- | --- | --- |"])
              for index, seconds, cases in sorted(rows):
                  marker = " (slowest)" if seconds == slowest else ""
                  lines.append(f"| {index} | {seconds:.1f} s{marker} | {cases} |")
          else:
              lines.append("Shard timing unavailable: downloaded evidence is absent.")
          lines.extend(
              [
                  "",
                  "Pair this with each shard job's wall clock. A shard consistently above",
                  "15 min is split, not given a larger timeout",
                  "(docs/validation/ci-validation.md).",
                  "",
              ]
          )
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as output:
              output.write("\n".join(lines))
          PY

  # Require both Python execution and independent static/contract checks.
  python_checks_gate:
    name: "Gate: Python execution and static checks"
    needs: [changes, python_checks, python_contracts]
    if: ${{ always() && needs.changes.result == 'success' && (needs.changes.outputs.mode == 'full' || needs.changes.outputs.mode == 'web' || needs.changes.outputs.mode == 'no-db') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require Python test/build and static/contract jobs to succeed
        env:
          CHECKS_RESULT: ${{ needs.python_checks.result }}
          CONTRACTS_RESULT: ${{ needs.python_contracts.result }}
        run: |
          if [[ "$CHECKS_RESULT" != success || "$CONTRACTS_RESULT" != success ]]; then
            echo "::error::Python execution=$CHECKS_RESULT; contracts=$CONTRACTS_RESULT"
            exit 1
          fi

  # The reusable workflow always reports its scope; its own gate requires both
  # matrix members when applicable and only accepts a skip when inapplicable.
  node_controller_image:
    name: "Node Controller image evidence"
    needs: [changes]
    if: ${{ always() && needs.changes.result == 'success' }}
    uses: ./.github/workflows/node-controller-image.yml

  # Branch protection must use this gate's display name. Only a successful route
  # can make a lane inapplicable; unexpected skipping or failure cannot pass.
  python:
    name: "Gate: required checks for this change"
    needs:
      [
        changes,
        delivery_tracking,
        python_checks_gate,
        coordination,
        web,
        deployment,
        node_controller_image,
      ]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require successful routing and every applicable CI result
        env:
          MODE: ${{ needs.changes.outputs.mode }}
          ROUTING_RESULT: ${{ needs.changes.result }}
          DELIVERY_RESULT: ${{ needs.delivery_tracking.result }}
          CHECKS_RESULT: ${{ needs.python_checks_gate.result }}
          COORDINATION_RESULT: ${{ needs.coordination.result }}
          WEB_RESULT: ${{ needs.web.result }}
          DEPLOYMENT_RESULT: ${{ needs.deployment.result }}
          CONTROLLER_RESULT: ${{ needs.node_controller_image.result }}
          CONTROLLER_REQUIRED: ${{ needs.node_controller_image.outputs.required }}
        run: |
          if [[ "$ROUTING_RESULT" != success ]]; then
            echo "::error::CI routing=$ROUTING_RESULT"
            exit 1
          fi
          if [[ "$DELIVERY_RESULT" != success ]]; then
            echo "::error::Delivery matrix freshness=$DELIVERY_RESULT"
            exit 1
          fi
          if [[ "$CONTROLLER_RESULT" != success ]]; then
            echo "::error::Node Controller image evidence=$CONTROLLER_RESULT"
            exit 1
          fi
          case "$CONTROLLER_REQUIRED" in
            true|false) ;;
            *) echo '::error::Missing or invalid Node Controller image scope'; exit 1 ;;
          esac
          case "$MODE" in
            docs)
              checks=skipped; coordination=skipped; web=skipped; deployment=skipped ;;
            web)
              checks=success; coordination=skipped; web=success; deployment=skipped ;;
            no-db)
              checks=success; coordination=skipped; web=success; deployment=success ;;
            full)
              checks=success; coordination=success; web=success; deployment=success ;;
            *)
              echo "::error::Missing or invalid CI scope"
              exit 1 ;;
          esac
          if [[ "$CHECKS_RESULT" != "$checks" || "$COORDINATION_RESULT" != "$coordination" ||
                "$WEB_RESULT" != "$web" || "$DEPLOYMENT_RESULT" != "$deployment" ]]; then
            echo "::error::Scope=$MODE; Python=$CHECKS_RESULT; PG/InnoDB=$COORDINATION_RESULT; Web=$WEB_RESULT; deployment=$DEPLOYMENT_RESULT"
            exit 1
          fi
          echo "Verified scope=$MODE; inapplicable lanes are not application-test evidence."

  web:
    name: "Web: lint, types, tests, build and accessibility"
    needs: [changes]
    if: ${{ needs.changes.outputs.mode == 'full' || needs.changes.outputs.mode == 'web' || needs.changes.outputs.mode == 'no-db' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc

      - name: Activate pnpm
        run: |
          npm install --global --allow-scripts=pnpm pnpm@${PNPM_VERSION}

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify OpenAI JavaScript SDK contract parity
        run: pnpm test:contracts-sdk

      - name: Check Web and configuration formatting with Prettier
        run: pnpm format:check

      - name: Lint Web code and validate design tokens
        run: pnpm lint

      - name: Check workspace TypeScript types
        run: pnpm typecheck

      - name: Run workspace unit and component tests
        run: pnpm test

      - name: Build workspace packages and Web applications
        run: pnpm build

      - name: Install Chromium headless shell for accessibility checks
        run: python3 scripts/dev-env/prepare-ci-browser.py

      - name: Check rendered accessibility and contrast
        id: a11y
        run: pnpm test:a11y

      - name: Preserve accessibility evidence
        if: ${{ !cancelled() && (steps.a11y.outcome == 'success' || steps.a11y.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: web-accessibility-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: error
          retention-days: 7

  deployment:
    name: "Compose: configuration validation"
    needs: [changes]
    if: ${{ needs.changes.outputs.mode == 'full' || needs.changes.outputs.mode == 'no-db' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate Compose configuration without starting services
        run: |
          docker compose \
            --env-file deploy/compose.env.example \
            -f deploy/compose.yaml \
            config --quiet
