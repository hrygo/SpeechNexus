[project]
name = "speechnexus-media"
version = "0.1.0.dev0"
description = "Bounded native media facts and isolated inspection for SpeechNexus"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = []

[project.optional-dependencies]
audio = ["av>=19,<20", "numpy>=2.2,<3"]

[project.scripts]
speechnexus-inspect-audio = "speechnexus_media.inspection:main"

[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speechnexus_media"]

[tool.hatch.build.targets.wheel.force-include]
"source-inventory.json" = "speechnexus_media/source-inventory.json"
