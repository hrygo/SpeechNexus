# Compute plane: gateway, controller and job dispatch on the compute host.
#
# Plain Compose file with ${VAR} references; Compose resolves them from the env
# file passed with --env-file (.runtime/cluster/compute.env, generated by
# deploy/cluster/init-env.py). No template renderer, no credentials in the file.
#
#   docker compose --env-file compute.env -f compose.yaml up -d
services:
  # The gateway refuses configuration it does not own (uid must match, mode 0600);
  # a host bind mount cannot satisfy that inside a non-root container, so the files
  # are staged into a volume with the runtime uid and a private mode.
  config-init:
    image: ${PYTHON_IMAGE}
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - install -o 10001 -g 10001 -m 600 /src/gateway-file-asr.json /out/gateway-file-asr.json &&
        install -o 10001 -g 10001 -m 600 /src/gateway-file-asr-endpoint.json /out/gateway-file-asr-endpoint.json &&
        install -o 10001 -g 10001 -m 400 /src/silero_vad.onnx /out/silero_vad.onnx &&
        install -d -o 10001 -g 10001 -m 700 /spool /ingress /controller
    volumes:
      - ./gateway-file-asr.json:/src/gateway-file-asr.json:ro
      - ./gateway-file-asr-endpoint.json:/src/gateway-file-asr-endpoint.json:ro
      - ${SILERO_VAD_PATH}:/src/silero_vad.onnx:ro
      - gateway-config:/out
      - gateway-spool:/spool
      - gateway-ingress:/ingress
      - controller-state:/controller

  gateway:
    image: ${PYTHON_IMAGE}
    network_mode: host
    depends_on:
      config-init:
        condition: service_completed_successfully
    command: ["speechnexus-gateway"]
    environment:
      SPEECHNEXUS_GATEWAY_ENVIRONMENT: development
      SPEECHNEXUS_GATEWAY_NODE_ID: node-megacube-1
      SPEECHNEXUS_GATEWAY_GATEWAY_ID: gateway-megacube-1
      SPEECHNEXUS_GATEWAY_LOG_LEVEL: info
      SPEECHNEXUS_GATEWAY_CONTROL_TIMEOUT_SECONDS: "20"
      SPEECHNEXUS_GATEWAY_HOST: 127.0.0.1
      SPEECHNEXUS_GATEWAY_PORT: "8010"
      SPEECHNEXUS_GATEWAY_CONTROL_DATABASE_URL: ${COMPUTE_GATEWAY_CONTROL_DATABASE_URL}
      SPEECHNEXUS_GATEWAY_CONTROL_QUERY_DATABASE_URL: ${COMPUTE_GATEWAY_QUERY_DATABASE_URL}
      SPEECHNEXUS_GATEWAY_COMPONENT_TOKEN: ${COMPONENT_TOKEN}
      SPEECHNEXUS_GATEWAY_INGRESS_LOCK_DIRECTORY: /var/lib/speechnexus/ingress
      SPEECHNEXUS_GATEWAY_FILE_ASR_CONFIG_FILE: /etc/speechnexus/gateway-file-asr.json
      SPEECHNEXUS_GATEWAY_FILE_ASR_OBJECT_ACCESS_KEY: ${MINIO_ROOT_USER}
      SPEECHNEXUS_GATEWAY_FILE_ASR_OBJECT_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    volumes:
      - gateway-config:/etc/speechnexus:ro
      - gateway-spool:/var/lib/speechnexus/spool
      - gateway-ingress:/var/lib/speechnexus/ingress
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  controller:
    image: ${CONTROLLER_IMAGE}
    network_mode: host
    environment:
      SPEECHNEXUS_CONTROLLER_ENVIRONMENT: production
      SPEECHNEXUS_CONTROLLER_NODE_ID: node-megacube-1
      SPEECHNEXUS_CONTROLLER_HOST: 127.0.0.1
      SPEECHNEXUS_CONTROLLER_PORT: "8022"
      SPEECHNEXUS_CONTROLLER_COMPONENT_TOKEN: ${COMPONENT_TOKEN}
      SPEECHNEXUS_CONTROLLER_APPROVED_TEMPLATES_FILE: /etc/speechnexus/approved-templates.json
      SPEECHNEXUS_CONTROLLER_INTENT_STORE_PATH: /var/lib/speechnexus/controller/intents.sqlite3
      SPEECHNEXUS_CONTROLLER_DOCKER_SOCKET_PATH: /var/run/docker.sock
      # Engine share of one GPU. Listed explicitly because this file enumerates
      # env instead of inheriting the file, and because the bound has to be stated
      # somewhere: a GPU template with none of these three is refused at prepare
      # instead of starting an engine that claims 92% of the card (#1262).
      # The budget and the card's size derive the ratio; stating the ratio
      # directly overrides the derivation.
      SPEECHNEXUS_CONTROLLER_ENGINE_GPU_MEMORY_MIB: ${SPEECHNEXUS_CONTROLLER_ENGINE_GPU_MEMORY_MIB}
      SPEECHNEXUS_CONTROLLER_ENGINE_GPU_TOTAL_MIB: ${SPEECHNEXUS_CONTROLLER_ENGINE_GPU_TOTAL_MIB}
      SPEECHNEXUS_CONTROLLER_ENGINE_GPU_MEMORY_UTILIZATION: ${SPEECHNEXUS_CONTROLLER_ENGINE_GPU_MEMORY_UTILIZATION}
    group_add: ["988"]
    depends_on:
      config-init:
        condition: service_completed_successfully
    volumes:
      - ./approved-templates.json:/etc/speechnexus/approved-templates.json:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - controller-state:/var/lib/speechnexus/controller
    restart: unless-stopped

  # Superseded by the `job-dispatch` Deployment in `deploy/cluster/app-plane`.
  # Claiming from here means crossing the bridge on every round: a measured 115 s
  # per round against 0.15 s next to the database, while the binding's admission
  # deadline is 120 s, so Jobs expired before dispatch (issues #1234 and #1250).
  # Kept, not deleted, as the fallback documented in `deploy/cluster/README.md`;
  # never run it alongside the Deployment.
  dispatch:
    image: ${PYTHON_IMAGE}
    network_mode: host
    command: ["speechnexus-job-dispatch-worker"]
    environment:
      SPEECHNEXUS_PROCESS_ROLE: job-worker
      SPEECHNEXUS_NODE_ID: node-app-1
      SPEECHNEXUS_INSTANCE_ID: dispatch-1
      SPEECHNEXUS_DATABASE_URL: ${COMPUTE_JOB_DISPATCH_DATABASE_URL}
      SPEECHNEXUS_DATABASE_SCHEMA: speech
      SPEECHNEXUS_EXECUTION_GATEWAY_BASE_URL: http://127.0.0.1:8010
      SPEECHNEXUS_EXECUTION_GATEWAY_COMPONENT_CREDENTIAL: ${COMPONENT_TOKEN}
      SPEECHNEXUS_EXECUTION_GATEWAY_TIMEOUT_SECONDS: "30"
      SPEECHNEXUS_JOB_GATE_PRIVATE_DIR: /etc/speechnexus
      SPEECHNEXUS_JOB_DISPATCH_KINDS: asr
      SPEECHNEXUS_JOB_DISPATCH_BATCH_SIZE: "8"
      SPEECHNEXUS_JOB_DISPATCH_LEASE_MS: "30000"
      SPEECHNEXUS_JOB_DISPATCH_POLL_SECONDS: "1"
      SPEECHNEXUS_JOB_DISPATCH_JOB_TIMEOUT_SECONDS: "600"
      SPEECHNEXUS_JOB_DISPATCH_MAX_ATTEMPTS: "5"
      SPEECHNEXUS_JOB_DISPATCH_INTERVAL_SECONDS: "5"
      SPEECHNEXUS_JOB_DISPATCH_STORAGE_TIMEOUT_SECONDS: "10"
      SPEECHNEXUS_ARTIFACT_RETENTION_SECONDS: "2592000"
      SPEECHNEXUS_OBJECT_STORAGE_ENDPOINT: http://127.0.0.1:19100
      SPEECHNEXUS_OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET}
      SPEECHNEXUS_EXECUTION_RESULT_BUCKET: ${OBJECT_STORAGE_BUCKET}
      SPEECHNEXUS_OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER}
      SPEECHNEXUS_OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  # The disable worker runs beside the gateway for the same reason the dispatcher
  # does: its runtime refuses a plain-HTTP gateway origin that is not loopback, and
  # the reference Compose starts it in the gateway's own project. Database access
  # goes through the bridge tunnel like every other compute-plane unit.
  binding-disable-worker:
    image: ${PYTHON_IMAGE}
    network_mode: host
    depends_on:
      gateway:
        condition: service_started
    command: ["python", "-m", "speechnexus_backend.binding_disable_worker"]
    environment:
      SPEECHNEXUS_PROCESS_ROLE: binding-disable-worker
      SPEECHNEXUS_DATABASE_SCHEMA: speech
      SPEECHNEXUS_DISABLE_DATABASE_URL: ${COMPUTE_DISABLE_DATABASE_URL}
      SPEECHNEXUS_DISABLE_SETTLEMENT_DATABASE_URL: ${COMPUTE_DISABLE_SETTLEMENT_DATABASE_URL}
      SPEECHNEXUS_DISABLE_NODE_ID: node-megacube-1
      SPEECHNEXUS_DISABLE_GATEWAY_ID: gateway-megacube-1
      SPEECHNEXUS_EXECUTION_GATEWAY_BASE_URL: http://127.0.0.1:8010
      SPEECHNEXUS_EXECUTION_GATEWAY_COMPONENT_CREDENTIAL: ${COMPONENT_TOKEN}
      SPEECHNEXUS_DISABLE_GATEWAY_TIMEOUT_SECONDS: "20"
      SPEECHNEXUS_DISABLE_STORAGE_TIMEOUT_SECONDS: "10"
      SPEECHNEXUS_DISABLE_POLL_SECONDS: "1"
      SPEECHNEXUS_DISABLE_BATCH_SIZE: "64"
      SPEECHNEXUS_DISABLE_WAIT_TIMEOUT_MS: "1000"
    read_only: true
    tmpfs: ["/tmp:size=32m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  # The controller does not publish engine ports, so an engine it prepares is only
  # reachable on its Docker network. The binding endpoint and the bridge tunnel
  # address 127.0.0.1:18190, so this forwards that loopback port to the container.
  # Development adapter for a real gap; see docs/plans/2026-11-21-environment-isomorphism.md.
  engine-shim:
    image: ${PYTHON_IMAGE}
    network_mode: host
    command: ["python", "/opt/engine-port-shim.py"]
    environment:
      SPEECHNEXUS_ENGINE_SHIM_TARGET: ${ENGINE_ADDRESS:?set ENGINE_ADDRESS to the engine container address after prepare}
      SPEECHNEXUS_ENGINE_SHIM_LISTEN_PORT: "18190"
    volumes:
      - ./engine-port-shim.py:/opt/engine-port-shim.py:ro
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

volumes:
  gateway-config:
  gateway-spool:
  gateway-ingress:
  controller-state:
